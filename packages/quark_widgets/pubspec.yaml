name: quark_widgets
description: Reusable, app-independent Flutter widgets and design tokens for Quark.
version: 0.1.0

publish_to: none

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  markdown: ^7.1.0
  material_ui: ^1.2.0
  quark_icons:
    path: ../quark_icons

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mark.png
  fonts:
    # Static cuts of the variable fonts. Flutter selects a family member by
    # fontWeight and does not drive a variable font's weight axis from it.
    - family: Geist
      fonts:
        - asset: fonts/Geist-Regular.ttf
        - asset: fonts/Geist-Medium.ttf
          weight: 500
        - asset: fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: fonts/Geist-Bold.ttf
          weight: 700
    - family: Newsreader
      fonts:
        - asset: fonts/Newsreader-Regular.ttf
        - asset: fonts/Newsreader-Medium.ttf
          weight: 500
        - asset: fonts/Newsreader-SemiBold.ttf
          weight: 600
        - asset: fonts/Newsreader-Bold.ttf
          weight: 700
