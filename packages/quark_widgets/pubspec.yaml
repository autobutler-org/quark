name: quark_widgets
description: Reusable, app-independent Flutter widgets and design tokens for Quark.
version: 0.1.0

publish_to: none

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  markdown: ^7.1.0
  material_ui: ^1.2.0
  quark_icons:
    path: ../quark_icons

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
