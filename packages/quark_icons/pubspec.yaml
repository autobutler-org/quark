name: quark_icons
description: Custom icon font for Quark — spreadsheet and app-specific icons not covered by Material Icons.
version: 0.1.0

publish_to: none

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  fonts:
    - family: QuarkIcons
      fonts:
        - asset: fonts/QuarkIcons.ttf
