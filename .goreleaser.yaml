# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

version: 2

project_name: quark

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # you may remove this if you don't need go generate
    - go generate ./...

builds:
  - main: ./cmd/quark/main.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/autobutler-org/quark/pkg/util/versionutil.Semver={{.Version}}
      # The key-provisioning secret (#1876). It ships in every binary, so it is not
      # secret from anyone holding one; see pkg/util/provisionutil. `index` keeps a
      # local run without it working: that build just cannot enable remote access.
      - -X github.com/autobutler-org/quark/pkg/util/provisionutil.provisioningSecret={{ index .Env "QUARK_PROVISIONING_SECRET" }}

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: autobutler-org
    name: quark
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).

blobs:
  - provider: azblob
    bucket: releases?storage_account=quarkrelease
