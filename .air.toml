# Air configuration for hot-reloading the quark backend.
# https://github.com/air-verse/air
#
# This file does not choose a scheme or port — the caller does, by setting
# QUARK_INSECURE in the environment. Air passes its own environment through to
# the binary it runs, so the Makefile targets select the mode:
#
#   make watch/backend          QUARK_INSECURE=true  -> plain HTTP  on :8080
#   make watch/backend/secure   (unset)              -> HTTPS       on :443, self-signed
#
# Running `air` directly inherits whatever your shell has set; with nothing set
# that means the secure path (HTTPS on :443), which needs root on Linux.
# Prefix any backend target with AS_ROOT=1 to run it under sudo.

root = "."
tmp_dir = "tmp"

[build]
  # Build command. With AS_ROOT=1 the Makefile runs air itself under sudo, so
  # this rebuild inherits root too.
  cmd = "make build/backend"

  # Binary to run after a successful build
  entrypoint = ["./build/quark"]

  # Arguments passed to the binary on startup. The TLS mode is deliberately not
  # set here — see the header comment; QUARK_INSECURE in the environment picks it.
  args_bin = ["serve"]

  # Directories to ignore when watching for changes.
  # Flutter/Dart dirs excluded so frontend edits don't trigger a backend rebuild.
  exclude_dir = [
    ".dart_tool",
    ".idea",
    ".ralph",
    "app",
    "build",
    "cd",
    "datalinks",
    "deploy",
    "docs",
    "internal/db",
		"node_modules",
    "os",
    "packages",
    "scripts",
    "sql",
    "android",
    "ios",
    "lib",
  ]

  # Only watch Go source files
  include_ext = ["go"]

  # Ignore test files — tests are run separately
  exclude_regex = ["_test\\.go$"]

  # Milliseconds to wait before rebuilding after a change
  delay = 1000

  stop_on_error = false
  send_interrupt = false
  kill_delay = "0s"

[log]
  time = false
  silent = false

[color]
  build = "yellow"
  runner = "green"
  watcher = "cyan"
  main = "magenta"

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
