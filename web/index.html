<!doctype html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="Quark — your own cloud, at home." />
    <meta name="theme-color" content="#070D19" />

    <!--
      The theme picked in Settings, applied before the splash below paints, so
      someone who chose Light does not sit through a dark splash (#2341).
      AppSettings saves it through shared_preferences, which on web is
      localStorage under a `flutter.` prefix, JSON-encoded. System, a missing
      value, or storage that throws (a private window) follows the OS.
    -->
    <script>
      (function () {
        var saved = null;
        try {
          saved = JSON.parse(localStorage.getItem("flutter.themeMode"));
        } catch (e) {}
        var theme =
          saved === "light" || saved === "dark"
            ? saved
            : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.setAttribute("data-theme", theme);
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", theme === "light" ? "#F8FAFC" : "#070D19");
      })();
    </script>

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Quark" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Quark</title>
    <link rel="manifest" href="manifest.json" />

    <!--
      Flutter parks a hidden <textarea> over the canvas to drive text input and
      keeps it invisible with `color: transparent`. Firefox refuses to paint
      selected text in a color it considers invisible, so as soon as you select
      anything in the document editor it inverts that transparent to opaque
      white — the textarea's own copy of the text appears on top of the canvas,
      wrapped differently because it falls back to a different font (#1747).
      Naming the selection colors here keeps Firefox from substituting its own.
    -->
    <style>
      .flt-text-editing::selection {
        background-color: transparent;
        color: transparent;
      }

      /*
        The splash below stands in for the app until Flutter paints its first
        frame. Downloading and starting the bundle takes seconds on a cold
        load, and a blank white viewport for that long reads as broken (#2019).

        Its colors are QuarkTokens, copied rather than imported because
        nothing Dart has loaded yet. Dark is the app's default appearance;
        `data-theme`, set by the script in the head from the saved theme,
        picks light. Without it, light follows the OS the way ThemeMode.system
        does.
      */
      :root {
        color-scheme: dark;
        --quark-background: #070d19;
        --quark-foreground: #e2e8f0;
        --quark-muted: #94a3b8;
        --quark-border: #1e293b;
        --quark-primary: #0ea5e9;
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --quark-background: #f8fafc;
        --quark-foreground: #0f172a;
        --quark-muted: #64748b;
        --quark-border: #e2e8f0;
      }

      @media (prefers-color-scheme: light) {
        :root:not([data-theme]) {
          color-scheme: light;
          --quark-background: #f8fafc;
          --quark-foreground: #0f172a;
          --quark-muted: #64748b;
          --quark-border: #e2e8f0;
        }
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: var(--quark-background);
      }

      #quark-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 0 16px;
        box-sizing: border-box;
        background-color: var(--quark-background);
        color: var(--quark-foreground);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        /* Above the canvas, so the app is never half-drawn underneath it. */
        z-index: 2;
        transition: opacity 200ms ease-out;
      }

      /* Set once Flutter has painted; the element is removed when it ends. */
      #quark-splash.quark-splash-done {
        opacity: 0;
        pointer-events: none;
      }

      /*
        A debug `flutter run` pins its own blue bar to the top of the page
        and only takes it down on `dart-app-ready`, which can land well after
        the splash has gone. The splash already says the app is loading.
      */
      .flutter-loader {
        display: none;
      }

      #quark-splash .quark-wordmark {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      #quark-splash .quark-status {
        font-size: 14px;
        color: var(--quark-muted);
      }

      /*
        The Atom loader from loading.dev (loading-dev 0.3.4, MIT (c) 2026
        Jakub Krehel), ported to plain CSS: a shell with three rings tilted
        60deg apart, each spinning a third of a turn behind the last. 36px
        matches QuarkLoader's default, the footprint of a
        CircularProgressIndicator.
      */
      #quark-splash .quark-atom {
        position: relative;
        width: 36px;
        height: 36px;
        color: var(--quark-primary);
      }

      #quark-splash .quark-atom-shell {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        border: 1.98px solid var(--quark-border);
        border-radius: 9999px;
      }

      #quark-splash .quark-atom-orbit {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        transform: rotate(calc(var(--quark-atom-index) * 60deg)) rotateX(90deg);
      }

      #quark-splash .quark-atom-spin {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        transform-origin: center;
        animation: quark-atom-rotate 1000ms linear infinite;
        animation-delay: calc(1000ms * (var(--quark-atom-index) - 3) / 3);
      }

      #quark-splash .quark-atom-ring {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        border: 1.62px solid currentColor;
        border-radius: 9999px;
        transform: rotateX(90deg);
      }

      @keyframes quark-atom-rotate {
        to {
          transform: rotate(360deg);
        }
      }

      /*
        A wait is reassuring; a spinning atom for someone who asked for
        stillness is not. The rings hold still and the loader pulses instead.
      */
      @media (prefers-reduced-motion: reduce) {
        #quark-splash {
          transition: none;
        }

        #quark-splash .quark-atom {
          animation: quark-atom-pulse 1.6s ease-in-out infinite alternate;
        }

        #quark-splash .quark-atom-spin {
          animation: none;
          transform: rotate(60deg);
        }
      }

      @keyframes quark-atom-pulse {
        from {
          opacity: 0.25;
        }
        to {
          opacity: 0.8;
        }
      }
    </style>
  </head>
  <body>
    <!--
      Static markup and inline styles, so this paints on the first pass, before
      any of the bundle has arrived. The logo is its one request.
    -->
    <div id="quark-splash" role="status" aria-live="polite">
      <!-- The PWA icon: a small file that is already in the web build. -->
      <img
        src="icons/Icon-192.png"
        width="72"
        height="72"
        alt=""
      />
      <div class="quark-wordmark">Quark</div>
      <div class="quark-status">Starting your Quark…</div>
      <div class="quark-atom" aria-hidden="true">
        <div class="quark-atom-shell"></div>
        <div class="quark-atom-orbit" style="--quark-atom-index: 0">
          <div class="quark-atom-spin"><div class="quark-atom-ring"></div></div>
        </div>
        <div class="quark-atom-orbit" style="--quark-atom-index: 1">
          <div class="quark-atom-spin"><div class="quark-atom-ring"></div></div>
        </div>
        <div class="quark-atom-orbit" style="--quark-atom-index: 2">
          <div class="quark-atom-spin"><div class="quark-atom-ring"></div></div>
        </div>
      </div>
    </div>

    <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
    <script src="flutter_bootstrap.js" async></script>
    <script>
      // The engine fires this once the first frame is on screen, which is the
      // only moment that means "there is something to look at". A timer would
      // either uncover a blank canvas early or sit on top of a drawn app.
      window.addEventListener("flutter-first-frame", function () {
        window.clearTimeout(devReload);
        var splash = document.getElementById("quark-splash");
        if (!splash) return;
        splash.classList.add("quark-splash-done");
        splash.addEventListener("transitionend", function () {
          splash.remove();
        });
        // transitionend never fires when the fade is disabled for reduced
        // motion, so the element still has to go on its own.
        window.setTimeout(function () {
          splash.remove();
        }, 400);
      });

      // `flutter run -d web-server` serves this page before its first compile
      // finishes, and a load that starts then stalls without an error, so
      // the splash above never clears (#2234). A dev (DDC) build keeps
      // reloading until the app starts. Only the DDC bootstrap defines
      // $dartCreateScript, so a slow production load is never cut off.
      // ponytail: fixed 10s; a healthy dev load slower than that reloads forever.
      var devReload = window.setTimeout(function () {
        if (window.$dartCreateScript) window.location.reload();
      }, 10000);
    </script>
  </body>
</html>
