        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Unknown device
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Empty the trash
      tags:
      - trash
  /trash/restore:
    post:
      consumes:
      - application/json
      description: Moves trashed items back to where they were deleted from. An item
        with a path restores only that file or folder from inside a trashed folder,
        to the folder's original path joined with it, recreating missing parent folders;
        the trashed folder keeps the rest. Every item is checked first, so a batch
        naming an unknown item, one whose destination is now occupied, or two whose
        destinations overlap restores nothing; nothing is ever overwritten.
      parameters:
      - description: 'Device serial and the items to restore: a trash name, plus a
          path inside a trashed folder to restore only that'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_trash.trashItemsRequest'
