          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Rename a photo album
      tags:
      - albums
  /auth/account:
    delete:
      consumes:
      - application/json
      description: 'Deletes the selected aspects and logs the caller out everywhere.
        Pass account=true to delete only the caller''s own account, which is what
        App Store Guideline 5.1.1(v) requires; the other aspects are a factory reset
        of the appliance. All four are opt-in and a request selecting none is rejected,
        so a truncated call cannot destroy anything. The JSON body must carry the
        caller''s own password, which is checked before anything is deleted; it travels
        in the body rather than the URL so it never reaches an access or proxy log.
        Attempts share the per-IP limit of the sign-in endpoints, so this endpoint
        cannot be used to guess the password. Databases are dropped and re-migrated
        in place, so no restart is required. Repeat calls are idempotent while the
        account exists. External device data is reached only when devices=true; a
        drive that is not attached at reset time keeps its data. Deleting the last
        account returns the appliance to first-boot setup by design. Aspects are independent:
        deleting the account or the database does NOT delete stored files, and files
        left behind are readable by whoever sets the appliance up next — the response
        reports filesRetained=true whenever that happens, so pass files=true as well
        to erase the data itself.'
      parameters:
      - description: Delete the caller's own account (users row). Does NOT delete
          stored files unless files=true is also passed; files left behind stay readable
          by whoever sets the appliance up next.
        in: query
        name: account
        type: boolean
      - description: Delete the appliance databases (quark.db, quark.health.db). Does
          NOT delete stored files unless files=true is also passed; files left behind
          stay readable by whoever sets the appliance up next.
        in: query
        name: database
        type: boolean
      - description: Delete stored files under the data directory
        in: query
        name: files
        type: boolean
      - description: Delete the Quark data directory on attached external devices
        in: query
        name: devices
        type: boolean
      - description: The caller's own password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_auth.deleteAccountBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              deleted:
                properties:
                  account:
                    type: boolean
                  database:
                    type: boolean
                  devices:
                    type: boolean
                  files:
                    type: boolean
                type: object
              filesRetained:
                type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: no session, or the session's account no longer exists
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: the password is wrong, or database, files or devices were requested
            by a non-admin
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: account=true from the only active admin while other active
            or disabled accounts exist; nothing is deleted
          schema:
            $ref: '#/definitions/serverutil.Response'
        "429":
          description: too many attempts from this address; nothing is deleted
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Delete account data (factory reset)
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: 'Authenticates and returns a session token. The body takes one
        of three shapes: {username, password} checks the password; {username, authKey}
        checks the key the client derived from the password and the salt GET /auth/salt
        returned, and is a 401 for an account that has no auth key yet; {username,
        password, authKey} checks the password and gives an account with no auth key
        that one, keeping its password. authKey is the standard base64 of 32 bytes.
        On the first sign-in of an account an admin created, the response also carries
        recoveryPhrase, which is never returned again. legacyRecovery is true for
        an account that has no recovery key yet: an updated client generates a phrase
        and sends its key to PUT /auth/recovery-key (#2430). A pending or disabled
        account with the right password gets 403 with its status, so the app can tell
        it from a wrong password.'
      parameters:
      - description: The username with a password, an authKey, or both
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_auth.credentialsBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_auth.loginResponse'
        "400":
          description: no password or authKey, or a malformed authKey
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: status is pending or disabled
          schema:
            $ref: '#/definitions/v0_auth.accountRefusal'
      summary: Login
      tags:
      - auth
  /auth/logout:
    post:
      description: Invalidates the current session
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /auth/recover:
    post:
      consumes:
      - application/json
      description: 'Resets the named account''s password using its recovery secret:
        exactly one of recoveryPhrase, the raw phrase of an account that has no recovery
        key yet, and recoveryKey, the standard base64 of the 32-byte key the client
        derived from the phrase and the salt GET /auth/salt returned. A wrong key
        reads exactly like a wrong phrase, and an account with a recovery key refuses
        every raw phrase. newRecoveryKey, sent only with newAuthKey, gives the account
        the key of a phrase the client just generated in the same transaction and
        clears the old phrase, so a legacy recovery is also the account''s move to
        a recovery key (#2430). The body carries exactly one of newPassword and newAuthKey,
        the standard base64 of the 32-byte key the client derived from the new password
        and the salt GET /auth/salt returned. Either one replaces both ways of signing
        in: a new password clears the account''s auth key, and a new auth key clears
        its password. chatKeys, when sent, replaces the account''s chat identity in
        the same transaction: the client fetched it from /auth/recover/keys, opened
        it with the phrase and re-wrapped it under the new password (#2416). The body
        is at most 8 KiB.'
      parameters:
      - description: The account, its recovery phrase or key, the new password or
          auth key, and optionally a new recovery key and its re-wrapped chat keys
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_auth.recoverAccountBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: status is pending or disabled
          schema:
            $ref: '#/definitions/v0_auth.accountRefusal'
      summary: Recover account
      tags:
      - auth
  /auth/recover/keys:
    post:
      consumes:
      - application/json
      description: The first step of recovering an account that has chat keys (#2416).
        Checks the recovery phrase or recovery key exactly as /auth/recover does,
        changes nothing, and returns the account's wrapped chat identity so the client
        can open it with the phrase wrap key and send it back re-wrapped under the
        new password in /auth/recover. Needs no session and shares the sign-in rate
        limit. The body carries exactly one of recoveryPhrase and recoveryKey (#2430).
        An unknown username or a wrong key reads as a wrong phrase.
      parameters:
      - description: The account and its recovery phrase or recovery key
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_auth.recoverChatKeysBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.Keys'
        "400":
          description: a wrong phrase or key, an unknown username, a malformed key,
            or neither or both secrets
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: status is pending or disabled
          schema:
            $ref: '#/definitions/v0_auth.accountRefusal'
        "404":
          description: the account has no chat keys yet
          schema:
            $ref: '#/definitions/serverutil.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Fetch chat keys for account recovery
      tags:
      - auth
  /auth/recovery-key:
    put:
      consumes:
      - application/json
      description: Re-confirms the caller with password, which carries the auth key
        for a client that signs in with one, exactly as DELETE /auth/account takes
        it; a wrong or missing password is a 403 and nothing is written. Then gives
        the signed-in account the recovery key its client derived from a recovery
        phrase the client generated, and clears the account's recovery phrase, so
        the old phrase stops recovering it (#2430). recoveryKey is the standard base64
        of the 32-byte key derived from the phrase and the salt GET /auth/salt returned.
        chatKeys, when sent, replaces the account's chat identity in the same transaction,
        re-wrapped under the new phrase, exactly as /auth/recover stores it; nothing
        changes if any part fails. The client calls this after a sign-in whose response
        says legacyRecovery, after the first sign-in of an account an admin created,
        and after setup. Shares the sign-in rate limit, and the body is at most 8
        KiB.
      parameters:
      - description: The caller's password or auth key, the new recovery key and optionally
          the re-wrapped chat keys
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_auth.setRecoveryKeyBody'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: a malformed recoveryKey or chatKeys
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: no session, or the session's account no longer exists
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: the password or auth key is wrong or missing
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: the account has no auth key yet, so no salt to derive the key
            with
          schema:
            $ref: '#/definitions/serverutil.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Set the caller's recovery key
      tags:
      - auth
  /auth/request-account:
    post:
      consumes:
      - application/json
      description: 'Creates a pending account that can sign in once an admin approves
        it, and returns its recovery phrase this once, unless the body carried recoveryKey.
        Needs no session and is rate-limited per IP. A pending request keeps its username
        taken until it is denied. The body carries exactly one of password and authKey,
        the standard base64 of the 32-byte key the client derived from the password
        and the salt GET /auth/salt returned. recoveryKey, sent only with authKey,
        is the standard base64 of the 32-byte key the client derived from a recovery
        phrase it generated and the same salt: the Quark then stores that key, makes
        no phrase, and the response has no recoveryPhrase (#2430).'
      parameters:
      - description: The username with a password or an authKey, and optionally a
          recoveryKey
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_auth.newAccountBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v0_auth.requestAccountResponse'
        "400":
          description: invalid username, password, authKey or recoveryKey, or a recoveryKey
            without an authKey
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: requests are turned off, or the Quark is not set up
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: that username is taken
          schema:
            $ref: '#/definitions/serverutil.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Request an account
      tags:
      - auth
  /auth/salt:
    get:
      description: 'Returns the salt a client derives the named account''s auth key
        with, as the standard base64 of 16 bytes. Needs no session and is rate-limited
        per IP. A username with no account gets a salt too, the same one every time,
        so the answer does not say whether the account exists. legacy is true for
        an account that has no auth key yet: the client signs in with both password
        and authKey to give it one. legacyRecovery is true for an account that has
        no recovery key yet, which recovers with its raw phrase; an unknown username
        reads false for both, like an account that has moved to keys.'
      parameters:
      - description: The account's username
        in: query
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_auth.saltResponse'
        "400":
          description: no username
          schema:
            $ref: '#/definitions/serverutil.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Get the salt for an auth key
      tags:
      - auth
  /auth/sessions:
    delete:
      description: Deletes every session of the authenticated user except the one
        the request was authenticated with. A request authenticated without a session
        (HTTP Basic) has none to keep, so every session is deleted.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              revoked:
                type: boolean
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Revoke all other sessions (sign out everywhere else)
      tags:
      - auth
    get:
      description: Returns all non-expired sessions for the authenticated user. Each
        session is identified by the SHA-256 hash of its token — pass this ID to DELETE
        /auth/sessions/{id} to revoke a specific session. The session the request
        was authenticated with has current=true.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              sessions:
                items:
                  $ref: '#/definitions/authutil.SessionInfo'
                type: array
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List active sessions
      tags:
      - auth
  /auth/sessions/{id}:
    delete:
      description: Deletes a specific session. The session ID is the SHA-256 hex hash
        of the session token, as returned by GET /auth/sessions.
      parameters:
      - description: Session ID (hex SHA-256 of token)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              revoked:
                type: boolean
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Revoke a session by ID
      tags:
      - auth
  /auth/setup:
    post:
      consumes:
      - application/json
      description: 'Creates the owner account, with a home under users/ on the internal
        device that it owns; an existing folder of that name under users/ becomes
        the home. Can only be called once. The body carries exactly one of password
        and authKey, the standard base64 of the 32-byte key the client derived from
        the password and the salt GET /auth/salt returned. The response carries token
        and, unless the body carried recoveryKey, recoveryPhrase, shown this once.
        recoveryKey, sent only with authKey, is the standard base64 of the 32-byte
        key the client derived from a recovery phrase it generated and the same salt:
        the Quark stores that key and makes no phrase (#2430).'
      parameters:
      - description: The username with a password or an authKey, and optionally a
          recoveryKey
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_auth.newAccountBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: First-boot user setup
      tags:
      - auth
  /auth/status:
    get:
      description: 'Returns whether initial setup has been completed and, once it
        has, accessRequestsEnabled: whether the sign-in page may offer to request
        an account. For a caller with a valid session it also returns that caller''s
        username, userId and isAdmin flag, and avatarUpdatedAt (Unix milliseconds)
        when they have a profile picture.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Check auth setup status
      tags:
      - auth
  /books:
    get:
      description: Finds all books in the files directory
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_books.BookJSON'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List books
      tags:
      - books
  /calendar/events:
    get:
      description: Lists the household calendar's one-off events that overlap [from,
        to) and every repeating event with an occurrence there, by start. A repeating
        event is listed once, as its first occurrence and preset; the client expands
        the occurrences. The range is widened by a day each way so all-day events
        are not missed at its edges, and can span at most 400 days.
      parameters:
      - description: Range start, RFC 3339
        in: query
        name: from
        required: true
        type: string
      - description: Range end (exclusive), RFC 3339
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_calendar.EventListJSON'
        "400":
          description: 'Bad Request: missing or malformed from/to, or a reversed or
            too-long range'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List calendar events in a range
      tags:
      - calendar
    post:
      consumes:
      - application/json
      description: Adds an event to the household calendar, owned by the caller, and
        tells every open client it changed. Times are RFC 3339; an all-day event starts
        and ends at midnight UTC, the end exclusive. repeat is none, daily, weekly
        or monthly, and a repeating event must end before it repeats. reminderMinutes
        counts back from the start, 0 to a week; an all-day event's may be negative
        down to -1439 so it falls on its own day (-540 is 9 AM). colorIndex is 0 to
        5.
      parameters:
      - description: The event
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_calendar.eventRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v0_calendar.EventJSON'
        "400":
          description: 'Bad Request: a malformed body or an event that breaks a rule'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Create a calendar event
      tags:
      - calendar
  /calendar/events/{id}:
    delete:
      description: Deletes an event, every occurrence of a repeating one included,
        and tells every open client it changed.
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: 'Bad Request: id is not a number'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Delete a calendar event
      tags:
      - calendar
    get:
      description: Returns one event of the household calendar. A repeating event
        is returned as its series.
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_calendar.EventJSON'
        "400":
          description: 'Bad Request: id is not a number'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get a calendar event
      tags:
      - calendar
    put:
      consumes:
      - application/json
      description: Replaces every field of an event, under the same rules as a create,
        and tells every open client it changed. For a repeating event the change applies
        to the whole series. The event keeps its owner.
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      - description: The event's new fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_calendar.eventRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_calendar.EventJSON'
        "400":
          description: 'Bad Request: a malformed id or body, or an event that breaks
            a rule'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Update a calendar event
      tags:
      - calendar
  /chat/channels:
    get:
      description: 'Returns the channels the caller is a member of, directly, through
        a group, or through everyone, general first and then by name, each with the
        caller''s effective permissions there: the union of every row that reaches
        them. A channel on which that set is empty is left out. Admins get only their
        own channels too, unless they pass all=1: then the channels they are not in
        follow, in the same order, with an empty set.'
      parameters:
      - description: 1 adds the channels an admin is not in; refused for anyone else
        in: query
        name: all
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.ListChannelsResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: all=1 from an account that isn't an admin
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List the caller's chat channels
      tags:
      - chat
    post:
      consumes:
      - application/json
      description: Creates a private channel and gives the caller every permission
        on it. Any signed-in account may. The name is trimmed, has 1 to 64 characters
        and no line breaks or tabs, and is unique ignoring case; the topic has at
        most 512 characters. Publishes chat_channel_changed.
      parameters:
      - description: The name and an optional topic
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_chat.createChannelBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/chatutil.Channel'
        "400":
          description: an invalid name or topic
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: another channel has that name
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Create a chat channel
      tags:
      - chat
  /chat/channels/{id}:
    delete:
      description: Deletes a channel and its members. Needs manage_channel, or an
        admin, and general can't be deleted. Publishes chat_channel_changed to everyone
        who had a non-empty set on it.
      parameters:
      - description: Channel id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: the channel is general
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: the caller lacks manage_channel
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such channel, or the caller's set on it is empty and they
            aren't an admin
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Delete a chat channel
      tags:
      - chat
    patch:
      consumes:
      - application/json
      description: Changes a channel's name, topic or both; a field left out is unchanged.
        Needs manage_channel, or an admin. The name rules are create's. permissions
        in the answer is empty for an admin who isn't a member. Publishes chat_channel_changed.
      parameters:
      - description: Channel id
        in: path
        name: id
        required: true
        type: integer
      - description: The new name, topic or both
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_chat.updateChannelBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.Channel'
        "400":
          description: an invalid name or topic
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: the caller lacks manage_channel
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such channel, or the caller's set on it is empty and they
            aren't an admin
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: another channel has that name
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Rename a chat channel or change its topic
      tags:
      - chat
  /chat/channels/{id}/events:
    get:
      description: 'Pages the channel''s membership and key events oldest first: member_set,
        member_removed and key_created. Each has the JSON payload its signature covers;
        signature and signerSignKey are absent until the actor''s client signs it,
        and an unsigned event is shown as unverified. Needs read_messages; anyone
        else, delegated managers included, gets 404.'
      parameters:
      - description: Channel id
        in: path
        name: id
        required: true
        type: integer
      - description: The last event id already seen
        in: query
        name: after
        type: integer
      - description: At most this many, capped at 200
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.ListEventsResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such channel, or the caller isn't a member
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List a chat channel's system events
      tags:
      - chat
  /chat/channels/{id}/events/{eventId}/signature:
    put:
      consumes:
      - application/json
      description: Stores the caller's 64-byte Ed25519 signature, base64, over an
        event's canonical bytes, with the caller's published signing key beside it.
        Only the event's actor may sign it, and only once, whether or not they are
        still a member. The channel's members hear chat_channel_changed, so they can
        show it as verified.
      parameters:
      - description: Channel id
        in: path
        name: id
        required: true
        type: integer
      - description: Event id
        in: path
        name: eventId
        required: true
        type: integer
      - description: The signature
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_chat.signEventBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.ChannelEvent'
        "400":
          description: a signature of the wrong size
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such channel or event, or the caller isn't the event's actor
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: the event is already signed
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Sign a chat channel event the caller made
      tags:
      - chat
  /chat/channels/{id}/keys:
    get:
      description: 'Returns the channel''s key versions, the newest (0 before any
        exists, when the first member to open the channel creates version 1), the
        caller''s own key grants, and whether the key needs rotating because someone
        without read_messages holds the current version. Needs read_messages: anyone
        else, delegated managers and admins included, gets 404.'
      parameters:
      - description: Channel id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.GetChannelKeysResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such channel, or the caller isn't a member
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get a chat channel's key versions and the caller's grants
      tags:
      - chat
    post:
      consumes:
      - application/json
      description: 'Starts a channel''s key (version 1) or rotates it once rotationNeeded
        is true, storing the caller''s own grant of the new key: sealedKey is the
        80-byte crypto_box_seal of the key to the caller''s X25519 key and signature
        the caller''s 64-byte Ed25519 signature over the grant, both base64. The caller
        then fills the other members'' grants. Any member with published chat keys
        may do it. Returns the key_created event for the caller to sign. Publishes
        chat_key_needed to key holders when members lack the new version.'
      parameters:
      - description: Channel id
        in: path
        name: id
        required: true
        type: integer
      - description: The version and the caller's grant of it
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_chat.createKeyVersionBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.CreateKeyVersionResult'
        "400":
          description: a sealed key or signature of the wrong size, or a signature
            that doesn't verify against the caller's chat keys
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such channel, the caller isn't a member, or has no chat
            keys
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: version isn't the next one (another member created it first),
            or the key doesn't need rotating
          schema:
            $ref: '#/definitions/serverutil.Response'
        "429":
          description: the caller sent too many of these in a short time; the limit
            is per account
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Create the next version of a chat channel's key
      tags:
      - chat
  /chat/channels/{id}/keys/grants:
    post:
      consumes:
      - application/json
      description: 'Stores up to 256 grants, each a version of the channel key the
        caller holds, sealed (80 bytes) to a member with published chat keys and signed
        (64 bytes) by the caller, base64. The Quark verifies each signature against
        the caller''s published signing key before storing anything. The first grant
        for a member and version wins: a later one is ignored and the stored one returned.
        Publishes chat_key_granted to the recipients.'
      parameters:
      - description: Channel id
        in: path
        name: id
        required: true
        type: integer
      - description: The grants
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_chat.uploadGrantsBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.UploadGrantsResult'
        "400":
          description: a malformed grant, a signature that doesn't verify, or one
            for someone who isn't a member with chat keys
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: the caller holds no grant for that version
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such channel, the caller isn't a member, or has no chat
            keys
          schema:
            $ref: '#/definitions/serverutil.Response'
        "429":
          description: the caller sent too many of these in a short time; the limit
            is per account
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Upload key grants for other members
      tags:
      - chat
  /chat/channels/{id}/keys/grants/{version}:
    delete:
      description: Deletes the caller's own grant of one version of the channel key,
        for a grant the caller's app couldn't open or verify. Grants are first-write-wins,
        so this is how a recipient clears a useless one. The caller is pending again,
        and the key holders hear chat_key_needed so one of them refills it. Only the
        recipient can delete a grant.
      parameters:
      - description: Channel id
        in: path
        name: id
        required: true
        type: integer
      - description: Key version
        in: path
        name: version
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.RejectGrantResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such channel, the caller isn't a member, or holds no grant
            of that version
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Reject your own key grant
      tags:
      - chat
  /chat/channels/{id}/keys/pending:
    get:
      description: Lists the holders of read_messages, direct or through a group or
        everyone, who have published chat keys but lack a version of the channel's
        key that the caller holds, each with the X25519 key to seal it to. Also says
        whether the key needs rotating. Needs read_messages; anyone else, delegated
        managers included, gets 404.
      parameters:
      - description: Channel id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.ListPendingGrantsResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such channel, or the caller isn't a member
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List the key grants the caller can fill
      tags:
      - chat
  /chat/channels/{id}/members:
    delete:
      consumes:
      - application/json
      description: Removes one account's or group's row from a channel and returns
        the channel's members as they now stand. Any member may remove their own account's
        row, which is leaving. Removing anyone else needs manage_members and a target
        whose effective set is a strict subset of the caller's, unless the caller
        holds manage_channel; only an admin may remove the channel's creator or skip
        those rules. everyone can't be removed from general. Publishes chat_channel_changed
        to everyone who was or now is a member.
      parameters:
      - description: Channel id
        in: path
        name: id
        required: true
        type: integer
      - description: One account or group
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_chat.removeMemberBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.ListMembersResult'
        "400":
          description: not exactly one account or group, everyone on general, or the
            last holder of manage_channel while other members remain, when the caller
            is not an admin
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: removing someone else without manage_members, or someone the
            caller may not remove
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such channel, the caller's set on it is empty and they aren't
            an admin, or the account or group has no row
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Remove a chat channel member
      tags:
      - chat
    get:
      description: Returns a channel's rows, groups first and then accounts, each
        by name. A group carries the active accounts in it, everyone's being every
        active account. Each account carries avatarUpdatedAt (Unix milliseconds) when
        it has a profile picture, the v parameter for /users/{id}/avatar. Each row
        carries its own permissions. Anyone with a non-empty set on the channel, a
        delegated manager included, or an admin may list them.
      parameters:
      - description: Channel id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.ListMembersResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such channel, or the caller's set on it is empty and they
            aren't an admin
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List a chat channel's members
      tags:
      - chat
    put:
      consumes:
      - application/json
      description: Gives one active account or existing group a set of permissions
        on a channel, replacing the set its row had, and returns the channel's members
        as they now stand. Needs manage_members, or an admin. A caller may grant only
        permissions they hold, and may take permissions away only from a principal
        whose effective set is a strict subset of theirs unless they hold manage_channel;
        only an admin may demote the channel's creator. everyone keeps read_messages
        on general. Publishes chat_channel_changed to everyone who was or now is a
        member.
      parameters:
      - description: Channel id
        in: path
        name: id
        required: true
        type: integer
      - description: One account or group, and its permissions
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_chat.setMemberBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.ListMembersResult'
        "400":
          description: not exactly one account or group, everyone below read_messages
            on general, or leaving the channel without a manage_channel holder when
            the caller is not an admin
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: the caller lacks manage_members, grants a permission they lack,
            or demotes someone they may not
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such channel, the caller's set on it is empty and they aren't
            an admin, or no active account or group has that id
          schema:
            $ref: '#/definitions/serverutil.Response'
        "422":
          description: an unknown permission, an empty set, or a message permission
            without read_messages
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Add a chat channel member or change its permissions
      tags:
      - chat
  /chat/channels/{id}/messages:
    get:
      description: Returns messages oldest first. With after, the page starts after
        that id (after=0 is the beginning), which is how a client catches up on anything
        the events socket dropped. Otherwise it ends before before, or at the newest
        message when before is left out. Deleted messages come back as tombstones
        with deletedAt and no ciphertext. Needs read_messages; anyone else gets 404,
        delegated managers and admins included.
      parameters:
      - description: Channel id
        in: path
        name: id
        required: true
        type: integer
      - description: Page backward from this message id
        in: query
        name: before
        type: integer
      - description: Page forward from this message id
        in: query
        name: after
        type: integer
      - description: At most this many, 50 by default, capped at 200
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.ListMessagesResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such channel, or the caller lacks read_messages
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Page a chat channel's encrypted messages
      tags:
      - chat
    post:
      consumes:
      - application/json
      description: Stores ciphertext, base64, that the caller's client encrypted under
        the channel key of keyVersion, and sends the stored row to the channel's readers
        as chat_message_created. The Quark never sees the text. Ciphertext is at most
        16 KiB. Needs send_messages; a reader without it gets 403, and anyone without
        read_messages 404, delegated managers and admins included.
      parameters:
      - description: Channel id
        in: path
        name: id
        required: true
        type: integer
      - description: The encrypted message
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_chat.postMessageBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/chatutil.Message'
        "400":
          description: ciphertext too short, or a key version the channel doesn't
            have
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: the caller reads the channel but lacks send_messages
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such channel, or the caller lacks read_messages
          schema:
            $ref: '#/definitions/serverutil.Response'
        "413":
          description: ciphertext over 16 KiB
          schema:
            $ref: '#/definitions/serverutil.Response'
        "429":
          description: the caller sent too many of these in a short time; the limit
            is per account
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Post an encrypted message to a chat channel
      tags:
      - chat
  /chat/keys/{userId}:
    get:
      description: Returns an active account's X25519 box and Ed25519 signing public
        keys, base64, and never its wrapped private seeds. Any signed-in account may
        ask. 404 means the account doesn't exist, isn't active, or has no chat keys
        yet.
      parameters:
      - description: Account id
        in: path
        name: userId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.PublicKeys'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such active account, or it has no chat keys yet
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get an account's public chat keys
      tags:
      - chat
  /chat/keys/me:
    get:
      description: Returns the caller's chat public keys and the private seeds wrapped
        on the client under the login password and, when present, the recovery phrase.
        Byte fields are base64. The Quark never opens them. 404 means the caller has
        no chat keys yet and the client should generate them.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.Keys'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: the caller has no chat keys yet
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get the caller's chat identity
      tags:
      - chat
    put:
      consumes:
      - application/json
      description: Stores the caller's chat public keys (32 bytes each) and private
        seeds wrapped on the client (at most 512 bytes each), with 16-byte Argon2id
        salts and the client's kdfParams object. wrappedByPhrase and saltRp are both
        present or both absent. Byte fields are base64 and the body is at most 8 KiB.
        Replaces any keys the caller had; a new box key drops the caller's channel
        key grants, which were sealed to the old one, and asks members to refill them
        with chat_key_needed.
      parameters:
      - description: The caller's chat identity; createdAt and updatedAt are ignored
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/chatutil.Keys'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.Keys'
        "400":
          description: keys of the wrong size or shape, or a body over 8 KiB
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Create or replace the caller's chat identity
      tags:
      - chat
  /chat/messages/{id}:
    delete:
      description: Wipes the message's ciphertext and sets deletedAt, leaving a tombstone
        so paging stays contiguous, and tells the channel's readers with chat_message_deleted.
        Allowed for the message's author or a holder of delete_messages, either of
        whom must hold read_messages now; another reader gets 403 and anyone without
        read_messages 404, delegated managers, demoted authors and admins included.
      parameters:
      - description: Message id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.Message'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: the caller neither wrote it nor holds delete_messages
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such message, or the caller lacks read_messages in its channel
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Delete a chat message
      tags:
      - chat
  /chat/messages/{id}/reactions:
    post:
      consumes:
      - application/json
      description: Stores a reaction, base64 ciphertext the caller's client encrypted
        under the channel key of keyVersion, and sends the stored row to the channel's
        readers as chat_reaction_changed. The Quark never sees the emoji. Ciphertext
        is at most 256 bytes, and an account may hold at most 20 reactions on one
        message. Needs add_reactions; a reader without it gets 403, and anyone without
        read_messages 404, delegated managers and admins included.
      parameters:
      - description: Message id
        in: path
        name: id
        required: true
        type: integer
      - description: The encrypted reaction
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_chat.reactionBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/chatutil.Reaction'
        "400":
          description: ciphertext too short or too long, or a key version the channel
            doesn't have
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: the caller reads the channel but lacks add_reactions
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such message, or the caller lacks read_messages in its channel
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: the message was deleted, or the caller already holds 20 reactions
            on it
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: React to a chat message
      tags:
      - chat
  /chat/reactions/{id}:
    delete:
      description: Deletes the reaction and tells the channel's readers with a chat_reaction_changed
        that carries no reaction. Removing your own needs add_reactions, and removing
        someone else's manage_reactions; either way the caller must hold read_messages
        now, and anyone without it gets 404, delegated managers and admins included.
      parameters:
      - description: Reaction id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.Reaction'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: your own without add_reactions, or someone else's without manage_reactions
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such reaction, or the caller lacks read_messages in its
            channel
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Remove a reaction from a chat message
      tags:
      - chat
  /devices:
    get:
      description: Returns all unique client IP + User-Agent combinations that have
        connected to the quark
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_devices.ConnectedDeviceJSON'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List connected devices
      tags:
      - devices
  /devices/{id}:
    delete:
      description: Deletes a connected device entry by ID
      parameters:
      - description: Device ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Remove a connected device record
      tags:
      - devices
  /events:
    get:
      description: Upgrades the connection to WebSocket and pushes JSON events for
        file system mutations (upload, delete, move, new_folder). Each connection
        hears only events about paths its user can read; admins hear every event.
        A connection closes once its account is turned off, deleted, promoted or demoted.
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Stream real-time file/device events
      tags:
      - events
  /files:
    delete:
      description: Move files to the device's trash (internal storage included), returning
        immediately. They can be restored through /trash/restore until the hourly
        purge deletes them after the retention period. DB cleanup and events are dispatched
        in the background.
      parameters:
      - description: Root directory
        in: query
        name: rootDir
        type: string
      - collectionFormat: csv
        description: Array of file paths to delete, at most 1000 (fileutil.MaxDeleteFiles)
        in: query
        items:
          type: string
        name: filePaths
        required: true
        type: array
      - description: Device serial number to filter by
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: 'Bad Request: no paths, more than 1000, or a path outside the
            files directory'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Delete files
      tags:
      - files
    get:
      description: merges files across all managed devices for the given filePath.
        If deviceSerial is empty, list files across all devices. Otherwise, only for
        the specified device
      parameters:
      - description: File dir to list
        in: query
        name: rootDir
        type: string
      - description: Device serial number to filter by
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_files.FileNodeJSON'
            type: array
        "400":
          description: 'Bad Request: a rootDir outside the files directory'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Lists files
      tags:
      - files
    put:
      consumes:
      - application/json
      description: Enqueue a file move operation between paths/devices. Needs write
        access on the file and on the folder it moves into.
      parameters:
      - description: Move file request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_files.moveFileRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Ok
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Move or rename a file
      tags:
      - files
  /files/by-type:
    get:
      description: Recursively walks all managed devices and returns files whose fileType
        matches the given value, sorted newest-first.
      parameters:
      - description: File type to filter by (e.g. qdoc, qsheet)
        in: query
        name: fileType
        required: true
        type: string
      - collectionFormat: csv
        description: Filter by device serial(s)
        in: query
        items:
          type: string
        name: serial
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_files.FileNodeWithTimeJSON'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List all files of a given type
      tags:
      - files
  /files/convert/xlsx:
    post:
      description: Reads an .xlsx or .xlsm workbook and writes it back as a sibling
        .qsheet, the format the Sheets editor opens. The workbook itself is left untouched.
        Answers 409 when a .qsheet of that name already exists and overwrite was not
        asked for. Needs read access on the workbook and write access on its directory;
        the caller owns a newly created .qsheet.
      parameters:
      - description: Path to the .xlsx or .xlsm file to convert
        in: query
        name: filePath
        required: true
        type: string
      - description: Device serial number
        in: query
        name: serial
        type: string
      - description: Replace an existing .qsheet of the same name
        in: query
        name: overwrite
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.ConvertXlsxJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Convert a spreadsheet to a Quark spreadsheet
      tags:
      - files
  /files/download:
    get:
      description: Downloads a single file or zips a folder and streams it back to
        the client
      parameters:
      - description: File path to download
        in: query
        name: filePath
        type: string
      - description: Device serial number to filter by
        in: query
        name: serial
        type: string
      - description: Output format conversion (e.g. 'jpeg' to convert HEIC to JPEG)
        in: query
        name: format
        type: string
      - description: 'Token from POST /files/download-token, for a browser link that
          cannot send an Authorization header. It is good for one download: the first
          request, then retries that resume it with a Range header or start it over
          without one, until the file is delivered or 10 minutes pass with no request.
          The response is then always an attachment.'
        in: query
        name: downloadToken
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Download a file or folder
      tags:
      - files
  /files/download-archive-file:
    get:
      description: Reads the specified entry from the archive and streams it to the
        client. No data is extracted to disk. With format=jpeg an image entry other
        than camera RAW is converted and served as image/jpeg; every other entry is
        served as it is.
      parameters:
      - description: Path to the archive file (relative to device files directory)
        in: query
        name: filePath
        required: true
        type: string
      - description: Path of the entry inside the archive
        in: query
        name: entryPath
        required: true
        type: string
      - description: Device serial number
        in: query
        name: serial
        type: string
      - description: Output format conversion ('jpeg' converts HEIC, TIFF, BMP and
          other decodable images to JPEG)
        in: query
        name: format
        type: string
      - description: 'Token from POST /files/download-token, for a browser link that
          cannot send an Authorization header. It is good for one download: the first
          request, then retries that resume it with a Range header or start it over
          without one, until the file is delivered or 10 minutes pass with no request.
          The response is then always an attachment.'
        in: query
        name: downloadToken
        type: string
      produces:
      - application/octet-stream
      - image/jpeg
      responses:
        "200":
          description: File content
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Entry not found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
        "503":
          description: Server busy converting other images
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Download a single file from inside an archive
      tags:
      - files
  /files/download-token:
    post:
      description: 'Issues a token that authenticates one download by GET /files/download
        (or /files/download-archive-file, where filePath is the archive) of the same
        filePath and serial, passed as the downloadToken query parameter. A browser
        link cannot send an Authorization header; this lets the web client hand the
        download to the browser, which streams it to disk. The token is good for one
        download: the first request, then retries of an interrupted one, resuming
        with a Range header or starting over without one, until the file is delivered
        or 10 minutes pass with no request. A folder is zipped on the fly and cannot
        be resumed. The token runs as the caller, makes the response an attachment,
        and expires unused after about a minute. Needs read access on the path.'
      parameters:
      - description: File path the token is for
        in: query
        name: filePath
        required: true
        type: string
      - description: Device serial number the token is for
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.createDownloadTokenResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Issue a download token
      tags:
      - files
  /files/extract:
