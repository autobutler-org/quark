      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.ConvertXlsxJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
