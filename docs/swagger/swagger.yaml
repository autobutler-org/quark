            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Toggle a photo favorite
      tags:
      - favorites
  /photos/favorites:
    get:
