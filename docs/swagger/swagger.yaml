          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
