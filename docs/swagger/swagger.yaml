      - description: Export file
        in: formData
        name: file
        required: true
        type: file
      - description: 'Source format: auto, json, bitwarden, proton, google or csv;
          sniffed from the bytes when absent'
        in: formData
        name: format
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/vaultutil.ImportResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "423":
          description: Vault is locked
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
        "503":
          description: Vault storage device is disconnected
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Import entries from a file
      tags:
      - vault
  /vault/import-backup:
    post:
      consumes:
      - application/json
      description: Reads the encrypted backup on a managed device, unlocks it with
        its recovery password, and merges it in.
      parameters:
      - description: Device serial and recovery password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_vault.importBackupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/vaultutil.ImportResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "423":
          description: Vault is locked
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
        "503":
          description: Vault storage device is disconnected
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Import a vault backup from a device
      tags:
      - vault
  /vault/lock:
    post:
      description: Drops the in-memory vault key immediately, before the auto-lock
        window expires.
      produces:
      - application/json
      responses:
        "200":
          description: locked flag
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Lock the vault
      tags:
      - vault
  /vault/setup:
    post:
      consumes:
      - application/json
      description: Creates the vault with a master password and leaves it unlocked.
        Fails if it already exists.
      parameters:
      - description: Master password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_vault.setupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: initialized and locked flags
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Initialize the vault
      tags:
      - vault
  /vault/status:
    get:
      description: Reports whether the vault is initialized and unlocked, its auto-lock
        window, and which device holds it.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_vault.vaultStatusResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get vault status
      tags:
      - vault
  /vault/storage-location:
    get:
      description: Returns which device the vault is stored on
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_vault.storageLocationResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get vault storage location
      tags:
      - vault
    put:
      consumes:
      - application/json
      description: Migrates vault data to a different device. Requires vault unlocked
        and admin auth.
      parameters:
      - description: Migration request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_vault.setStorageLocationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "423":
          description: Locked
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Change vault storage location
      tags:
      - vault
  /vault/unlock:
    post:
      consumes:
      - application/json
      description: Derives the vault key from the master password and holds it for
        the auto-lock window.
      parameters:
      - description: Master password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_vault.unlockRequest'
      produces:
      - application/json
      responses:
        "200":
          description: locked flag
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Incorrect master password
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Unlock the vault
      tags:
      - vault
  /version:
    get:
      description: Retrieves the installed version of the application
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_version.VersionJSON'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get installed version
      tags:
      - version
  /version/available:
    get:
      description: Lists all available versions for update
      parameters:
      - description: Include all versions, including old and development versions
        in: query
        name: all
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: List of available versions
          schema:
            items:
              $ref: '#/definitions/updateutil.UpdateVersion'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List available versions
      tags:
      - version
  /version/update:
    post:
      consumes:
      - application/json
      description: Performs an update to the specified version
      parameters:
      - description: Update Request
        in: body
        name: update
        required: true
        schema:
          $ref: '#/definitions/v0_version.UpdateParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_version.UpdateRequest'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Perform update
      tags:
      - version
  /videos/metadata:
    get:
      description: Returns duration, resolution, codec, bitrate, framerate, rotation,
        and the caller's own favorite state and album membership for the specified
        video.
      parameters:
      - description: Device serial
        in: query
        name: serial
        type: string
      - description: Relative path to the video file
        in: query
        name: relPath
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_videos.VideoMetadataJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get metadata for a single video file
      tags:
      - videos
  /videos/transcode:
    post:
      consumes:
      - application/json
      description: Queues a background job that copies the source video's streams,
        without re-encoding them, into a new file beside it in one of the formats
        GET /videos/transcode/formats lists for it. A format that cannot hold the
        video's codecs, or that is its own, is a 400, and so is any quality but original.
        The output never overwrites a file. Follow the job with GET /jobs/{id} or
        the job_* events; an upload event announces the output file. Needs read access
        on the video and write access on its folder; the job runs as, and its output
        is owned by, the caller.
      parameters:
      - description: Transcode request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_videos.transcodeVideoRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/v0_videos.transcodeVideoResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Queue a video transcode
      tags:
      - videos
  /videos/transcode/formats:
    get:
      description: 'Lists the video formats POST /videos/transcode writes, in display
        order. With relPath, only the ones the video there can be converted to: those
        whose container holds its codecs, leaving out its own format. Without it,
        every format the device writes, whatever a given video''s codecs allow.'
      parameters:
      - description: Device serial
        in: query
        name: serial
        type: string
      - description: Relative path to the video the formats are for
        in: query
        name: relPath
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_videos.transcodeFormatsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List transcode formats
      tags:
      - videos
  /videos/trim:
    post:
      consumes:
      - application/json
      description: 'Copies the sub-clip [startMs, endMs] of the source video into
        a new file beside it without re-encoding (fast, lossless). The clip is shown
        from startMs: the frames back to the keyframe before it are kept but hidden,
        so they still decode. actualStartMs reports where the clip is shown from,
        which is startMs except where there is nothing to hide the lead-in behind
        or nothing to hide: a start before the video''s first keyframe or past its
        last frame, or a TS output, begins at that keyframe instead. An endMs at or
        past the end of the video keeps the rest of it; a startMs at or past the end
        is a 400. The clip keeps the source''s format where the device writes it and
        is an MP4 otherwise. The original file is not modified. An MPEG-TS source
        cannot be trimmed and is a 422. Needs read access on the video and write access
        on its folder; the caller owns the new clip.'
      parameters:
      - description: Trim request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_videos.trimVideoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_videos.trimVideoResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "422":
          description: Unprocessable Entity — the video's container can't be trimmed
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Trim a video clip
      tags:
      - videos
securityDefinitions:
  BearerAuth:
    description: A session token from POST /auth/login, entered as the word Bearer,
      a space, and the token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
