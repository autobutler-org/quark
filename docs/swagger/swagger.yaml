  /files/upload:
    post:
      consumes:
      - multipart/form-data
      description: Upload one or more files via multipart/form-data. Needs write access
        on the top-level directory; the caller owns each file the upload creates.
        A name already in use is a 409 unless overwrite or keepBoth says what to do
        about it. Answers with the files-relative path each file landed at, after
        any keepBoth rename. A photo or video's client-rendered thumbnail (JPEG, long
        edge 400) may follow its file as a part named thumbnail whose filename is
        the file's; one that names no earlier file, or is not a valid JPEG, is skipped.
      parameters:
      - description: Device serial number to upload to
        in: query
        name: serial
        type: string
      - description: Replace a file of the same name
        in: query
        name: overwrite
        type: boolean
      - description: Land under the first free name, e.g. file_(1).txt, when the name
          is taken
        in: query
        name: keepBoth
        type: boolean
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      - description: Thumbnail JPEG for the file of the same filename sent before
          it
        in: formData
        name: thumbnail
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.uploadFilesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Upload files to the top-level directory
      tags:
      - files
  /files/upload-session:
    post:
      consumes:
      - application/json
      description: 'Reserve a session for one file; the bytes follow as chunks on
        PUT. Needs write access on the directory the file lands in. The session belongs
        to the caller: it is not found for anyone else. A name already in use is a
        409 unless overwrite or keepBoth says what to do about it.'
      parameters:
      - description: File the session will carry
        in: body
        name: session
        required: true
        schema:
          $ref: '#/definitions/v0_files.createUploadSessionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.createUploadSessionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Open a resumable upload session
      tags:
      - files
  /files/upload-session/{sessionId}:
    delete:
      description: Drops the session and the bytes staged for it
      parameters:
      - description: Upload session id
        in: path
        name: sessionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Abandon a resumable upload session
      tags:
      - files
    get:
      description: Returns the committed offset a resuming client continues from
      parameters:
      - description: Upload session id
        in: path
        name: sessionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.uploadSessionStatusResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Ask what a resumable upload has committed
      tags:
      - files
    put:
      consumes:
      - application/octet-stream
      description: Append the chunk named by Content-Range; the last one commits the
        file, and the caller owns it if it is new. A session opened by someone else
        is not found. A 409 carrying X-Upload-Offset is a chunk out of step; one without
        it is a name already in use. A photo or video's client-rendered thumbnail
        goes to PUT /thumbnails/{filePath} once the last chunk answers with where
        the file landed.
      parameters:
      - description: Upload session id
        in: path
        name: sessionId
        required: true
        type: string
      - description: Byte range of this chunk, e.g. bytes 0-8388607/20971520
        in: header
        name: Content-Range
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.uploadChunkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Send one chunk of a resumable upload
      tags:
      - files
  /files/upload/{rootDir}:
    post:
      consumes:
      - multipart/form-data
      description: Upload one or more files via multipart/form-data. Needs write access
        on the directory; the caller owns each file the upload creates. A name already
        in use is a 409 unless overwrite or keepBoth says what to do about it. Answers
        with the files-relative path each file landed at, after any keepBoth rename.
        A photo or video's client-rendered thumbnail (JPEG, long edge 400) may follow
        its file as a part named thumbnail whose filename is the file's; one that
        names no earlier file, or is not a valid JPEG, is skipped.
      parameters:
      - description: Directory to upload into
        in: path
        name: rootDir
        required: true
        type: string
      - description: Device serial number to upload to
        in: query
        name: serial
        type: string
      - description: Replace a file of the same name
        in: query
        name: overwrite
        type: boolean
      - description: Land under the first free name, e.g. file_(1).txt, when the name
          is taken
        in: query
        name: keepBoth
        type: boolean
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      - description: Thumbnail JPEG for the file of the same filename sent before
          it
        in: formData
        name: thumbnail
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.uploadFilesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Upload files to a nested directory
      tags:
      - files
  /health:
    get:
      description: 'Returns current hardware health: CPU, memory, disk usage and temperature.
        Sets healthy=false with alert messages when any metric exceeds its critical
        threshold.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_health.HealthJSON'
      security:
      - BearerAuth: []
      summary: Get system health status
      tags:
      - health
  /jobs:
    get:
      description: Returns the jobs of the requested kinds the caller may see, newest
        first, finished ones included. An admin sees every job; anyone else sees the
        jobs they queued whose file they can still read, with error left blank. This
        is the source of truth for job state; the job_* events are a hint to refresh
        and can be dropped.
      parameters:
      - collectionFormat: multi
        description: Job kinds to list; repeat for more than one (kind=video-transcode&kind=...)
        in: query
        items:
          type: string
        name: kind
        required: true
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/jobutil.Job'
            type: array
        "400":
          description: Bad Request — kind is missing, empty, or not a registered kind
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List background jobs
      tags:
      - jobs
  /jobs/{id}:
    delete:
      description: Cancels a pending or running job and returns it, now canceled.
        A pending job never runs; a running job is stopped and cleans up after itself.
        Only the account that queued the job, or an admin, may cancel it; any other
        caller gets 404.
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jobutil.Job'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Conflict — the job has already finished
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Cancel a background job
      tags:
      - jobs
    get:
      description: Returns one background job by id. A caller who is not an admin
        gets only a job they queued whose file they can still read, with error left
        blank; any other job is 404.
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jobutil.Job'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get a background job
      tags:
      - jobs
  /jobs/{id}/retry:
    post:
      description: Resets a failed job to pending so it runs again. It keeps its id
        and createdAt; progress, error, startedAt, and finishedAt are cleared, and
        the returned jobId is the same id. Only the account that queued the job, or
        an admin, may retry it; any other caller gets 404. The job runs as the account
        that queued it, which must still be active and able to write the folder of
        the file the job works on, or the retry is refused with 403. A retry whose
        inputs no longer exist, such as a transcode of a video that was moved or deleted,
        is refused with 422.
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/v0_jobs.retryJobResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden — the account that queued the job can no longer sign
            in or write the folder
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Conflict — only a failed job can be retried, and a job already
            reset by a retry is no longer failed
          schema:
            $ref: '#/definitions/serverutil.Response'
        "422":
          description: Unprocessable Entity — the job's inputs no longer exist
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Retry a background job
      tags:
      - jobs
  /photos:
