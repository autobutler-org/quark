definitions:
  accessutil.Grant:
    properties:
      builtin:
        description: Builtin marks the everyone group.
        type: boolean
      from:
        description: |-
          From is the path the row is on. A grant whose From is not the path
          asked about is inherited from that folder, and is changed there.
        type: string
      groupId:
        description: GroupID is set for a grant to a group.
        type: integer
      level:
        description: Level is read, write or owner.
        type: string
      name:
        description: Name is the account's username or the group's name.
        type: string
      userId:
        description: UserID is set for a grant to an account.
        type: integer
    type: object
  accessutil.GrantsResult:
    properties:
      canGrantOwner:
        description: |-
          CanGrantOwner is whether the caller may grant, change or revoke owner.
          Every owner may, so it equals CanManage.
        type: boolean
      canManage:
        description: |-
          CanManage is whether the caller may change the grants. Only a caller who
          may manage sees them at all, so it is true in every result.
        type: boolean
      deviceSerial:
        type: string
      grants:
        description: |-
          Grants lists the rows on the path, then one inherited grant per principal
          holding the highest level any parent folder gives it.
        items:
          $ref: '#/definitions/accessutil.Grant'
        type: array
      relPath:
        type: string
    type: object
  accessutil.ListPrincipalsResult:
    properties:
      groups:
        items:
          $ref: '#/definitions/accessutil.PrincipalGroup'
        type: array
      users:
        items:
          $ref: '#/definitions/accessutil.PrincipalUser'
        type: array
    type: object
  accessutil.PrincipalGroup:
    properties:
      builtin:
        description: Builtin marks the everyone group.
        type: boolean
      id:
        type: integer
      name:
        type: string
    type: object
  accessutil.PrincipalUser:
    properties:
      id:
        type: integer
      username:
        type: string
    type: object
  authutil.SessionInfo:
    properties:
      createdAt:
        type: string
      expiresAt:
        type: string
      id:
        type: string
    type: object
  grouputil.Group:
    properties:
      builtin:
        type: boolean
      id:
        type: integer
      members:
        items:
          $ref: '#/definitions/grouputil.Member'
        type: array
      name:
        type: string
    type: object
  grouputil.Member:
    properties:
      id:
        type: integer
      username:
        type: string
    type: object
  jobutil.Job:
    properties:
      attempts:
        description: |-
          Attempts is how many times the job has started running: 0 before its
          first run. A retry leaves it alone; the next run bumps it.
        type: integer
      createdAt:
        description: CreatedAt is when the job was queued.
        type: string
      error:
        description: Error is diagnostic text for a failed job, not copy for a user.
        type: string
      finishedAt:
        description: FinishedAt is null until the job completes, fails, or is canceled.
        type: string
      id:
        type: integer
      kind:
        type: string
      lane:
        description: |-
          Lane is the concurrency lane within Kind the job runs in, such as "copy"
          for a transcode that only copies streams. It is "" for a kind with one
          lane.
        type: string
      name:
        description: Name is display text, such as "Convert vacation.mkv to MOV".
        type: string
      params:
        description: |-
          Params is the kind-specific JSON object the job was enqueued with, so a
          client can build its own label from Kind and Params.
        type: object
      progress:
        type: number
      startedAt:
        description: StartedAt is null until the job starts running.
        type: string
      status:
        allOf:
        - $ref: '#/definitions/jobutil.Status'
        enum:
        - pending
        - running
        - completed
        - failed
        - canceled
    type: object
  jobutil.Status:
    enum:
    - pending
    - running
    - completed
    - failed
    - canceled
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusRunning
    - StatusCompleted
    - StatusFailed
    - StatusCanceled
  photoutil.AlbumRef:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  photoutil.DuplicateGroup:
    properties:
      kind:
        description: |-
          Kind is "exact" (identical content hash) or "near" (perceptual hash
          Hamming distance within the configured threshold).
        type: string
      photos:
        description: Photos is the list of photos in this duplicate group.
