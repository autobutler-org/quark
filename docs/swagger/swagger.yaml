  v0_videos.transcodeVideoResponse:
    properties:
      jobId:
        type: integer
    type: object
  v0_videos.trimVideoRequest:
    properties:
      endMs:
        type: integer
      relPath:
        type: string
      serial:
        type: string
      startMs:
        type: integer
    type: object
  v0_videos.trimVideoResponse:
    properties:
      relPath:
        type: string
    type: object
  vaultutil.CustomField:
    properties:
      hidden:
        type: boolean
      name:
        type: string
      value:
        type: string
    type: object
  vaultutil.EntryDetail:
    properties:
      createdAt:
        type: string
      customFields:
        items:
          $ref: '#/definitions/vaultutil.CustomField'
        type: array
      folderId:
        type: integer
      id:
        type: integer
      name:
        type: string
      notes:
        type: string
      password:
        type: string
      totpSecret:
        type: string
      updatedAt:
        type: string
      url:
        type: string
      urlHost:
