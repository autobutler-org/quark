  /vfs/{ns}/{path}:
    delete:
      description: Deletes the entry at the given path. For non-empty directories,
        ?recursive=true is required.
      parameters:
      - description: Namespace ID
        in: path
        name: ns
        required: true
        type: string
      - description: Path to delete
        in: path
        name: path
        required: true
        type: string
      - description: Delete directory contents recursively
        in: query
        name: recursive
        type: boolean
      produces:
      - application/json
      responses:
        "204":
          description: Deleted
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Directory not empty (use ?recursive=true)
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Delete a file or directory from a VFS namespace
      tags:
      - vfs
    get:
      description: If the path ends with '/' or the ?stat=true query is absent and
        the entry is a directory, returns a JSON array of FileInfoJSON. If the path
        is a file, streams the raw bytes. If ?stat=true is set, returns a single FileInfoJSON
        regardless.
      parameters:
      - description: Namespace ID
        in: path
        name: ns
        required: true
        type: string
      - description: Path within the namespace (leading slash optional)
        in: path
        name: path
        required: true
        type: string
      - description: Return FileInfo JSON instead of streaming bytes
        in: query
        name: stat
        type: boolean
      - description: List recursively (directory listing only)
        in: query
        name: recursive
        type: boolean
      - description: Filter by MIME type prefix (directory listing only)
        in: query
        name: mime_prefix
        type: string
      produces:
      - application/json
      - application/octet-stream
      responses:
        "200":
          description: File bytes
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Read or list a VFS path
      tags:
      - vfs
    post:
      description: Creates the directory at the given path, including any missing
        parents (mkdir -p semantics).
      parameters:
      - description: Namespace ID
        in: path
        name: ns
        required: true
        type: string
      - description: Directory path to create
        in: path
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "404":
          description: Namespace not found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Create a directory in a VFS namespace
      tags:
      - vfs
    put:
      consumes:
      - application/octet-stream
      description: 'Writes the request body as a file at the given path. Set Content-Type
        to declare the MIME type. Use If-None-Match: * to fail if the file already
        exists.'
      parameters:
      - description: Namespace ID
        in: path
        name: ns
        required: true
        type: string
      - description: Destination path
        in: path
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1_vfs.FileInfoJSON'
        "404":
          description: Namespace not found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: 'Conflict (file exists and If-None-Match: * was set)'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Write a file to a VFS namespace
      tags:
      - vfs
