            $ref: '#/definitions/serverutil.Response'
        "503":
          description: Vault storage device is disconnected
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Import entries from a file
      tags:
      - vault
  /vault/import-backup:
    post:
      consumes:
      - application/json
      description: Reads the encrypted backup on a managed device, unlocks it with
        its recovery password, and merges it in.
      parameters:
      - description: Device serial and recovery password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_vault.importBackupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/vaultutil.ImportResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "423":
          description: Vault is locked
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
        "503":
          description: Vault storage device is disconnected
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Import a vault backup from a device
      tags:
      - vault
  /vault/lock:
    post:
      description: Drops the in-memory vault key immediately, before the auto-lock
        window expires.
      produces:
      - application/json
      responses:
        "200":
          description: locked flag
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Lock the vault
      tags:
      - vault
  /vault/setup:
    post:
      consumes:
      - application/json
      description: Creates the vault with a master password and leaves it unlocked.
        Fails if it already exists.
      parameters:
      - description: Master password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_vault.setupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: initialized and locked flags
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Initialize the vault
      tags:
      - vault
  /vault/status:
    get:
      description: Reports whether the vault is initialized and unlocked, its auto-lock
        window, and which device holds it.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_vault.vaultStatusResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get vault status
      tags:
      - vault
  /vault/storage-location:
    get:
      description: Returns which device the vault is stored on
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_vault.storageLocationResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get vault storage location
      tags:
      - vault
    put:
      consumes:
      - application/json
      description: Migrates vault data to a different device. Requires vault unlocked
        and admin auth.
      parameters:
      - description: Migration request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_vault.setStorageLocationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "423":
          description: Locked
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Change vault storage location
      tags:
      - vault
  /vault/unlock:
    post:
      consumes:
      - application/json
      description: Derives the vault key from the master password and holds it for
        the auto-lock window.
      parameters:
      - description: Master password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_vault.unlockRequest'
      produces:
      - application/json
      responses:
        "200":
          description: locked flag
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Incorrect master password
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Unlock the vault
      tags:
      - vault
  /version:
    get:
      description: Retrieves the installed version of the application
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_version.VersionJSON'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get installed version
      tags:
      - version
  /version/available:
    get:
      description: Lists all available versions for update
      parameters:
      - description: Include all versions, including old and development versions
        in: query
        name: all
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: List of available versions
          schema:
            items:
              $ref: '#/definitions/updateutil.UpdateVersion'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List available versions
      tags:
      - version
  /version/update:
    post:
      consumes:
      - application/json
      description: Performs an update to the specified version
      parameters:
      - description: Update Request
        in: body
        name: update
        required: true
        schema:
          $ref: '#/definitions/v0_version.UpdateParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_version.UpdateRequest'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Perform update
      tags:
      - version
  /videos/extract-frame:
    post:
      consumes:
      - application/json
      description: Extracts a JPEG frame at the given timestamp and saves it alongside
        the source video. Needs read access on the video and write access on its folder;
        the caller owns the new frame.
      parameters:
      - description: Extract frame request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_videos.extractFrameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_videos.extractFrameResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
        "501":
          description: Not Implemented — ffmpeg not available
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Extract a still frame from a video
      tags:
      - videos
  /videos/metadata:
    get:
      description: Returns duration, resolution, codec, bitrate, framerate, rotation,
        and the caller's own favorite state and album membership for the specified
        video.
      parameters:
      - description: Device serial
        in: query
        name: serial
        type: string
      - description: Relative path to the video file
        in: query
        name: relPath
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_videos.VideoMetadataJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
        "501":
          description: Not Implemented — ffprobe not available
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get metadata for a single video file
      tags:
      - videos
  /videos/transcode:
    post:
      consumes:
      - application/json
      description: Queues a background job that converts the source video into a new
        file beside it, in any format GET /videos/transcode/formats lists. Original
        quality keeps the source resolution, and copies the streams without re-encoding
        when the format's container accepts them; small caps the height at 480 lines.
        Converting to the source's own format needs small quality. The output is never
        upscaled and never overwrites a file. Follow the job with GET /jobs/{id} or
        the job_* events; an upload event announces the output file. Needs read access
        on the video and write access on its folder; the job runs as, and its output
        is owned by, the caller.
      parameters:
      - description: Transcode request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_videos.transcodeVideoRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/v0_videos.transcodeVideoResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
        "501":
          description: Not Implemented — ffmpeg not available
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Queue a video transcode
      tags:
      - videos
  /videos/transcode/formats:
    get:
      description: 'Lists the video formats POST /videos/transcode can write on this
        device: the ones whose video and audio encoders its ffmpeg build has, in display
        order.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_videos.transcodeFormatsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
        "501":
          description: Not Implemented — ffmpeg not available
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List transcode formats
      tags:
      - videos
  /videos/trim:
    post:
      consumes:
      - application/json
      description: Extracts a sub-clip [startMs, endMs] from the source video using
        stream copy (fast, lossless). The original file is not modified. Needs read
        access on the video and write access on its folder; the caller owns the new
        clip.
      parameters:
      - description: Trim request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_videos.trimVideoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_videos.trimVideoResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
        "501":
          description: Not Implemented — ffmpeg not available
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Trim a video clip
      tags:
      - videos
securityDefinitions:
  BearerAuth:
    description: A session token from POST /auth/login, entered as the word Bearer,
      a space, and the token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
