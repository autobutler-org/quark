      - admin
  /admin/enable/{username}:
    put:
      description: Lets a disabled account sign in again, with everything it owned
        when it was turned off. Admin-only.
      parameters:
      - description: Username to turn back on
        in: path
        name: username
        required: true
        type: string
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no disabled account has that username
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Turn an account back on
      tags:
      - admin
  /admin/groups:
    get:
      description: 'Returns every group with its members, the built-in everyone group
        first and the rest by name. everyone lists no members: it includes every active
        account. Admin-only.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/grouputil.Group'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List groups
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Creates an empty group and its folder in groups on the internal
        device, named after the group, with one grant giving the group write there;
        an existing folder of that name is adopted. The name is trimmed, has 1 to
        64 characters, no control characters or slashes, isn't . or .., and is unique
        ignoring case. Publishes account_changed and new_folder. Admin-only.
      parameters:
      - description: The group's name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_admin.groupNameBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/grouputil.Group'
        "400":
          description: invalid name
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: a group with that name already exists
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Create a group
      tags:
      - admin
  /admin/groups/{id}:
    delete:
      description: Deletes a group, its memberships and every share made to it, so
        its members lose what only the group gave them. Its folder in groups and its
        content stay, admin-only from then on. The everyone group can't be deleted.
        Publishes access_changed with no path. Admin-only.
      parameters:
      - description: Group id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: the everyone group
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no group has that id
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Delete a group
      tags:
      - admin
    put:
      consumes:
      - application/json
      description: Renames a group under the same rules a new name follows; a group
        may take its own name in another case. Its folder in groups is renamed to
        match as an ordinary move does, carrying its shares, favorites and album items,
        and publishing move and access_changed. The everyone group can't be renamed.
        The response lists no members. Publishes account_changed. Admin-only.
      parameters:
      - description: Group id
        in: path
        name: id
        required: true
        type: integer
      - description: The group's new name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_admin.groupNameBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/grouputil.Group'
        "400":
          description: invalid name, or the everyone group
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no group has that id
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: a group with that name already exists, or another folder in
            groups already has the new name
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Rename a group
      tags:
      - admin
  /admin/groups/{id}/members/{userId}:
    delete:
      description: Takes an account out of a group, whatever the account's status,
        so it loses what only the group gave it. Members of the everyone group can't
        be changed. Publishes access_changed with no path. Admin-only.
      parameters:
      - description: Group id
        in: path
        name: id
        required: true
        type: integer
      - description: Account id
        in: path
        name: userId
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: the everyone group
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no group has that id, or that account isn't in the group
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Take an account out of a group
      tags:
      - admin
    put:
      description: Puts an active account in a group, so it reaches what the group
        was shared. Adding a member again changes nothing. Members of the everyone
        group can't be changed. Publishes access_changed with no path when the membership
        is new. Admin-only.
      parameters:
      - description: Group id
        in: path
        name: id
        required: true
        type: integer
      - description: Account id
        in: path
        name: userId
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: the everyone group
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no group has that id, or no active account has that id
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Add an account to a group
      tags:
      - admin
  /admin/promote/{username}:
    put:
      description: Grants admin role to the given username. Only an active account
        can be promoted. Admin-only.
      parameters:
      - description: Username to promote
        in: path
        name: username
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no active account has that username
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Promote user to admin
      tags:
      - admin
  /admin/repair:
    get:
      description: 'Whether restarting Quark would reapply its system setup, and why
        not when it would not: unsupported_os, not_service, or unit_outdated (the
        installed unit predates the setup step; a one-time `sudo quark install` fixes
        that). Admin-only.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_admin.repairStatusResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get whether the installation can be repaired
      tags:
      - admin
    post:
      description: Restarts Quark so the service reapplies its system setup as root
        before it starts again. The response goes out first; the process exits about
        two seconds later and is unavailable for a few seconds. Admin-only.
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: The installation can't be repaired from Quark on this device
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Repair the installation
      tags:
      - admin
  /admin/users:
    get:
      description: Returns all registered users. Admin-only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_admin.userSummary'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List all users
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: 'Creates an active account with authKey: the standard base64 of
        the 32-byte key the admin''s client derived from the password and the salt
        GET /auth/salt returned for the new username. A body carrying password, the
        raw password an app from before auth keys sends, is refused with 426 before
        anything is checked (#2430). The admin never sees a recovery phrase: the account''s
        client gives it one on its first sign-in. The account''s home is made under
        users/ on the internal device, named after the account, and the account owns
        it. An existing folder of that name under users/ becomes the home, and a top-level
        folder of that name does not collide. Admin-only.'
      parameters:
      - description: The account to add
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_admin.createUserBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v0_admin.userSummary'
        "400":
          description: invalid username or authKey
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: that username is taken
          schema:
            $ref: '#/definitions/serverutil.Response'
        "426":
          description: 'the body carried a raw password: the app is too old'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Add an account
      tags:
      - admin
  /admin/users/{username}:
    delete:
      description: Deletes an account, its sessions, its shares and its group memberships.
        Its files stay where they are, and every path it owned becomes owned by the
        admin deleting it. An admin cannot delete their own account here, and the
        only active admin cannot be deleted. Admin-only.
      parameters:
      - description: Username to delete
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_admin.deleteUserResponse'
        "400":
          description: the caller's own account
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no account has that username
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: the only active admin
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Delete an account
      tags:
      - admin
  /albums:
    get:
      description: Returns the caller's own photo albums as a flat list, creating
        their Favorites album on first use. Admins see only their own albums too.
        Use ?tree=true to get a nested tree.
      parameters:
      - description: Return as nested tree (default false)
        in: query
        name: tree
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_albums.AlbumJSON'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List all photo albums
      tags:
      - albums
    post:
      consumes:
      - application/json
      description: Creates a photo album owned by the caller, optionally nested under
        one of the caller's albums. The name cannot contain / and must be unique among
        its siblings ignoring case; the caller's root albums, their Favorites album
        included, are siblings of each other.
      parameters:
      - description: Album name and optional parent ID
