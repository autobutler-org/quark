        in: path
        name: id
        required: true
        type: integer
      - description: New album name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_albums.renameAlbumRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_albums.AlbumJSON'
        "400":
          description: 'Bad Request: invalid id, missing name, or a / in the name'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: 'Forbidden: system album'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: 'Not Found: no album of the caller''s has that id'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: 'Conflict: an album with that name already exists here'
          schema:
