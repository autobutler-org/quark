  vaultutil.ExportEntry:
    properties:
      customFields:
        items:
          $ref: '#/definitions/vaultutil.CustomField'
        type: array
      folderName:
        type: string
      name:
        type: string
      notes:
        type: string
      password:
        type: string
      totpSecret:
        type: string
      url:
        type: string
      urlHost:
        type: string
      username:
        type: string
    type: object
  vaultutil.ExportJSON:
    properties:
