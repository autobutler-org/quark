          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: 'Forbidden: system album'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Add a photo to an album
      tags:
      - albums
  /albums/{id}/move:
    patch:
      consumes:
      - application/json
      description: Changes the parent of one of the caller's albums. Pass null parentId
        to move to root. The new parent must be the caller's own and must not already
        hold an album with the same name ignoring case; the caller's root albums,
        their Favorites album included, are siblings of each other.
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: integer
      - description: New parent ID (null for root)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_albums.moveAlbumRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_albums.AlbumJSON'
        "400":
          description: 'Bad Request: invalid id or body, or parent not found among
            the caller''s albums'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: 'Forbidden: system album, or a system album as the parent'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: 'Not Found: no album of the caller''s has that id'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: 'Conflict: an album with that name already exists here'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Move a photo album to a new parent
      tags:
      - albums
  /albums/{id}/rename:
    patch:
      consumes:
      - application/json
      description: Updates the name of one of the caller's albums. The name cannot
        contain / and must be unique among the album's siblings ignoring case; changing
        only the case of the album's own name is allowed.
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: integer
      - description: New album name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_albums.renameAlbumRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_albums.AlbumJSON'
        "400":
          description: 'Bad Request: invalid id, missing name, or a / in the name'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: 'Forbidden: system album'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: 'Not Found: no album of the caller''s has that id'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: 'Conflict: an album with that name already exists here'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Rename a photo album
      tags:
      - albums
  /auth/account:
    delete:
      description: 'Deletes the selected aspects and logs the caller out everywhere.
        Pass account=true to delete only the caller''s own account, which is what
        App Store Guideline 5.1.1(v) requires; the other aspects are a factory reset
        of the appliance. All four are opt-in and a request selecting none is rejected,
        so a truncated call cannot destroy anything. The confirm parameter must equal
        the authenticated username. Databases are dropped and re-migrated in place,
        so no restart is required. Repeat calls are idempotent. External device data
        is reached only when devices=true; a drive that is not attached at reset time
        keeps its data. Deleting the last account returns the appliance to first-boot
        setup by design. Aspects are independent: deleting the account or the database
        does NOT delete stored files, and files left behind are readable by whoever
        sets the appliance up next — the response reports filesRetained=true whenever
        that happens, so pass files=true as well to erase the data itself.'
      parameters:
      - description: Delete the caller's own account (users row). Does NOT delete
          stored files unless files=true is also passed; files left behind stay readable
          by whoever sets the appliance up next.
        in: query
        name: account
        type: boolean
      - description: Delete the appliance databases (quark.db, quark.health.db). Does
          NOT delete stored files unless files=true is also passed; files left behind
          stay readable by whoever sets the appliance up next.
        in: query
        name: database
        type: boolean
      - description: Delete stored files under the data directory
        in: query
        name: files
        type: boolean
      - description: Delete the Quark data directory on attached external devices
        in: query
        name: devices
        type: boolean
      - description: Must equal the authenticated username
        in: query
        name: confirm
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              deleted:
                properties:
                  account:
                    type: boolean
                  database:
                    type: boolean
                  devices:
                    type: boolean
                  files:
                    type: boolean
                type: object
              filesRetained:
                type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: database, files or devices requested by a non-admin
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: account=true from the only active admin while other active
            or disabled accounts exist; nothing is deleted
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Delete account data (factory reset)
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates with username and password, returns a session token.
        On the first sign-in of an account an admin created, the response also carries
        recoveryPhrase, which is never returned again. A pending or disabled account
        with the right password gets 403 with its status, so the app can tell it from
        a wrong password.
      parameters:
      - description: '{username, password}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_auth.loginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: status is pending or disabled
          schema:
            $ref: '#/definitions/v0_auth.accountRefusal'
      summary: Login
      tags:
      - auth
  /auth/logout:
    post:
      description: Invalidates the current session
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Logout
      tags:
      - auth
  /auth/recover:
    post:
      consumes:
      - application/json
      description: Resets the named account's password using its recovery phrase
      parameters:
      - description: '{username, recoveryPhrase, newPassword}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: status is pending or disabled
          schema:
            $ref: '#/definitions/v0_auth.accountRefusal'
      summary: Recover account
      tags:
      - auth
  /auth/request-account:
    post:
      consumes:
      - application/json
      description: Creates a pending account that can sign in once an admin approves
        it, and returns its recovery phrase this once. Needs no session and is rate-limited
        per IP. A pending request keeps its username taken until it is denied.
      parameters:
      - description: The username and password to request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_auth.requestAccountBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v0_auth.requestAccountResponse'
        "400":
          description: invalid username or password
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: requests are turned off, or the Quark is not set up
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: that username is taken
          schema:
            $ref: '#/definitions/serverutil.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Request an account
      tags:
      - auth
  /auth/sessions:
    delete:
      description: Deletes all active sessions for the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              revoked:
                type: boolean
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Revoke all sessions (log out everywhere)
      tags:
      - auth
    get:
      description: Returns all non-expired sessions for the authenticated user. Each
        session is identified by the SHA-256 hash of its token — pass this ID to DELETE
        /auth/sessions/{id} to revoke a specific session.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              sessions:
                items:
                  $ref: '#/definitions/authutil.SessionInfo'
                type: array
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: List active sessions
      tags:
      - auth
  /auth/sessions/{id}:
    delete:
      description: Deletes a specific session. The session ID is the SHA-256 hex hash
        of the session token, as returned by GET /auth/sessions.
      parameters:
      - description: Session ID (hex SHA-256 of token)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              revoked:
                type: boolean
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Revoke a session by ID
      tags:
      - auth
  /auth/setup:
    post:
      consumes:
      - application/json
      description: Creates the owner account, with a home under users/ on the internal
        device that it owns; an existing folder of that name under users/ becomes
        the home. Can only be called once.
      parameters:
      - description: '{username, password}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: First-boot user setup
      tags:
      - auth
  /auth/status:
    get:
      description: 'Returns whether initial setup has been completed and, once it
        has, accessRequestsEnabled: whether the sign-in page may offer to request
        an account. For a caller with a valid session it also returns that caller''s
        username and isAdmin flag.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Check auth setup status
      tags:
      - auth
  /books:
    get:
      description: Finds all books in the files directory
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_books.BookJSON'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: List books
      tags:
      - books
  /events:
    get:
      description: Upgrades the connection to WebSocket and pushes JSON events for
        file system mutations (upload, delete, move, new_folder). Each connection
        hears only events about paths its user can read; admins hear every event.
        A connection closes once its account is turned off, deleted, promoted or demoted.
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Stream real-time file/device events
      tags:
      - events
  /files:
    delete:
      description: Move files to the device's trash (internal storage included), returning
        immediately. They can be restored through /trash/restore until the hourly
        purge deletes them after the retention period. DB cleanup and events are dispatched
        in the background.
      parameters:
      - description: Root directory
        in: query
        name: rootDir
        type: string
      - collectionFormat: csv
        description: Array of file paths to delete
        in: query
        items:
          type: string
        name: filePaths
        required: true
        type: array
      - description: Device serial number to filter by
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Delete files
      tags:
      - files
    get:
      description: merges files across all managed devices for the given filePath.
        If deviceSerial is empty, list files across all devices. Otherwise, only for
        the specified device
      parameters:
      - description: File dir to list
        in: query
        name: rootDir
        type: string
      - description: Device serial number to filter by
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_files.FileNodeJSON'
            type: array
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Lists files
      tags:
      - files
    put:
      consumes:
      - application/json
      description: Enqueue a file move operation between paths/devices. Needs write
        access on the file and on the folder it moves into.
      parameters:
      - description: Move file request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_files.moveFileRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Ok
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Move or rename a file
      tags:
      - files
  /files/by-type:
    get:
      description: Recursively walks all managed devices and returns files whose fileType
        matches the given value, sorted newest-first.
      parameters:
      - description: File type to filter by (e.g. qdoc, qsheet)
        in: query
        name: fileType
        required: true
        type: string
      - collectionFormat: csv
        description: Filter by device serial(s)
        in: query
        items:
          type: string
        name: serial
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_files.FileNodeWithTimeJSON'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: List all files of a given type
      tags:
      - files
  /files/convert/xlsx:
    post:
      description: Reads an .xlsx or .xlsm workbook and writes it back as a sibling
        .qsheet, the format the Sheets editor opens. The workbook itself is left untouched.
        Answers 409 when a .qsheet of that name already exists and overwrite was not
        asked for. Needs read access on the workbook and write access on its directory;
        the caller owns a newly created .qsheet.
      parameters:
      - description: Path to the .xlsx or .xlsm file to convert
        in: query
        name: filePath
        required: true
        type: string
      - description: Device serial number
        in: query
        name: serial
        type: string
      - description: Replace an existing .qsheet of the same name
        in: query
        name: overwrite
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.ConvertXlsxJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Convert a spreadsheet to a Quark spreadsheet
      tags:
      - files
  /files/download:
    get:
      description: Downloads a single file or zips a folder and streams it back to
        the client
      parameters:
      - description: File path to download
        in: query
        name: filePath
        type: string
      - description: Device serial number to filter by
        in: query
        name: serial
        type: string
      - description: Output format conversion (e.g. 'jpeg' to convert HEIC to JPEG)
        in: query
        name: format
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Download a file or folder
      tags:
      - files
  /files/download-archive-file:
    get:
      description: Reads the specified entry from the archive and streams it to the
        client. No data is extracted to disk. With format=jpeg an image entry other
        than camera RAW is converted and served as image/jpeg; every other entry is
        served as it is.
      parameters:
      - description: Path to the archive file (relative to device files directory)
        in: query
        name: filePath
        required: true
        type: string
      - description: Path of the entry inside the archive
        in: query
        name: entryPath
        required: true
        type: string
      - description: Device serial number
        in: query
        name: serial
        type: string
      - description: Output format conversion ('jpeg' converts HEIC, TIFF, BMP and
          other decodable images to JPEG)
        in: query
        name: format
        type: string
      produces:
      - application/octet-stream
      - image/jpeg
      responses:
        "200":
          description: File content
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Entry not found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
        "503":
          description: Server busy converting other images
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Download a single file from inside an archive
      tags:
      - files
  /files/extract:
    post:
      description: Extracts a zip file into a subdirectory named after the archive
        (without its extension) in the same directory. Needs read access on the archive
        and write access on its directory; the caller owns what is extracted.
      parameters:
      - description: Path to the zip file to extract
        in: query
        name: filePath
        required: true
        type: string
      - description: Device serial number
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Extract a zip archive in place
      tags:
      - files
  /files/folder/{folderDir}:
    post:
      consumes:
      - multipart/form-data
      description: Enqueue create-folder operation under the given folder directory.
        Needs write access on that directory; the caller owns the new folder.
      parameters:
      - description: Folder directory
        in: path
        name: folderDir
        required: true
        type: string
      - description: Name of the new folder
        in: formData
        name: folderName
        required: true
        type: string
      - description: Device serial number to create folder on
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Ok
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Create a new folder
      tags:
      - files
  /files/list-archive:
    get:
      description: Opens the archive at filePath and returns the direct children of
        subPath as FileNodeJSON entries. No data is extracted to disk — only archive
        headers are read.
      parameters:
      - description: Path to the archive file (relative to device files directory)
        in: query
        name: filePath
        required: true
        type: string
      - description: Virtual subdirectory inside the archive to list (empty = root)
        in: query
        name: subPath
        type: string
      - description: Device serial number
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_files.FileNodeJSON'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: List contents of an archive file at a given virtual path
      tags:
      - files
  /files/recent:
    get:
      description: Returns files sorted by modification time (newest first) across
        all managed devices.
      parameters:
      - description: Maximum number of files to return (default 20, max 200)
        in: query
        name: limit
        type: integer
      - collectionFormat: csv
        description: Filter by device serial(s)
        in: query
        items:
          type: string
        name: serial
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_files.FileNodeWithTimeJSON'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: List recently uploaded files
      tags:
      - files
  /files/search:
    get:
      description: searches for a file across all managed devices for the given search
        term. If deviceSerial is empty, search across all devices. Otherwise, only
        for the specified device
      parameters:
      - description: Search term to find
        in: query
        name: query
        type: string
      - description: Device serial number to filter by
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_files.FileNodeJSON'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Searches for files
      tags:
      - files
  /files/search/content:
    get:
      description: |-
        Full-text search over indexed file contents using SQLite FTS5.
        Only text-based file formats are indexed (.txt, .md, .csv, .yaml, .json, etc.).
        Binary formats (images, video, PDF) are not indexed.
        Returns up to `limit` results ordered by relevance rank.
      parameters:
      - description: 'Search query (FTS5 syntax: words, AND/OR/NOT, \'
        in: query
        name: q
        required: true
        type: string
      - description: Maximum results to return (default 50, max 200)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_files.ContentSearchResult'
            type: array
        "400":
          description: Bad Request — missing query
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Search file contents (FTS5)
      tags:
      - files
  /files/stat:
    get:
      description: 'Returns filesystem metadata for the given files-relative path:
        whether it is a directory and its file type. Useful for deep-link resolution
        when the path extension alone is ambiguous (e.g. a folder named "things.qdoc").'
      parameters:
      - description: Files-relative path to stat
        in: query
        name: filePath
        required: true
        type: string
      - description: Device serial number
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.StatFileJSON'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Stat a file or directory
      tags:
      - files
  /files/upload:
    post:
      consumes:
      - multipart/form-data
      description: Upload one or more files via multipart/form-data. Needs write access
        on the top-level directory; the caller owns each file the upload creates.
        A name already in use is a 409 unless overwrite or keepBoth says what to do
        about it.
      parameters:
      - description: Device serial number to upload to
        in: query
        name: serial
        type: string
      - description: Replace a file of the same name
        in: query
        name: overwrite
        type: boolean
      - description: Land under the first free name, e.g. file_(1).txt, when the name
          is taken
        in: query
        name: keepBoth
        type: boolean
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Upload files to the top-level directory
      tags:
      - files
  /files/upload-session:
    post:
      consumes:
      - application/json
      description: 'Reserve a session for one file; the bytes follow as chunks on
        PUT. Needs write access on the directory the file lands in. The session belongs
        to the caller: it is not found for anyone else. A name already in use is a
        409 unless overwrite or keepBoth says what to do about it.'
      parameters:
      - description: File the session will carry
        in: body
        name: session
        required: true
        schema:
          $ref: '#/definitions/v0_files.createUploadSessionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.createUploadSessionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Open a resumable upload session
      tags:
      - files
  /files/upload-session/{sessionId}:
    delete:
      description: Drops the session and the bytes staged for it
      parameters:
      - description: Upload session id
        in: path
        name: sessionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Abandon a resumable upload session
      tags:
      - files
    get:
      description: Returns the committed offset a resuming client continues from
      parameters:
      - description: Upload session id
        in: path
        name: sessionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.uploadSessionStatusResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Ask what a resumable upload has committed
      tags:
      - files
    put:
      consumes:
      - application/octet-stream
      description: Append the chunk named by Content-Range; the last one commits the
        file, and the caller owns it if it is new. A session opened by someone else
        is not found. A 409 carrying X-Upload-Offset is a chunk out of step; one without
        it is a name already in use.
      parameters:
      - description: Upload session id
        in: path
        name: sessionId
        required: true
        type: string
      - description: Byte range of this chunk, e.g. bytes 0-8388607/20971520
        in: header
        name: Content-Range
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.uploadChunkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Send one chunk of a resumable upload
      tags:
      - files
  /files/upload/{rootDir}:
    post:
      consumes:
      - multipart/form-data
      description: Upload one or more files via multipart/form-data. Needs write access
        on the directory; the caller owns each file the upload creates. A name already
        in use is a 409 unless overwrite or keepBoth says what to do about it.
      parameters:
      - description: Directory to upload into
        in: path
        name: rootDir
        required: true
        type: string
      - description: Device serial number to upload to
        in: query
        name: serial
        type: string
      - description: Replace a file of the same name
        in: query
        name: overwrite
        type: boolean
      - description: Land under the first free name, e.g. file_(1).txt, when the name
          is taken
        in: query
        name: keepBoth
        type: boolean
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Upload files to a nested directory
      tags:
      - files
  /health:
    get:
      description: 'Returns current hardware health: CPU, memory, disk usage and temperature.
        Sets healthy=false with alert messages when any metric exceeds its critical
        threshold.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_health.HealthJSON'
      summary: Get system health status
      tags:
      - health
  /jobs:
    get:
      description: Returns the jobs of the requested kinds the caller may see, newest
        first, finished ones included. An admin sees every job; anyone else sees the
        jobs they queued whose file they can still read, with error left blank. This
        is the source of truth for job state; the job_* events are a hint to refresh
        and can be dropped.
      parameters:
      - collectionFormat: multi
        description: Job kinds to list; repeat for more than one (kind=video-transcode&kind=...)
        in: query
        items:
          type: string
        name: kind
        required: true
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/jobutil.Job'
            type: array
        "400":
          description: Bad Request — kind is missing, empty, or not a registered kind
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: List background jobs
      tags:
      - jobs
  /jobs/{id}:
    delete:
      description: Cancels a pending or running job and returns it, now canceled.
        A pending job never runs; a running job is stopped and cleans up after itself.
        Only the account that queued the job, or an admin, may cancel it; any other
        caller gets 404.
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jobutil.Job'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Conflict — the job has already finished
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Cancel a background job
      tags:
      - jobs
    get:
      description: Returns one background job by id. A caller who is not an admin
        gets only a job they queued whose file they can still read, with error left
        blank; any other job is 404.
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jobutil.Job'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Get a background job
      tags:
      - jobs
  /jobs/{id}/retry:
    post:
      description: Resets a failed job to pending so it runs again. It keeps its id
        and createdAt; progress, error, startedAt, and finishedAt are cleared, and
        the returned jobId is the same id. Only the account that queued the job, or
        an admin, may retry it; any other caller gets 404. The job runs as the account
        that queued it, which must still be active and able to write the folder of
        the file the job works on, or the retry is refused with 403. A retry whose
        inputs no longer exist, such as a transcode of a video that was moved or deleted,
        is refused with 422.
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/v0_jobs.retryJobResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden — the account that queued the job can no longer sign
            in or write the folder
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Conflict — only a failed job can be retried, and a job already
            reset by a retry is no longer failed
          schema:
            $ref: '#/definitions/serverutil.Response'
        "422":
          description: Unprocessable Entity — the job's inputs no longer exist
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Retry a background job
      tags:
      - jobs
  /photos:
    get:
      description: Finds all photos across all managed devices with pagination support.
