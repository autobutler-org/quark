        be changed. Publishes access_changed with no path. Admin-only.
      parameters:
      - description: Group id
        in: path
        name: id
        required: true
        type: integer
      - description: Account id
        in: path
        name: userId
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: the everyone group
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
