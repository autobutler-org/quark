        type: array
      goVersion:
        type: string
      main:
        $ref: '#/definitions/v0_version.SbomModuleJSON'
    type: object
  v0_version.SbomModuleJSON:
    properties:
      path:
        type: string
      sum:
        type: string
      version:
        type: string
    type: object
  v0_version.UpdateParams:
    properties:
      force:
        type: boolean
      source:
        $ref: '#/definitions/updateutil.UpdateSource'
      version:
        type: string
    type: object
  v0_version.UpdateRequest:
    properties:
      version:
        type: string
    type: object
  v0_version.VersionJSON:
    properties:
      buildDate:
        type: string
      gitCommit:
        type: string
      goVersion:
        type: string
      semver:
