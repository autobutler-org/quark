      - description: '{name: string}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Rename a storage device
      tags:
      - storage
  /storage/devices/role:
    put:
      consumes:
      - application/json
      description: Assigns a role (default-storage, snapshot-backup, unassigned) to
        a device. Requires the caller's login password again. A drive whose health.verdict
        is replace-soon is refused with 409 unless acknowledgeHealth is true. Watch
        does not block. Unknown is not healthy. Files already on the drive are left
        in place. Switching default storage to a drive in worse health than the current
        one uses the stronger 409 text.
      parameters:
      - description: '{serial: string, role: string, username: string, password: string,
          acknowledgeHealth: bool}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: replace-soon drive was not acknowledged
          schema:
            $ref: '#/definitions/serverutil.Response'
        "426":
          description: 'password is a raw password, not the auth key: the app is too
            old'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Set the role of a storage device
      tags:
      - storage
  /storage/devices/snapshot-backup:
    post:
      consumes:
      - application/json
      description: 'Queues a job that aggregates all files from all managed devices
        onto the target snapshot-backup device. Answers 409 while the target already
        has a pending or running backup, whichever instance started it, and 409 when
        the target''s health.verdict is replace-soon unless acknowledgeHealth is true.
        Watch does not block. It asks for no password. On SQLite the snapshot also
        copies the chat and every account''s vault, as the ciphertext they are, into
        chat_backup.db and vault_items_backup.db. On PostgreSQL the snapshot is the
        device directories and backup_manifest.json only: the chat and the vault are
        in the operator''s database backup. The backup does not delete files already
        on the drive; it removes only its own temp files and, on PostgreSQL, a chat_backup.db
        or vault_items_backup.db an earlier snapshot left at the drive''s root. jobId
        is what the status route takes.'
      parameters:
      - description: '{targetDeviceSerial: string, acknowledgeHealth: bool}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: backup already running, or a replace-soon target was not acknowledged
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Start a snapshot backup to a device
      tags:
      - storage
  /storage/devices/snapshot-backup/status/{jobId}:
    get:
      description: Returns the current status of a snapshot backup job, read from
        its row in the jobs table, so any instance answers and a backup cut off by
        a restart reads as FAILED. 404 means the id is not a backup job's.
      parameters:
      - description: Job ID
        in: path
        name: jobId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backup.BackupJob'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get snapshot backup job status
      tags:
      - storage
  /storage/devices/snapshot-backup/verify:
    post:
      consumes:
      - application/json
      description: Walks all files on the backup device and checks against the manifest
      parameters:
      - description: '{deviceSerial: string, full: bool}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: the device is not attached
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Verify integrity of a snapshot backup
      tags:
      - storage
  /storage/devices/status:
    get:
      description: Returns statuses for all known storage devices. Each device's health
        object is verdict (healthy, watch, replace-soon, or unknown), reason (one
        sentence), and when a read succeeded smartStatus, reallocatedSectors, pendingSectors,
        powerOnHours, temperatureCelsius, media (spinning or solid-state), and linkSpeed.
        worseThanDefault is true when the verdict is worse than the current default-storage
        drive (healthy, then watch, then unknown, then replace-soon). health is omitted
        until a read is attempted. Unknown is never reported as healthy, including
        when the health tool is not installed. Age is power-on hours; a heavily used
        drive does not claim a manufacture year.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List storage device statuses
      tags:
      - storage
  /storage/devices/usb/{serial}:
    delete:
      description: Unmounts a USB storage device identified by serial
      parameters:
      - description: Device serial
        in: path
        name: serial
        required: true
        type: string
      produces:
