  /cirrus/upload/{rootDir}:
    post:
      consumes:
      - multipart/form-data
      description: Upload one or more files via multipart/form-data
      parameters:
      - description: Directory to upload into
        in: path
        name: rootDir
        required: true
        type: string
      - description: Device serial number to upload to
        in: query
        name: serial
        type: string
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Upload files to a nested directory
      tags:
      - cirrus
  /events:
    get:
      description: Upgrades the connection to WebSocket and pushes JSON events for
