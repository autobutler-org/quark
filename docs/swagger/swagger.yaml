            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no account has that username
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: the last active admin
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Demote admin to regular user
      tags:
      - admin
  /admin/deny/{username}:
    put:
      description: Deletes a pending account request. Its username is free again at
