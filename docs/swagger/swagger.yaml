info:
  contact: {}
paths:
  /access:
    delete:
      consumes:
      - application/json
      description: Removes one account's or group's grant on exactly this path and
        returns the path's grants as they now stand. Only an owner of the path or
        an admin may. Access a parent folder gives is removed on that folder instead.
        A non-admin can't remove their own owner row on the path; another owner or
        an admin may remove the last one. Publishes access_changed for the path.
      parameters:
      - description: The path and one account or group
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_access.revokeAccessBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/accessutil.GrantsResult'
        "400":
          description: a path in the trash, not exactly one account or group, or the
            caller's own owner row
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: the caller can read the path but doesn't own it
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: the caller can't read the path, or that account or group has
            no access to it
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: the access comes from a parent folder
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Stop sharing a file or folder
      tags:
      - access
    get:
      description: Returns the grants on a path, then one inherited grant per account
        or group for the highest level a parent folder gives it; a grant whose from
        is not relPath is inherited and is changed on that folder. Only an owner of
        the path, directly or through a parent folder, or an admin may see them. canManage
        and canGrantOwner are true in every answer.
      parameters:
      - description: Device serial; empty is the internal device
        in: query
        name: serial
        type: string
      - description: Path on the device
        in: query
        name: relPath
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/accessutil.GrantsResult'
        "400":
          description: a path in the trash
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: the caller can read the path but doesn't own it
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: the caller can't read the path
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: List who can reach a file or folder
      tags:
      - access
    put:
      consumes:
      - application/json
      description: Grants one active account or existing group read, write or owner
        on a path, replacing the level it had there, and returns the path's grants
        as they now stand. Only an owner of the path or an admin may share it. A non-admin
        can't change their own owner row on the path. Nobody, admins included, may
        share the users or groups folder itself on the internal device. Publishes
        access_changed for the path.
      parameters:
      - description: The path, one account or group, and the level
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_access.setAccessBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/accessutil.GrantsResult'
        "400":
          description: a path in the trash, not exactly one account or group, a level
            other than read, write or owner, the caller's own owner row, or the users
            or groups folder itself
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: the caller can read the path but doesn't own it
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: the caller can't read the path, or no active account or group
            has that id
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Share a file or folder
      tags:
      - access
  /access/principals:
    get:
      description: Returns every active account by username and every group, the built-in
        everyone group first. Any signed-in account may ask, so each account carries
        only its id and username.
