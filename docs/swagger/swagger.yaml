  /files/download:
    get:
      description: Downloads a single file or zips a folder and streams it back to
        the client
      parameters:
      - description: File path to download
        in: query
        name: filePath
        type: string
      - description: Device serial number to filter by
        in: query
        name: serial
        type: string
      - description: Output format conversion (e.g. 'jpeg' to convert HEIC to JPEG)
        in: query
        name: format
        type: string
      - description: 'Token from POST /files/download-token, for a browser link that
          cannot send an Authorization header. It is good for one download: the first
          request, then retries that resume it with a Range header or start it over
          without one, until the file is delivered or 10 minutes pass with no request.
          The response is then always an attachment.'
        in: query
        name: downloadToken
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Download a file or folder
      tags:
      - files
  /files/download-archive-file:
    get:
      description: Reads the specified entry from the archive and streams it to the
        client. No data is extracted to disk. With format=jpeg an image entry other
        than camera RAW is converted and served as image/jpeg; every other entry is
        served as it is.
      parameters:
      - description: Path to the archive file (relative to device files directory)
        in: query
        name: filePath
        required: true
        type: string
      - description: Path of the entry inside the archive
        in: query
        name: entryPath
        required: true
        type: string
      - description: Device serial number
        in: query
        name: serial
        type: string
      - description: Output format conversion ('jpeg' converts HEIC, TIFF, BMP and
          other decodable images to JPEG)
        in: query
        name: format
        type: string
      - description: 'Token from POST /files/download-token, for a browser link that
          cannot send an Authorization header. It is good for one download: the first
          request, then retries that resume it with a Range header or start it over
          without one, until the file is delivered or 10 minutes pass with no request.
          The response is then always an attachment.'
        in: query
        name: downloadToken
        type: string
      produces:
      - application/octet-stream
      - image/jpeg
      responses:
        "200":
          description: File content
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Entry not found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
        "503":
          description: Server busy converting other images
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Download a single file from inside an archive
      tags:
      - files
  /files/download-token:
    post:
      description: 'Issues a token that authenticates one download by GET /files/download
        (or /files/download-archive-file, where filePath is the archive) of the same
        filePath and serial, passed as the downloadToken query parameter. A browser
        link cannot send an Authorization header; this lets the web client hand the
        download to the browser, which streams it to disk. The token is good for one
        download: the first request, then retries of an interrupted one, resuming
        with a Range header or starting over without one, until the file is delivered
        or 10 minutes pass with no request. A folder is zipped on the fly and cannot
        be resumed. The token runs as the caller, makes the response an attachment,
        and expires unused after about a minute. Needs read access on the path.'
      parameters:
      - description: File path the token is for
        in: query
        name: filePath
        required: true
        type: string
      - description: Device serial number the token is for
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.createDownloadTokenResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Issue a download token
      tags:
      - files
  /files/extract:
    post:
      description: Extracts a zip file into a subdirectory named after the archive
        (without its extension) in the same directory. Needs read access on the archive
        and write access on its directory; the caller owns what is extracted.
      parameters:
      - description: Path to the zip file to extract
        in: query
        name: filePath
        required: true
        type: string
      - description: Device serial number
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Extract a zip archive in place
      tags:
      - files
  /files/folder/{folderDir}:
    post:
      consumes:
      - multipart/form-data
      description: Enqueue create-folder operation under the given folder directory.
        Needs write access on that directory; the caller owns the new folder.
      parameters:
      - description: Folder directory
        in: path
        name: folderDir
