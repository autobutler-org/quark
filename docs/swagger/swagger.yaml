  description: |-
    The REST API a Quark device serves to its Flutter clients. Every endpoint except
    /auth/setup, /auth/login, /auth/recover, /auth/request-account and /auth/status needs a
    session token. Sign in with POST /auth/login, then click Authorize and enter the word
    Bearer, a space, and the token.
  title: Quark API
  version: v0
paths:
  /access:
    delete:
      consumes:
      - application/json
      description: Removes one account's or group's grant on exactly this path and
        returns the path's grants as they now stand. Only an owner of the path or
        an admin may. Access a parent folder gives is removed on that folder instead.
        A non-admin can't remove their own owner row on the path; another owner or
        an admin may remove the last one. Publishes access_changed for the path.
      parameters:
      - description: The path and one account or group
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_access.revokeAccessBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/accessutil.GrantsResult'
        "400":
          description: a path in the trash, not exactly one account or group, or the
            caller's own owner row
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: the caller can read the path but doesn't own it
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: the caller can't read the path, or that account or group has
            no access to it
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: the access comes from a parent folder
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Stop sharing a file or folder
      tags:
      - access
    get:
      description: Returns the grants on a path, then one inherited grant per account
        or group for the highest level a parent folder gives it; a grant whose from
        is not relPath is inherited and is changed on that folder. Only an owner of
        the path, directly or through a parent folder, or an admin may see them. canManage
        and canGrantOwner are true in every answer.
      parameters:
      - description: Device serial; empty is the internal device
        in: query
        name: serial
        type: string
      - description: Path on the device
        in: query
        name: relPath
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/accessutil.GrantsResult'
        "400":
          description: a path in the trash
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: the caller can read the path but doesn't own it
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: the caller can't read the path
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List who can reach a file or folder
      tags:
      - access
    put:
      consumes:
      - application/json
      description: Grants one active account or existing group read, write or owner
        on a path, replacing the level it had there, and returns the path's grants
        as they now stand. Only an owner of the path or an admin may share it. A non-admin
        can't change their own owner row on the path. Nobody, admins included, may
        share the users or groups folder itself on the internal device. Publishes
        access_changed for the path.
      parameters:
      - description: The path, one account or group, and the level
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_access.setAccessBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/accessutil.GrantsResult'
        "400":
          description: a path in the trash, not exactly one account or group, a level
            other than read, write or owner, the caller's own owner row, or the users
            or groups folder itself
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: the caller can read the path but doesn't own it
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: the caller can't read the path, or no active account or group
            has that id
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Share a file or folder
      tags:
      - access
  /access/mine:
    get:
      description: Returns the root of each ad-hoc share the signed-in account holds,
        with the account or group that owns it, for the file browser's Shared with
        me shortcut. Left out are their own home and its contents, which My files
        opens; every group folder and its contents, which Groups opens; the users
        and groups folders themselves; the device root; the trash; and a grant inside
        another grant. An admin bypasses the access table, so their answer is empty
        and they reach everything through All files.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/accessutil.ListSharedWithMeResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List what has been shared with you
      tags:
      - access
  /access/principals:
    get:
      description: Returns every active account by username and every group, the built-in
        everyone group first. Any signed-in account may ask, so each account carries
        only its id and username.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/accessutil.ListPrincipalsResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List who a file or folder can be shared with
      tags:
      - access
  /admin/approve/{username}:
    put:
      description: Turns a pending account request into an active account that can
        sign in, with a home under users/ on the internal device that it owns. An
        existing folder of that name under users/ becomes the home. Admin-only.
      parameters:
      - description: Username of the pending request
        in: path
        name: username
        required: true
        type: string
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no account request has that username
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Approve an account request
      tags:
      - admin
  /admin/demote/{username}:
    put:
      description: Removes admin role from the given username. Refused with 409 while
        the Quark has at most one active admin. Admin-only.
      parameters:
      - description: Username to demote
        in: path
        name: username
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no account has that username
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: the last active admin
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Demote admin to regular user
      tags:
      - admin
  /admin/deny/{username}:
    put:
      description: Deletes a pending account request. Its username is free again at
        once. Admin-only.
      parameters:
      - description: Username of the pending request
        in: path
        name: username
        required: true
        type: string
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no account request has that username
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Deny an account request
      tags:
      - admin
  /admin/disable/{username}:
    put:
      description: Stops an account from signing in, and ends its sessions and open
        event streams. The account keeps its files and shares, so turning it back
        on restores it. An admin cannot turn off their own account, and the only active
        admin cannot be turned off. Admin-only.
      parameters:
      - description: Username to turn off
        in: path
        name: username
        required: true
        type: string
      responses:
        "200":
          description: OK
        "400":
          description: the caller's own account
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no active account has that username
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: the only active admin
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Turn an account off
      tags:
      - admin
  /admin/enable/{username}:
    put:
      description: Lets a disabled account sign in again, with everything it owned
        when it was turned off. Admin-only.
      parameters:
      - description: Username to turn back on
        in: path
        name: username
        required: true
        type: string
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no disabled account has that username
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Turn an account back on
      tags:
      - admin
  /admin/groups:
    get:
      description: 'Returns every group with its members, the built-in everyone group
        first and the rest by name. everyone lists no members: it includes every active
        account. Admin-only.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/grouputil.Group'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List groups
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Creates an empty group and its folder in groups on the internal
        device, named after the group, with one grant giving the group write there;
        an existing folder of that name is adopted. The name is trimmed, has 1 to
        64 characters, no control characters or slashes, isn't . or .., and is unique
        ignoring case. Publishes account_changed and new_folder. Admin-only.
      parameters:
      - description: The group's name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_admin.groupNameBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/grouputil.Group'
        "400":
          description: invalid name
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: a group with that name already exists
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Create a group
      tags:
      - admin
  /admin/groups/{id}:
    delete:
      description: Deletes a group, its memberships and every share made to it, so
        its members lose what only the group gave them. Its folder in groups and its
        content stay, admin-only from then on. The everyone group can't be deleted.
        Publishes access_changed with no path. Admin-only.
      parameters:
      - description: Group id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: the everyone group
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no group has that id
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Delete a group
      tags:
      - admin
    put:
      consumes:
      - application/json
      description: Renames a group under the same rules a new name follows; a group
        may take its own name in another case. Its folder in groups is renamed to
        match as an ordinary move does, carrying its shares, favorites and album items,
        and publishing move and access_changed. The everyone group can't be renamed.
        The response lists no members. Publishes account_changed. Admin-only.
      parameters:
      - description: Group id
        in: path
        name: id
        required: true
        type: integer
      - description: The group's new name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_admin.groupNameBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/grouputil.Group'
        "400":
          description: invalid name, or the everyone group
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no group has that id
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: a group with that name already exists, or another folder in
            groups already has the new name
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Rename a group
      tags:
      - admin
  /admin/groups/{id}/members/{userId}:
    delete:
      description: Takes an account out of a group, whatever the account's status,
        so it loses what only the group gave it. Members of the everyone group can't
        be changed. Publishes access_changed with no path. Admin-only.
      parameters:
      - description: Group id
        in: path
        name: id
        required: true
        type: integer
      - description: Account id
        in: path
        name: userId
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: the everyone group
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no group has that id, or that account isn't in the group
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Take an account out of a group
      tags:
      - admin
    put:
      description: Puts an active account in a group, so it reaches what the group
        was shared. Adding a member again changes nothing. Members of the everyone
        group can't be changed. Publishes access_changed with no path when the membership
        is new. Admin-only.
      parameters:
      - description: Group id
        in: path
        name: id
        required: true
        type: integer
      - description: Account id
        in: path
        name: userId
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: the everyone group
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no group has that id, or no active account has that id
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Add an account to a group
      tags:
      - admin
  /admin/promote/{username}:
    put:
      description: Grants admin role to the given username. Only an active account
        can be promoted. Admin-only.
      parameters:
      - description: Username to promote
        in: path
        name: username
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no active account has that username
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Promote user to admin
      tags:
      - admin
  /admin/repair:
    get:
      description: 'Whether restarting Quark would reapply its system setup, and why
        not when it would not: unsupported_os, not_service, or unit_outdated (the
        installed unit predates the setup step; a one-time `sudo quark install` fixes
        that). Admin-only.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_admin.repairStatusResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get whether the installation can be repaired
      tags:
      - admin
    post:
      description: Restarts Quark so the service reapplies its system setup as root
        before it starts again. The response goes out first; the process exits about
        two seconds later and is unavailable for a few seconds. Admin-only.
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: The installation can't be repaired from Quark on this device
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Repair the installation
      tags:
      - admin
  /admin/users:
    get:
      description: Returns all registered users. Admin-only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_admin.userSummary'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List all users
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: 'Creates an active account with the given password, or with authKey
        in its place: the standard base64 of the 32-byte key the admin''s client derived
        from the password and the salt GET /auth/salt returned for the new username.
        Exactly one of the two is sent. The admin never sees its recovery phrase:
        the account gets one on its first sign-in. The account''s home is made under
        users/ on the internal device, named after the account, and the account owns
        it. An existing folder of that name under users/ becomes the home, and a top-level
        folder of that name does not collide. Admin-only.'
      parameters:
      - description: The account to add
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_admin.createUserBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v0_admin.userSummary'
        "400":
          description: invalid username, password or authKey
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: that username is taken
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Add an account
      tags:
      - admin
  /admin/users/{username}:
    delete:
      description: Deletes an account, its sessions, its shares and its group memberships.
        Its files stay where they are, and every path it owned becomes owned by the
        admin deleting it. An admin cannot delete their own account here, and the
        only active admin cannot be deleted. Admin-only.
      parameters:
      - description: Username to delete
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_admin.deleteUserResponse'
        "400":
          description: the caller's own account
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no account has that username
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: the only active admin
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Delete an account
      tags:
      - admin
  /albums:
    get:
      description: Returns the caller's own photo albums as a flat list, creating
        their Favorites album on first use. Admins see only their own albums too.
        Use ?tree=true to get a nested tree.
      parameters:
      - description: Return as nested tree (default false)
        in: query
        name: tree
        type: boolean
      produces:
      - application/json
