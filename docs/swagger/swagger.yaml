  /trash:
    get:
      description: Lists a device's trashed items, most recently trashed first, with
        how many days anything stays before the hourly purge deletes it. A non-admin
        sees what they trashed and what was trashed from a place they can read.
      parameters:
      - description: Device serial; empty for internal storage
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_trash.listTrashResponse'
        "404":
          description: Unknown device
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List the trash
      tags:
      - trash
  /trash/contents:
    get:
      description: Lists what a trashed folder, or a folder inside one, holds, sorted
        by name. Each entry's path is relative to the trashed item and can be passed
        back here, to restore, or to delete. Also returns where the folder would be
        restored to and when the trashed item expires. A trashed item the caller cannot
        see is not found.
      parameters:
      - description: Device serial; empty for internal storage
        in: query
        name: serial
        type: string
      - description: The trashed item
        in: query
        name: trashName
        required: true
        type: string
      - description: Path inside the trashed item; empty for the item itself
        in: query
        name: path
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_trash.listTrashContentsResponse'
        "400":
          description: Malformed trash name or path, or not a folder
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Unknown device, trash name or path
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List a folder in the trash
      tags:
      - trash
  /trash/delete:
    post:
      consumes:
      - application/json
      description: Deletes the named trashed items for good. An item with a path deletes
        only that file or folder from inside a trashed folder. Every item is checked
        first, so a batch naming an unknown item deletes nothing.
      parameters:
      - description: 'Device serial and the items to delete: a trash name, plus a
          path inside a trashed folder to delete only that'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_trash.trashItemsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_trash.deletedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: An item the caller can see but did not trash and cannot write
            where it came from
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Unknown device, trash name or path, or an item the caller cannot
            see
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Delete items from the trash permanently
      tags:
      - trash
  /trash/empty:
    post:
      consumes:
      - application/json
      description: 'Permanently deletes everything in a device''s trash. A non-admin
        empties only the items they could delete one at a time: the ones they trashed
        and the ones trashed from a folder they can write.'
      parameters:
      - description: Device serial; empty for internal storage
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_trash.emptyTrashRequest'
      produces:
      - application/json
      responses:
