      parameters:
      - description: Username of the pending request
        in: path
        name: username
        required: true
        type: string
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no account request has that username
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Deny an account request
      tags:
      - admin
  /admin/disable/{username}:
    put:
      description: Stops an account from signing in, and ends its sessions and open
        event streams. The account keeps its files and shares, so turning it back
        on restores it. An admin cannot turn off their own account, and the only active
        admin cannot be turned off. Admin-only.
      parameters:
      - description: Username to turn off
        in: path
        name: username
        required: true
        type: string
      responses:
        "200":
          description: OK
        "400":
          description: the caller's own account
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no active account has that username
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: the only active admin
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Turn an account off
