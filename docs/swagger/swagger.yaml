basePath: /api/v0
definitions:
  accessutil.Grant:
    properties:
      builtin:
        description: Builtin marks the everyone group.
        type: boolean
      from:
        description: |-
          From is the path the row is on. A grant whose From is not the path
          asked about is inherited from that folder, and is changed there.
        type: string
      groupId:
        description: GroupID is set for a grant to a group.
        type: integer
      level:
        description: Level is read, write or owner.
        type: string
      name:
        description: Name is the account's username or the group's name.
        type: string
      userId:
        description: UserID is set for a grant to an account.
        type: integer
    type: object
  accessutil.GrantsResult:
    properties:
      canGrantOwner:
        description: |-
          CanGrantOwner is whether the caller may grant, change or revoke owner.
          Every owner may, so it equals CanManage.
        type: boolean
      canManage:
        description: |-
          CanManage is whether the caller may change the grants. Only a caller who
          may manage sees them at all, so it is true in every result.
        type: boolean
      deviceSerial:
        type: string
      grants:
        description: |-
          Grants lists the rows on the path, then one inherited grant per principal
          holding the highest level any parent folder gives it.
        items:
          $ref: '#/definitions/accessutil.Grant'
        type: array
      relPath:
        type: string
    type: object
  accessutil.ListPrincipalsResult:
    properties:
      groups:
        items:
          $ref: '#/definitions/accessutil.PrincipalGroup'
        type: array
      users:
        items:
          $ref: '#/definitions/accessutil.PrincipalUser'
        type: array
    type: object
  accessutil.ListSharedWithMeResult:
    properties:
      items:
        items:
          $ref: '#/definitions/accessutil.SharedItem'
        type: array
    type: object
  accessutil.PrincipalGroup:
    properties:
      builtin:
        description: Builtin marks the everyone group.
        type: boolean
      id:
        type: integer
      name:
        type: string
    type: object
  accessutil.PrincipalUser:
    properties:
      id:
        type: integer
      username:
        type: string
    type: object
  accessutil.SharedItem:
    properties:
      deviceSerial:
        description: DeviceSerial names the device; empty is the internal one.
        type: string
      level:
        description: Level is read, write or owner.
        type: string
      owner:
        description: |-
          Owner is the username of the account, or the name of the group, that
          owns the item. It is empty when no owner row covers the path.
        type: string
      relPath:
        type: string
    type: object
  authutil.SessionInfo:
    properties:
      createdAt:
        type: string
      current:
        description: Current marks the session the request was authenticated with.
        type: boolean
      expiresAt:
        type: string
      id:
        type: string
      lastUsedAt:
        description: |-
          LastUsedAt is when the session last renewed itself; renewal is
          debounced, so it can trail the newest request.
        type: string
    type: object
  chatutil.Channel:
    properties:
      createdAt:
        type: string
      createdBy:
        description: |-
          CreatedBy is the account that created the channel; absent for general
          and for a channel whose creator was deleted.
        type: integer
      id:
        type: integer
      isDefault:
        description: IsDefault marks general.
        type: boolean
      isPrivate:
        description: IsPrivate is whether everyone has no row on the channel.
        type: boolean
      kind:
        description: Kind is channel; dm is reserved for direct messages (#2423).
        type: string
      name:
        type: string
      permissions:
        description: |-
          Permissions is the caller's effective set: the union of every row that
          reaches them. Empty for an admin managing a channel they are not in.
        items:
          enum:
          - read_messages
          - send_messages
          - add_reactions
          - delete_messages
          - manage_channel
          - manage_members
          - manage_reactions
          type: string
        type: array
      serverId:
        type: integer
      topic:
        type: string
    type: object
  chatutil.ChannelEvent:
    properties:
      actorId:
        description: ActorID is who made the change; absent once that account is deleted.
        type: integer
      channelId:
        type: integer
      createdAt:
        type: string
      id:
        type: integer
      kind:
        description: Kind is member_set, member_removed or key_created.
        type: string
      payload:
        description: |-
          Payload is the JSON the signature covers, byte for byte: for a member
          change {"userId"|"groupId", "name", "permissions"}, for a key {"version"}.
        type: string
      signature:
        description: Signature and SignerSignKey are both absent until the actor signs.
        items:
          type: integer
        type: array
      signerSignKey:
        items:
          type: integer
        type: array
    type: object
  chatutil.CreateKeyVersionResult:
    properties:
      event:
        $ref: '#/definitions/chatutil.ChannelEvent'
      grant:
        $ref: '#/definitions/chatutil.KeyGrant'
      version:
        $ref: '#/definitions/chatutil.KeyVersion'
    type: object
  chatutil.GetChannelKeysResult:
    properties:
      currentVersion:
        description: |-
          CurrentVersion is the newest version, 0 before any exists: the first
          member client to open the channel then creates version 1.
        type: integer
      grants:
        description: Grants are the caller's own, one per version it has been given.
        items:
          $ref: '#/definitions/chatutil.KeyGrant'
        type: array
      rotationNeeded:
        description: |-
          RotationNeeded is set when someone holding the current version no longer
          holds read_messages; the next member client online creates the next one.
        type: boolean
      versions:
        items:
          $ref: '#/definitions/chatutil.KeyVersion'
        type: array
    type: object
  chatutil.GrantUpload:
    properties:
      sealedKey:
        items:
          type: integer
        type: array
      signature:
        items:
          type: integer
        type: array
      userId:
        type: integer
      version:
        type: integer
    type: object
  chatutil.KeyGrant:
    properties:
      createdAt:
        type: string
      grantedBy:
        description: GrantedBy is absent when the granter's account was deleted.
        type: integer
      granterSignKey:
        description: |-
          GranterSignKey is the granter's published Ed25519 key when the grant was
          uploaded, which Signature verifies against.
        items:
          type: integer
        type: array
      sealedKey:
        description: |-
          SealedKey is crypto_box_seal of the channel key to the member's X25519
          key.
        items:
          type: integer
        type: array
      signature:
        description: |-
          Signature is the granter's Ed25519 signature over the grant's canonical
          bytes (docs/chat-security.md).
        items:
          type: integer
        type: array
      userId:
        type: integer
      version:
        type: integer
    type: object
  chatutil.KeyVersion:
    properties:
      createdAt:
        type: string
      createdBy:
        description: CreatedBy is absent when the account that created it was deleted.
        type: integer
      version:
        type: integer
    type: object
  chatutil.Keys:
    properties:
      boxPublicKey:
        items:
          type: integer
        type: array
      createdAt:
        type: string
      kdfParams:
        description: KdfParams is the client's JSON object recording the Argon2id
          cost.
        type: object
      saltPw:
        items:
          type: integer
        type: array
      saltRp:
        items:
          type: integer
        type: array
      signPublicKey:
        items:
          type: integer
        type: array
      updatedAt:
        type: string
      wrappedByPassword:
        items:
          type: integer
        type: array
      wrappedByPhrase:
        description: WrappedByPhrase and SaltRp are both present or both absent.
        items:
          type: integer
        type: array
    type: object
  chatutil.ListChannelsResult:
    properties:
      channels:
        items:
          $ref: '#/definitions/chatutil.Channel'
        type: array
    type: object
  chatutil.ListEventsResult:
    properties:
      events:
        items:
          $ref: '#/definitions/chatutil.ChannelEvent'
        type: array
    type: object
  chatutil.ListMembersResult:
    properties:
      event:
        allOf:
        - $ref: '#/definitions/chatutil.ChannelEvent'
        description: |-
          Event is the member_set or member_removed event SetMember and
          RemoveMember recorded, for the caller to sign; absent from ListMembers.
      members:
        items:
          $ref: '#/definitions/chatutil.Member'
        type: array
    type: object
  chatutil.ListMessagesResult:
    properties:
      messages:
        items:
          $ref: '#/definitions/chatutil.Message'
        type: array
    type: object
  chatutil.ListPendingGrantsResult:
    properties:
      currentVersion:
        type: integer
      pending:
        items:
          $ref: '#/definitions/chatutil.PendingGrant'
        type: array
      rotationNeeded:
        type: boolean
    type: object
  chatutil.Member:
    properties:
      avatarUpdatedAt:
        description: |-
          AvatarUpdatedAt is an account's profile picture version in Unix
          milliseconds, absent when it has none.
        type: integer
      builtin:
        description: Builtin marks the everyone group.
        type: boolean
      groupId:
        description: GroupID is set for a group.
        type: integer
      name:
        description: Name is the account's username or the group's name.
        type: string
      permissions:
        description: Permissions is this row's set, not anyone's effective one.
        items:
          enum:
          - read_messages
          - send_messages
          - add_reactions
          - delete_messages
          - manage_channel
          - manage_members
          - manage_reactions
          type: string
        type: array
      userId:
        description: UserID is set for an account.
        type: integer
      users:
        description: |-
          Users are the active accounts in a group, everyone's being every active
          account. Absent for an account or an empty group.
        items:
          $ref: '#/definitions/chatutil.MemberUser'
        type: array
    type: object
  chatutil.MemberUser:
    properties:
      avatarUpdatedAt:
        description: |-
          AvatarUpdatedAt is the profile picture version in Unix milliseconds,
          absent when it has none.
        type: integer
      id:
        type: integer
      username:
        type: string
    type: object
  chatutil.Message:
    properties:
      authorId:
        description: AuthorID is absent once the author's account is deleted.
        type: integer
      channelId:
        type: integer
      ciphertext:
        description: |-
          Ciphertext is nonce || XChaCha20-Poly1305 output under the channel key
          of KeyVersion, with the channel id and key version as additional data
          (docs/chat-security.md). Absent once deleted.
        items:
          type: integer
        type: array
      createdAt:
        type: string
      deletedAt:
        type: string
      editedAt:
        type: string
      id:
        type: integer
      keyVersion:
        type: integer
      reactions:
        description: |-
          Reactions are the message's reactions, oldest first, in a
          ListMessages page. A deleted message has none: they go with its
          ciphertext.
        items:
          $ref: '#/definitions/chatutil.Reaction'
        type: array
    type: object
  chatutil.PendingGrant:
    properties:
      boxPublicKey:
        items:
          type: integer
        type: array
      userId:
        type: integer
      version:
        type: integer
    type: object
  chatutil.PublicKeys:
    properties:
      boxPublicKey:
        items:
          type: integer
        type: array
      signPublicKey:
        items:
          type: integer
        type: array
      userId:
        type: integer
    type: object
  chatutil.Reaction:
    properties:
      ciphertext:
        description: |-
          Ciphertext is nonce || XChaCha20-Poly1305 output under the channel key
          of KeyVersion, with the channel, key version, message and reacting
          account as additional data (docs/chat-security.md).
        items:
          type: integer
        type: array
      createdAt:
        type: string
      id:
        type: integer
      keyVersion:
        description: |-
          KeyVersion is the channel key the reaction was encrypted under, which
          needn't be its message's.
        type: integer
      messageId:
        type: integer
      userId:
        type: integer
    type: object
  chatutil.RejectGrantResult:
    properties:
      version:
        type: integer
    type: object
  chatutil.UploadGrantsResult:
    properties:
      grants:
        items:
          $ref: '#/definitions/chatutil.KeyGrant'
        type: array
    type: object
  featureflagutil.FlagState:
    properties:
      default:
        description: Default is whether the feature is on while no admin has set the
          flag.
        type: boolean
      description:
        type: string
      enabled:
        type: boolean
      introducedIn:
        description: |-
          IntroducedIn is the release or issue the beta started at, so a flag
          that has outlived its beta is visible.
        type: string
      key:
        description: 'Key is stable: it is the flag''s name in the API and in settings.json.'
        type: string
      label:
        description: |-
          Label and Description are admin-facing copy. Description says what
          turning the flag off actually does.
        type: string
      sunsetIssue:
        description: SunsetIssue is the issue that removes the flag. Required.
        type: integer
    type: object
  featureflagutil.ListFlagsResult:
    properties:
      features:
        items:
          $ref: '#/definitions/featureflagutil.FlagState'
        type: array
    type: object
  grouputil.Group:
    properties:
      builtin:
        type: boolean
      id:
        type: integer
      members:
        items:
          $ref: '#/definitions/grouputil.Member'
        type: array
      name:
        type: string
    type: object
  grouputil.Member:
    properties:
      id:
        type: integer
      username:
        type: string
    type: object
  jobutil.Job:
    properties:
      attempts:
        description: |-
          Attempts is how many times the job has started running: 0 before its
          first run. A retry leaves it alone; the next run bumps it.
        type: integer
      createdAt:
        description: CreatedAt is when the job was queued.
        type: string
      error:
        description: Error is diagnostic text for a failed job, not copy for a user.
        type: string
      finishedAt:
        description: FinishedAt is null until the job completes, fails, or is canceled.
        type: string
      id:
        type: integer
      kind:
        type: string
      lane:
        description: |-
          Lane is the concurrency lane within Kind the job runs in, such as "copy"
          for a transcode that only copies streams. It is "" for a kind with one
          lane.
        type: string
      name:
        description: Name is display text, such as "Convert vacation.mkv to MOV".
        type: string
      params:
        description: |-
          Params is the kind-specific JSON object the job was enqueued with, so a
          client can build its own label from Kind and Params.
        type: object
      progress:
        type: number
      startedAt:
        description: StartedAt is null until the job starts running.
        type: string
      status:
        allOf:
        - $ref: '#/definitions/jobutil.Status'
        enum:
        - pending
        - running
        - completed
        - failed
        - canceled
    type: object
  jobutil.Status:
    enum:
    - pending
    - running
    - completed
    - failed
    - canceled
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusRunning
    - StatusCompleted
    - StatusFailed
    - StatusCanceled
  photoutil.AlbumRef:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  photoutil.DuplicateGroup:
    properties:
      kind:
        description: |-
          Kind is "exact" (identical content hash) or "near" (perceptual hash
          Hamming distance within the configured threshold).
        type: string
      maxDistance:
        description: |-
          MaxDistance is the largest Hamming distance between any two of the
          group's dHashes, over every photo clustered, including any the caller
          cannot read. It is 0 for an exact group.
        type: integer
      photos:
        description: Photos is the list of photos in this duplicate group.
        items:
          $ref: '#/definitions/photoutil.DuplicatePhoto'
        type: array
    type: object
  photoutil.DuplicatePhoto:
    properties:
      deviceSerial:
        type: string
      relPath:
        type: string
    type: object
  photoutil.ExifSummary:
    properties:
      aperture:
        type: number
      dateTaken:
        type: string
      focalLength:
        type: number
      iso:
        type: integer
      latitude:
        type: number
      lens:
        type: string
      longitude:
        type: number
      make:
        type: string
      model:
        type: string
      shutterSpeed:
        type: string
    type: object
  photoutil.PhotoSummary:
    properties:
      fileName:
        type: string
      hasLiveVideo:
        type: boolean
      mtime:
        type: integer
      relPath:
        type: string
      serial:
        type: string
      size:
        type: integer
      takenAt:
        description: |-
          TakenAt is the EXIF capture date in Unix seconds, set under SortTaken
          for a photo whose date is known (#2592).
        type: integer
    type: object
  serverutil.ContentType:
    enum:
    - text/html
    - application/json
    type: string
    x-enum-varnames:
    - ContentTypeHTML
    - ContentTypeJSON
  serverutil.Response:
    properties:
      contentType:
        $ref: '#/definitions/serverutil.ContentType'
      data: {}
      error: {}
      statusCode:
        type: integer
    type: object
  sshutil.Key:
    properties:
      comment:
        description: Comment is the text after the key, often user@host. May be empty.
        type: string
      fingerprint:
        description: Fingerprint is the SHA256 fingerprint, as `ssh-keygen -l` prints
          it.
        type: string
      type:
        description: Type is the key algorithm, such as ssh-ed25519.
        type: string
    type: object
  storageutil.TrashContentsItem:
    properties:
      isDir:
        type: boolean
      modifiedAt:
        type: string
      name:
        type: string
      path:
        description: |-
          Path is relative to the trashed item, and is what a contents listing,
          a restore or a delete takes to address this entry.
        type: string
      size:
        type: integer
    type: object
  storageutil.TrashItem:
    properties:
      expiresAt:
        description: ExpiresAt is when the hourly purge deletes the item for good.
        type: string
      isDir:
        type: boolean
      name:
        description: Name is the item's base name as it was before it was trashed.
        type: string
      originalPath:
        description: |-
          OriginalPath is where a restore puts the item back, relative to the
          device's files directory. Empty when its metadata is missing.
        type: string
      size:
        type: integer
      trashName:
        description: TrashName addresses the item in restore and delete requests.
        type: string
      trashedAt:
        type: string
    type: object
  storageutil.TrashRef:
    properties:
      path:
        description: |-
          Path is relative to the trashed item, slash-separated; empty is the
          item itself.
        type: string
      trashName:
        type: string
    type: object
  updateutil.UpdateSource:
    properties:
      account:
        type: string
      kind:
        $ref: '#/definitions/updateutil.UpdateSourceKind'
      path:
        type: string
    type: object
  updateutil.UpdateSourceKind:
    enum:
    - azure
    - github
    type: string
    x-enum-varnames:
    - UpdateSourceKindAzure
    - UpdateSourceKindGithub
  updateutil.UpdateVersion:
    properties:
      url:
        type: string
      version:
        type: string
    type: object
  usersettingsutil.Settings:
    properties:
      themeColor:
        description: |-
          ThemeColor overrides the Quark's theme color for this account. Empty means
          follow the Quark. See settingsutil.ValidateThemeColor for what it may hold.
        type: string
    type: object
  v0_access.revokeAccessBody:
    properties:
      deviceSerial:
        description: DeviceSerial names the device; empty is the internal one.
        type: string
      groupId:
        type: integer
      relPath:
        type: string
      userId:
        type: integer
    type: object
  v0_access.setAccessBody:
    properties:
      deviceSerial:
        description: DeviceSerial names the device; empty is the internal one.
        type: string
      groupId:
        type: integer
      level:
        description: Level is read, write or owner.
        type: string
      relPath:
        type: string
      userId:
        type: integer
    type: object
  v0_admin.createUserBody:
    properties:
      authKey:
        type: string
      password:
        description: |-
          Exactly one of Password and AuthKey is sent. AuthKey is the standard
          base64 of the 32-byte key derived from the password (#2430).
        type: string
      username:
        type: string
    required:
    - username
    type: object
  v0_admin.deleteUserResponse:
    properties:
      ownerRowsReassigned:
        type: integer
    type: object
  v0_admin.groupNameBody:
    properties:
      name:
        type: string
    type: object
  v0_admin.repairStatusResponse:
    properties:
      available:
        type: boolean
      reason:
        description: |-
          Reason is why not, when available is false: unsupported_os,
          not_service or unit_outdated. Empty when available.
        type: string
    type: object
  v0_admin.userSummary:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      isAdmin:
        type: boolean
      status:
        description: Status is pending, active or disabled.
        type: string
      username:
        type: string
    type: object
  v0_albums.AlbumItemJSON:
    properties:
      addedAt:
        type: string
      albumId:
        type: integer
      deviceSerial:
        type: string
      id:
        type: integer
      relPath:
        type: string
      takenAt:
        description: |-
          TakenAt is the photo's EXIF capture date, sent under sort=taken when
          it is known (#2592).
        type: string
    type: object
  v0_albums.AlbumJSON:
    properties:
      children:
        items:
          $ref: '#/definitions/v0_albums.AlbumJSON'
        type: array
      createdAt:
        type: string
      id:
        type: integer
      itemCount:
        type: integer
      name:
        type: string
      parentId:
        type: integer
      smartType:
        type: string
      updatedAt:
        type: string
    type: object
  v0_albums.addPhotoRequest:
    properties:
      deviceSerial:
        type: string
      relPath:
        type: string
    type: object
  v0_albums.createAlbumRequest:
    properties:
      name:
        type: string
      parentId:
        type: integer
    required:
    - name
    type: object
  v0_albums.moveAlbumRequest:
    properties:
      parentId:
        type: integer
    type: object
  v0_albums.renameAlbumRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  v0_auth.accountRefusal:
    properties:
      error:
        type: string
      status:
        description: Status is pending or disabled.
        type: string
    type: object
  v0_auth.credentialsBody:
    properties:
      authKey:
        description: |-
          AuthKey is the standard base64 of the 32-byte key the client derived
          from the password and the salt GET /auth/salt returned.
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - username
    type: object
  v0_auth.deleteAccountBody:
    properties:
      password:
        type: string
    required:
    - password
    type: object
  v0_auth.loginResponse:
    properties:
      legacyRecovery:
        description: |-
          LegacyRecovery is true for an account that has no recovery key yet: the
          client generates a phrase and sends its key to PUT /auth/recovery-key.
        type: boolean
      recoveryPhrase:
        description: |-
          RecoveryPhrase is present only on the first sign-in of an account an
          admin created.
        type: string
      token:
        type: string
    type: object
  v0_auth.newAccountBody:
    properties:
      authKey:
        description: |-
          AuthKey is the standard base64 of the 32-byte key the client derived
          from the password and the salt GET /auth/salt returned.
        type: string
      password:
        type: string
      recoveryKey:
        description: |-
          RecoveryKey is the standard base64 of the 32-byte key the client derived
          from its recovery phrase and the same salt. With it the Quark makes no
          phrase (#2430).
        type: string
      username:
        type: string
    required:
    - username
    type: object
  v0_auth.recoverAccountBody:
    properties:
      chatKeys:
        allOf:
        - $ref: '#/definitions/chatutil.Keys'
        description: |-
          ChatKeys is the account's chat identity re-wrapped under NewPassword,
          stored in the same transaction as the reset (#2416). Absent leaves the
          stored keys as they are.
      newAuthKey:
        type: string
      newPassword:
        description: |-
          Exactly one of NewPassword and NewAuthKey is sent. NewAuthKey is the
          standard base64 of the 32-byte key derived from the new password and the
          salt GET /auth/salt returned (#2430).
        type: string
      newRecoveryKey:
        description: |-
          NewRecoveryKey, sent only with NewAuthKey, replaces the recovery
          credential in the same transaction and clears the old phrase.
        type: string
      recoveryKey:
        type: string
      recoveryPhrase:
        description: |-
          Exactly one of RecoveryPhrase and RecoveryKey is sent. RecoveryKey is
          the standard base64 of the 32-byte key derived from the phrase and the
          salt GET /auth/salt returned (#2430).
        type: string
      username:
        type: string
    required:
    - username
    type: object
  v0_auth.recoverChatKeysBody:
    properties:
      recoveryKey:
        type: string
      recoveryPhrase:
        type: string
      username:
        type: string
    required:
    - username
    type: object
  v0_auth.requestAccountResponse:
    properties:
      recoveryPhrase:
        type: string
    type: object
  v0_auth.saltResponse:
    properties:
      legacy:
        description: |-
          Legacy is true for an account that has no auth key yet: the client signs
          in with both password and authKey to give it one.
        type: boolean
      legacyRecovery:
        description: |-
          LegacyRecovery is true for an account that has no recovery key yet: it
          recovers with its raw phrase, and the client gives it a new phrase.
        type: boolean
      salt:
        description: Salt is the standard base64 of 16 bytes.
        type: string
    type: object
  v0_auth.setRecoveryKeyBody:
    properties:
      chatKeys:
        allOf:
        - $ref: '#/definitions/chatutil.Keys'
        description: |-
          ChatKeys is the account's chat identity re-wrapped under the new
          phrase, stored in the same transaction. Absent leaves the stored keys as
          they are.
      password:
        description: |-
          Password re-confirms the caller, so a session alone cannot replace the
          recovery credential. A client that signs in with an auth key sends that
          key here, as delete-account takes it.
        type: string
      recoveryKey:
        description: |-
          RecoveryKey is the standard base64 of the 32-byte key the client derived
          from the phrase it generated and the account's auth salt.
        type: string
    required:
    - recoveryKey
    type: object
