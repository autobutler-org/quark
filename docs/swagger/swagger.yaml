        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_favorites.favoriteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Check if a photo is favorited
      tags:
      - favorites
    post:
      consumes:
