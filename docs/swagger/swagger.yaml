    type: object
  v0_videos.VideoMetadataJSON:
    properties:
      albums:
        items:
          $ref: '#/definitions/v0_videos.albumRefJSON'
        type: array
      audioCodec:
        type: string
      bitrate:
        description: bits/s
        type: integer
      duration:
        description: seconds
        type: number
      fileName:
        type: string
      fileSize:
        type: integer
      framerate:
        type: number
      height:
        type: integer
      isFavorite:
        type: boolean
      mtime:
        type: integer
      rotation:
        description: degrees
        type: integer
      videoCodec:
        type: string
      width:
        type: integer
    type: object
  v0_videos.albumRefJSON:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  v0_videos.extractFrameRequest:
    properties:
      relPath:
        type: string
      serial:
        type: string
      timestampMs:
        type: integer
    type: object
  v0_videos.extractFrameResponse:
    properties:
      relPath:
        type: string
    type: object
  v0_videos.transcodeFormatJSON:
    properties:
      format:
        description: Format is the value to send as format, the file extension without
          the dot.
        example: mov
