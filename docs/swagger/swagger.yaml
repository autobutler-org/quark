      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_settings.RemoteAccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Enable remote access via Tailscale
      tags:
      - settings
  /settings/remote-access/devices:
    post:
      description: Mints a single-use pre-auth key that adds the caller's device,
        such as a phone, to this Quark's Headscale household, and returns what the
        device needs to join the tailnet and reach the Quark. Any signed-in user may
        call it, a few times an hour. 409 when the Quark is on the user's own tailnet,
        when remote access is off, or when the Quark has no household to add to; 503
        while remote access is still connecting.
      produces:
      - application/json
      responses:
        "200":
          description: OK
