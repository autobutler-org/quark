definitions:
  authutil.SessionInfo:
    properties:
      createdAt:
        type: string
      expiresAt:
        type: string
      id:
        type: string
    type: object
  serverutil.ContentType:
    enum:
    - text/html
    - application/json
    type: string
    x-enum-varnames:
    - ContentTypeHTML
    - ContentTypeJSON
  serverutil.Response:
    properties:
      contentType:
        $ref: '#/definitions/serverutil.ContentType'
      data: {}
      error: {}
      statusCode:
        type: integer
    type: object
  storageutil.BackupToDeviceParams:
    properties:
      sourceDeviceSerial:
        type: string
      targetDeviceSerial:
        type: string
    type: object
  updateutil.UpdateSource:
    properties:
      account:
        type: string
      kind:
        $ref: '#/definitions/updateutil.UpdateSourceKind'
      path:
        type: string
    type: object
  updateutil.UpdateSourceKind:
    enum:
    - azure
    - github
    type: string
    x-enum-varnames:
    - UpdateSourceKindAzure
    - UpdateSourceKindGithub
  updateutil.UpdateVersion:
    properties:
      url:
        type: string
      version:
        type: string
    type: object
  v0_admin.userSummary:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      isAdmin:
        type: boolean
      username:
        type: string
    type: object
  v0_albums.AlbumItemJSON:
    properties:
      addedAt:
        type: string
      albumId:
        type: integer
      deviceSerial:
        type: string
      id:
        type: integer
      relPath:
        type: string
    type: object
  v0_albums.AlbumJSON:
    properties:
      children:
        items:
          $ref: '#/definitions/v0_albums.AlbumJSON'
        type: array
      createdAt:
        type: string
      id:
        type: integer
      itemCount:
        type: integer
      name:
        type: string
      parentId:
        type: integer
      smartType:
        type: string
      updatedAt:
        type: string
    type: object
  v0_albums.addPhotoRequest:
    properties:
      deviceSerial:
        type: string
      relPath:
        type: string
    type: object
  v0_albums.createAlbumRequest:
    properties:
      name:
        type: string
      parentId:
        type: integer
    required:
    - name
    type: object
  v0_albums.moveAlbumRequest:
    properties:
      parentId:
        type: integer
    type: object
  v0_albums.renameAlbumRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  v0_books.BookJSON:
    properties:
      fileName:
        type: string
      mtime:
        type: integer
      relPath:
        type: string
      size:
        type: integer
      type:
        type: string
    type: object
  v0_favorites.favoriteItemJSON:
    properties:
      createdAt:
        type: string
      deviceSerial:
        type: string
      relPath:
        type: string
    type: object
  v0_favorites.favoriteRequest:
    properties:
      deviceSerial:
        type: string
      relPath:
        type: string
    type: object
  v0_favorites.favoriteResponse:
    properties:
      isFavorite:
        type: boolean
    type: object
  v0_files.ContentSearchResult:
    properties:
      relPath:
        description: RelPath is the path to the file relative to the device's CirrusDir.
        type: string
      serial:
        description: Serial is the storage device serial number.
        type: string
      snippet:
        description: |-
          Snippet is a highlighted excerpt around the matched terms.
          Matched terms are enclosed in <b> tags.
        type: string
    type: object
  v0_files.FileNodeJSON:
    properties:
      compressedSize:
        type: integer
      deviceName:
        type: string
      devicePath:
        type: string
      deviceSerial:
        type: string
      dirPath:
        description: Directory path containing the file, for easier client-side handling
        type: string
      fileType:
        type: string
      fullPath:
        type: string
      isDir:
        type: boolean
      name:
        type: string
      size:
        type: integer
    type: object
  v0_files.FileNodeWithTimeJSON:
    properties:
      compressedSize:
        type: integer
      deviceName:
        type: string
      devicePath:
        type: string
      deviceSerial:
        type: string
      dirPath:
        description: Directory path containing the file, for easier client-side handling
        type: string
      fileType:
        type: string
      fullPath:
        type: string
      isDir:
        type: boolean
      modifiedAt:
        type: string
      name:
        type: string
      size:
        type: integer
    type: object
  v0_files.StatFileJSON:
    properties:
      fileType:
        type: string
      isDir:
        type: boolean
      name:
        type: string
    type: object
  v0_files.moveFileRequest:
    properties:
      newDeviceSerial:
        type: string
      newFilePath:
        type: string
      oldDeviceSerial:
        type: string
      oldFilePath:
        type: string
    type: object
  v0_health.HealthJSON:
    properties:
      alerts:
        items:
          type: string
        type: array
      cpuCoreCount:
        type: integer
      cpuCorePercents:
        items:
          type: number
        type: array
      cpuPercent:
        type: number
      diskPercent:
        type: number
      diskTotalBytes:
        type: integer
      diskUsedBytes:
        type: integer
      healthy:
        type: boolean
      hostname:
        description: |-
          Hostname is the OS hostname of the butler device.
          Clients can use this to display accurate LAN mount paths (e.g. smb://hostname.local).
        type: string
      memPercent:
        type: number
      memTotalBytes:
        type: integer
      memUsedBytes:
        type: integer
      temperatureCelsius:
        type: number
    type: object
  v0_migration.StartImportRequest:
    properties:
      deviceSerial:
        description: 'Optional: empty string for internal drive'
        type: string
      email:
        description: User's Google email
        type: string
      services:
        properties:
          calendar:
            description: 'UNUSED: calendar migration is not yet implemented (see #856)'
            type: boolean
          contacts:
            type: boolean
          drive:
            type: boolean
          photos:
            type: boolean
        type: object
    type: object
  v0_photos.AlbumRefJSON:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  v0_photos.DuplicateGroupJSON:
    properties:
      kind:
        description: |-
          Kind is "exact" (identical content hash) or "near" (perceptual hash
          Hamming distance within the configured threshold).
        type: string
      photos:
        description: Photos is the list of photos in this duplicate group.
        items:
          $ref: '#/definitions/v0_photos.DuplicatePhotoJSON'
        type: array
    type: object
  v0_photos.DuplicatePhotoJSON:
    properties:
      deviceSerial:
        type: string
      relPath:
        type: string
    type: object
  v0_photos.ExifJSON:
    properties:
      aperture:
        type: number
      dateTaken:
        type: string
      focalLength:
        type: number
      iso:
        type: integer
      latitude:
        type: number
      lens:
        type: string
      longitude:
        type: number
      make:
        type: string
      model:
        type: string
      shutterSpeed:
        type: string
    type: object
  v0_photos.PaginatedPhotosResponse:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      photos:
        items:
          $ref: '#/definitions/v0_photos.PhotoJSON'
        type: array
      total:
        type: integer
    type: object
  v0_photos.PhotoJSON:
    properties:
      fileName:
        type: string
      hasLiveVideo:
        type: boolean
      mtime:
        type: integer
      relPath:
        type: string
      serial:
        type: string
      size:
        type: integer
    type: object
  v0_photos.PhotoMetadataJSON:
    properties:
      albums:
        items:
          $ref: '#/definitions/v0_photos.AlbumRefJSON'
        type: array
      exif:
        $ref: '#/definitions/v0_photos.ExifJSON'
      fileName:
        type: string
      fileSize:
        type: integer
      height:
        type: integer
      isFavorite:
        type: boolean
      livePhotoVideoPath:
        type: string
      mtime:
        type: integer
      rotationQuarters:
        type: integer
      width:
        type: integer
    type: object
  v0_photos.copyPhotoRequest:
    properties:
      relPath:
        type: string
      serial:
        type: string
    required:
    - relPath
    type: object
  v0_photos.copyPhotoResponse:
    properties:
      relPath:
        type: string
    type: object
  v0_photos.rotatePhotoRequest:
    properties:
      relPath:
        type: string
      rotationQuarters:
        description: 0–3; 0 deletes the record
        type: integer
      serial:
        type: string
    required:
    - relPath
    type: object
  v0_settings.SettingsJSON:
    properties:
      autoUpdate:
        type: boolean
    type: object
  v0_version.SbomDependencyJSON:
    properties:
      path:
        type: string
      replace:
        $ref: '#/definitions/v0_version.SbomDependencyJSON'
      sum:
        type: string
      version:
        type: string
    type: object
  v0_version.SbomJSON:
    properties:
      dependencies:
        items:
          $ref: '#/definitions/v0_version.SbomDependencyJSON'
        type: array
      goVersion:
        type: string
      main:
        $ref: '#/definitions/v0_version.SbomModuleJSON'
    type: object
  v0_version.SbomModuleJSON:
    properties:
      path:
        type: string
      sum:
        type: string
      version:
        type: string
    type: object
  v0_version.UpdateParams:
    properties:
      force:
        type: boolean
      source:
        $ref: '#/definitions/updateutil.UpdateSource'
      version:
        type: string
    type: object
  v0_version.UpdateRequest:
    properties:
      version:
        type: string
    type: object
  v0_version.VersionJSON:
    properties:
      buildDate:
        type: string
      gitCommit:
        type: string
      goVersion:
        type: string
      semver:
        type: string
    type: object
  v0_videos.VideoMetadataJSON:
    properties:
      albums:
        items:
          $ref: '#/definitions/v0_videos.albumRefJSON'
        type: array
      audioCodec:
        type: string
      bitrate:
        description: bits/s
        type: integer
      duration:
        description: seconds
        type: number
      fileName:
        type: string
      fileSize:
        type: integer
      framerate:
        type: number
      height:
        type: integer
      isFavorite:
        type: boolean
      mtime:
        type: integer
      rotation:
        description: degrees
        type: integer
      videoCodec:
        type: string
      width:
        type: integer
    type: object
  v0_videos.albumRefJSON:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  v0_videos.extractFrameRequest:
    properties:
      relPath:
        type: string
      serial:
        type: string
      timestampMs:
        type: integer
    type: object
  v0_videos.extractFrameResponse:
    properties:
      relPath:
        type: string
    type: object
  v0_videos.trimVideoRequest:
    properties:
      endMs:
        type: integer
      relPath:
        type: string
      serial:
        type: string
      startMs:
        type: integer
    type: object
  v0_videos.trimVideoResponse:
    properties:
      relPath:
        type: string
    type: object
  v1_plugins.PluginInfoJSON:
    properties:
      addr:
        description: host:port (internal, may be omitted in prod)
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      version:
        type: string
    type: object
  v1_vfs.FileInfoJSON:
    properties:
      content_hash:
        type: string
      is_dir:
        type: boolean
      mime_type:
        type: string
      mod_time:
        type: string
      name:
        type: string
      namespace:
        type: string
      path:
        type: string
      size:
        type: integer
    type: object
  v1_vfs.NamespaceJSON:
    properties:
      description:
        type: string
      id:
        type: string
    type: object
info:
  contact: {}
paths:
  /admin/demote/{username}:
    put:
      description: Removes admin role from the given username. Fails if they are the
        last admin. Admin-only.
      parameters:
      - description: Username to demote
        in: path
        name: username
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Demote admin to regular user
      tags:
      - admin
  /admin/promote/{username}:
    put:
      description: Grants admin role to the given username. Admin-only.
      parameters:
      - description: Username to promote
        in: path
        name: username
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Promote user to admin
      tags:
      - admin
  /admin/users:
    get:
      description: Returns all registered users. Admin-only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_admin.userSummary'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: List all users
      tags:
      - admin
  /albums:
    get:
      description: Returns all photo albums as a flat list. Use ?tree=true to get
        a nested tree.
      parameters:
      - description: Return as nested tree (default false)
        in: query
        name: tree
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_albums.AlbumJSON'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: List all photo albums
      tags:
      - albums
    post:
      consumes:
      - application/json
      description: Creates a new photo album, optionally nested under a parent.
      parameters:
      - description: Album name and optional parent ID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_albums.createAlbumRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v0_albums.AlbumJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Create a photo album
      tags:
      - albums
  /albums/{id}:
    delete:
      description: Deletes an album and all its children (cascades). Does not delete
        photos from disk.
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Delete a photo album
      tags:
      - albums
    get:
      description: Returns a single album with its item count and direct children.
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_albums.AlbumJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Get a photo album by ID
      tags:
      - albums
  /albums/{id}/children:
    post:
      consumes:
      - application/json
      description: Shorthand for creating an album with a specific parent ID.
      parameters:
      - description: Parent album ID
        in: path
        name: id
        required: true
        type: integer
      - description: Album name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_albums.createAlbumRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v0_albums.AlbumJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Create a child album under a parent
      tags:
      - albums
  /albums/{id}/items:
    delete:
      consumes:
      - application/json
      description: Removes the album membership pointer. Does not delete the photo
        from disk.
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: integer
      - description: Photo reference
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_albums.addPhotoRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Remove a photo from an album
      tags:
      - albums
    get:
      description: Returns all photo items (pointers) in the given album.
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_albums.AlbumItemJSON'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: List photos in an album
      tags:
      - albums
    post:
      consumes:
      - application/json
      description: Adds a photo (by device serial + relative path) to an album. Idempotent.
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: integer
      - description: Photo reference
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_albums.addPhotoRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v0_albums.AlbumItemJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Add a photo to an album
      tags:
      - albums
  /albums/{id}/move:
    patch:
      consumes:
      - application/json
      description: Changes the parent of an album. Pass null parentId to move to root.
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: integer
      - description: New parent ID (null for root)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_albums.moveAlbumRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_albums.AlbumJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Move a photo album to a new parent
      tags:
      - albums
  /albums/{id}/rename:
    patch:
      consumes:
      - application/json
      description: Updates the name of an existing album.
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: integer
      - description: New album name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_albums.renameAlbumRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_albums.AlbumJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Rename a photo album
      tags:
      - albums
  /auth/google/authorize:
    get:
      description: Returns an authorization URL and state token for starting OAuth
        flow
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Get Google authorization URL
      tags:
      - auth
  /auth/google/callback:
    get:
      description: Callback endpoint used by Google OAuth. Exchanges code for token
        and returns HTML.
      parameters:
      - description: OAuth state token
        in: query
        name: state
        required: true
        type: string
      - description: Authorization code
        in: query
        name: code
        required: true
        type: string
      responses:
        "200":
          description: HTML page
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Google OAuth callback
      tags:
      - auth
  /auth/google/disconnect:
    post:
      consumes:
      - application/json
      description: Removes stored Google OAuth token for a user (or all tokens if
        no email provided)
      parameters:
      - description: '{email: string}'
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Disconnect Google account
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates with username and password, returns a session token
      parameters:
      - description: '{username, password}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Login
      tags:
      - auth
  /auth/logout:
    post:
      description: Invalidates the current session
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Logout
      tags:
      - auth
  /auth/recover:
    post:
      consumes:
      - application/json
      description: Resets password using recovery phrase
      parameters:
      - description: '{recoveryPhrase, newPassword}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Recover account
      tags:
      - auth
  /auth/sessions:
    delete:
      description: Deletes all active sessions for the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              revoked:
                type: boolean
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Revoke all sessions (log out everywhere)
      tags:
      - auth
    get:
      description: Returns all non-expired sessions for the authenticated user. Each
        session is identified by the SHA-256 hash of its token — pass this ID to DELETE
        /auth/sessions/{id} to revoke a specific session.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              sessions:
                items:
                  $ref: '#/definitions/authutil.SessionInfo'
                type: array
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: List active sessions
      tags:
      - auth
  /auth/sessions/{id}:
    delete:
      description: Deletes a specific session. The session ID is the SHA-256 hex hash
        of the session token, as returned by GET /auth/sessions.
      parameters:
      - description: Session ID (hex SHA-256 of token)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              revoked:
                type: boolean
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Revoke a session by ID
      tags:
      - auth
  /auth/setup:
    post:
      consumes:
      - application/json
      description: Creates the owner account. Can only be called once.
      parameters:
      - description: '{username, password}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: First-boot user setup
      tags:
      - auth
  /auth/status:
    get:
      description: Returns whether initial setup has been completed
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Check auth setup status
      tags:
      - auth
  /books:
    get:
      description: Finds all books in the cirrus directory
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_books.BookJSON'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: List books
      tags:
      - books
  /cirrus:
    delete:
      description: Soft-delete files via rename to trash, returning immediately. DB
        cleanup and events are dispatched in the background.
      parameters:
      - description: Root directory
        in: query
        name: rootDir
        type: string
      - collectionFormat: csv
        description: Array of file paths to delete
        in: query
        items:
          type: string
        name: filePaths
        required: true
        type: array
      - description: Device serial number to filter by
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Delete files
      tags:
      - cirrus
    get:
      description: merges files across all managed devices for the given filePath.
        If deviceSerial is empty, list files across all devices. Otherwise, only for
        the specified device
      parameters:
      - description: File dir to list
        in: query
        name: rootDir
        type: string
      - description: Device serial number to filter by
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_files.FileNodeJSON'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Lists files
      tags:
      - cirrus
    put:
      consumes:
      - application/json
      description: Enqueue a file move operation between paths/devices
      parameters:
      - description: Move file request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_files.moveFileRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Ok
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Move or rename a file
      tags:
      - cirrus
  /cirrus/by-type:
    get:
      description: Recursively walks all managed devices and returns files whose fileType
        matches the given value, sorted newest-first.
      parameters:
      - description: File type to filter by (e.g. abdoc, absheet)
        in: query
        name: fileType
        required: true
        type: string
      - collectionFormat: csv
        description: Filter by device serial(s)
        in: query
        items:
          type: string
        name: serial
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_files.FileNodeWithTimeJSON'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: List all files of a given type
      tags:
      - cirrus
  /cirrus/download:
    get:
      description: Downloads a single file or zips a folder and streams it back to
        the client
      parameters:
      - description: File path to download
        in: query
        name: filePath
        type: string
      - description: Device serial number to filter by
        in: query
        name: serial
        type: string
      - description: Output format conversion (e.g. 'jpeg' to convert HEIC to JPEG)
        in: query
        name: format
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Download a file or folder
      tags:
      - cirrus
  /cirrus/download-archive-file:
    get:
      description: Reads the specified entry from the archive and streams it to the
        client. No data is extracted to disk.
      parameters:
      - description: Path to the archive file (relative to device cirrus directory)
        in: query
        name: filePath
        required: true
        type: string
      - description: Path of the entry inside the archive
        in: query
        name: entryPath
        required: true
        type: string
      - description: Device serial number
        in: query
        name: serial
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: File content
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Entry not found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Download a single file from inside an archive
      tags:
      - cirrus
  /cirrus/extract:
    post:
      description: Extracts a zip file into a subdirectory named after the archive
        (without its extension) in the same directory
      parameters:
      - description: Path to the zip file to extract
        in: query
        name: filePath
        required: true
        type: string
      - description: Device serial number
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Extract a zip archive in place
      tags:
      - cirrus
  /cirrus/folder/{folderDir}:
    post:
      consumes:
      - multipart/form-data
      description: Enqueue create-folder operation under the given folder directory
      parameters:
      - description: Folder directory
        in: path
        name: folderDir
        required: true
        type: string
      - description: Name of the new folder
        in: formData
        name: folderName
        required: true
        type: string
      - description: Device serial number to create folder on
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Ok
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Create a new folder
      tags:
      - cirrus
  /cirrus/list-archive:
    get:
      description: Opens the archive at filePath and returns the direct children of
        subPath as FileNodeJSON entries. No data is extracted to disk — only archive
        headers are read.
      parameters:
      - description: Path to the archive file (relative to device cirrus directory)
        in: query
        name: filePath
        required: true
        type: string
      - description: Virtual subdirectory inside the archive to list (empty = root)
        in: query
        name: subPath
        type: string
      - description: Device serial number
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_files.FileNodeJSON'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: List contents of an archive file at a given virtual path
      tags:
      - cirrus
  /cirrus/recent:
    get:
      description: Returns files sorted by modification time (newest first) across
        all managed devices.
      parameters:
      - description: Maximum number of files to return (default 20, max 200)
        in: query
        name: limit
        type: integer
      - collectionFormat: csv
        description: Filter by device serial(s)
        in: query
        items:
          type: string
        name: serial
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_files.FileNodeWithTimeJSON'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: List recently uploaded files
      tags:
      - cirrus
  /cirrus/search:
    get:
      description: searches for a file across all managed devices for the given search
        term. If deviceSerial is empty, search across all devices. Otherwise, only
        for the specified device
      parameters:
      - description: Search term to find
        in: query
        name: query
        type: string
      - description: Device serial number to filter by
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_files.FileNodeJSON'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Searches for files
      tags:
      - cirrus
  /cirrus/search/content:
    get:
      description: |-
        Full-text search over indexed file contents using SQLite FTS5.
        Only text-based file formats are indexed (.txt, .md, .csv, .yaml, .json, etc.).
        Binary formats (images, video, PDF) are not indexed.
        Returns up to `limit` results ordered by relevance rank.
      parameters:
      - description: 'Search query (FTS5 syntax: words, AND/OR/NOT, \'
        in: query
        name: q
        required: true
        type: string
      - description: Maximum results to return (default 50, max 200)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_files.ContentSearchResult'
            type: array
        "400":
          description: Bad Request — missing query
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Search file contents (FTS5)
      tags:
      - cirrus
  /cirrus/stat:
    get:
      description: 'Returns filesystem metadata for the given cirrus-relative path:
        whether it is a directory and its file type. Useful for deep-link resolution
        when the path extension alone is ambiguous (e.g. a folder named "things.abdoc").'
      parameters:
      - description: Cirrus-relative path to stat
        in: query
        name: filePath
        required: true
        type: string
      - description: Device serial number
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.StatFileJSON'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Stat a file or directory
      tags:
      - cirrus
