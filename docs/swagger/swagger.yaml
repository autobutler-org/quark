        "400":
          description: Not an image
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "413":
          description: Larger than 10 MiB
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Set your profile picture
      tags:
      - users
  /vault:
    delete:
      consumes:
      - application/json
      description: Re-confirms the caller with password, which carries the auth key
        of the login password, exactly as PUT /vault/key takes it; a wrong or missing
        key is a 403, a raw password is a 426, and nothing is deleted, so a session
        alone cannot wipe a vault (#3615). The body is at most 1 KiB. Then deletes
        every item of the caller's vault and its vault key in one transaction, so
        an account locked out of its vault, having lost both its password and its
        recovery phrase, can start over with PUT /vault/key. An account with no vault
        gets 204 too. Publishes vault_changed to the caller's sessions. Shares the
        sign-in rate limit.
      parameters:
      - description: The caller's auth key
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_vault.deleteVaultBody'
      responses:
        "204":
          description: No Content
        "400":
          description: a body that is not JSON
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: password is not the caller's auth key
          schema:
            $ref: '#/definitions/serverutil.Response'
        "413":
          description: a body over 1 KiB
          schema:
            $ref: '#/definitions/serverutil.Response'
        "426":
          description: 'password is a raw password: the app is too old'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Delete the caller's vault
      tags:
      - vault
  /vault/items:
    get:
      description: 'Returns every item of the caller''s vault, entries and folders
        alike, oldest first, as stored: ciphertext and nonce in base64 and the client''s
        formatVersion. What an item is lives inside its ciphertext. An account with
        no vault gets an empty list.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/vaultutil.Item'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List the caller's vault items
      tags:
      - vault
    post:
      consumes:
      - application/json
      description: 'Stores a new item, an entry or a folder, encrypted on the client
        under the caller''s vault key: a non-empty ciphertext, a nonce of at most
        64 bytes, both base64, and formatVersion, the client''s plaintext layout version,
        at least 1. The body is at most 1 MiB. The caller must have set its vault
        up with PUT /vault/key first, or gets 409. Publishes vault_changed with the
        new item''s id to the caller''s sessions.'
      parameters:
      - description: The encrypted item
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/vaultutil.ItemFields'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/vaultutil.Item'
        "400":
          description: an item of the wrong size or shape
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: the caller has no vault yet
          schema:
            $ref: '#/definitions/serverutil.Response'
        "413":
          description: a body over 1 MiB
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Add an item to the caller's vault
      tags:
      - vault
  /vault/items/{id}:
    delete:
      description: Deletes one item of the caller's vault. Another account's item
        id, or one that names nothing, is a 404, for an admin too, and deletes nothing.
        Publishes vault_changed with the item's id to the caller's sessions.
      parameters:
      - description: Item id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: the caller has no item with that id
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Delete one of the caller's vault items
      tags:
      - vault
    get:
      description: Returns one item of the caller's vault as stored. Another account's
        item id, or one that names nothing, is a 404, for an admin too.
      parameters:
      - description: Item id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/vaultutil.Item'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: the caller has no item with that id
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get one of the caller's vault items
      tags:
      - vault
    put:
      consumes:
      - application/json
      description: Replaces an item's ciphertext, nonce and formatVersion, with the
        body POST /vault/items takes, at most 1 MiB. Another account's item id, or
        one that names nothing, is a 404, for an admin too, and changes nothing. Publishes
        vault_changed with the item's id to the caller's sessions.
      parameters:
      - description: Item id
        in: path
        name: id
        required: true
        type: integer
      - description: The re-encrypted item
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/vaultutil.ItemFields'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/vaultutil.Item'
        "400":
          description: an item of the wrong size or shape
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: the caller has no item with that id
          schema:
            $ref: '#/definitions/serverutil.Response'
        "413":
          description: a body over 1 MiB
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Replace one of the caller's vault items
      tags:
      - vault
  /vault/key:
    get:
      description: Returns the caller's vault key, wrapped on the client under the
        login password and, when present, the recovery phrase. Byte fields are base64
        and kdfParams is the client's own object. The Quark never opens it. 404 means
        the caller has no vault yet and the client should set one up with PUT /vault/key.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/vaultutil.Key'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: the caller has no vault yet
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get the caller's wrapped vault key
      tags:
      - vault
    put:
      consumes:
      - application/json
      description: 'Re-confirms the caller with password, which carries the auth key
        of the login password, exactly as PUT /auth/recovery-key takes it; a wrong
        or missing key is a 403, a raw password is a 426, and nothing is written.
        The vault key''s password wrap is opened, and re-wrapped on every password
        change, with the login password, so a vault wrapped under any other password
        would be lost at the next change. Then stores the caller''s first vault key,
        a random key the client made and wrapped under the login password (wrappedByPassword,
        at most 512 bytes, with its 16-byte Argon2id salt saltPw) and optionally the
        recovery phrase (wrappedByPhrase and saltRp, both or neither), with the client''s
        kdfParams object. Byte fields are base64 and the body is at most 8 KiB. The
        key is never replaced here: an account that already has one gets 409, and
        its wraps change only beside the credential that wraps them, through vaultKey
        on PUT /auth/password, PUT /auth/recovery-key and POST /auth/recover. Publishes
        vault_changed to the caller''s sessions. Shares the sign-in rate limit.'
      parameters:
      - description: The caller's auth key and the wrapped vault key; createdAt and
          updatedAt are ignored
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_vault.createVaultKeyBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/vaultutil.Key'
        "400":
          description: a key of the wrong size or shape
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: password is not the caller's auth key
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: the caller already has a vault
          schema:
            $ref: '#/definitions/serverutil.Response'
        "413":
          description: a body over 8 KiB
          schema:
            $ref: '#/definitions/serverutil.Response'
        "426":
          description: 'password is a raw password: the app is too old'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Set up the caller's vault
      tags:
      - vault
  /version:
