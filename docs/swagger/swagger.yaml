          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Set the role of a storage device
      tags:
      - storage
  /storage/devices/snapshot-backup:
    post:
      consumes:
      - application/json
      description: Aggregates all files from all managed devices onto the target snapshot-backup
        device
      parameters:
      - description: '{targetDeviceSerial: string}'
        in: body
