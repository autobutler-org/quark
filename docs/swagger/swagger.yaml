  /thumbnails/{filePath}:
    get:
      description: 'Returns a thumbnail for the specified photo or video: resized
        from the thumbnail a client uploaded for it when there is a fresh one, generated
        from the file otherwise. When the device cannot render a video or HEIC itself,
        the 404 body carries "clientRender": true, telling a client that may write
        the file to render a thumbnail (JPEG, long edge 400) and PUT it to this path.'
      parameters:
      - description: Path to the image file
        in: path
        name: filePath
        required: true
        type: string
      - description: Device serial number (for device-specific files)
        in: query
        name: serial
        type: string
      - description: 'Thumbnail size tier: sm (96px), md (240px), lg (400px). Defaults
          to lg.'
        enum:
        - sm
        - md
        - lg
        in: query
        name: size
        type: string
      produces:
      - image/png
      - image/jpeg
      responses:
        "200":
          description: OK
          schema:
            type: file
        "304":
          description: Not Modified
        "404":
          description: Not Found. clientRender is true when a client should render
            the thumbnail and PUT it
          schema:
            $ref: '#/definitions/v0_thumbnails.clientRenderResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get thumbnail for an image
      tags:
      - thumbnails
    put:
      consumes:
      - multipart/form-data
      description: 'Stores the thumbnail a client rendered for a photo or video, replacing
        any stored before: a JPEG with a long edge of 400 and rotation applied, in
        a part named "thumbnail". The sm, md and lg sizes are resized from it, and
        a photo''s thumbnail feeds near-duplicate detection. It lives in the thumbnail
        cache, so a move, rename or cache clear drops it and a client renders it again
        on view. Needs write access on the file.'
      parameters:
      - description: Path to the photo or video
        in: path
        name: filePath
        required: true
        type: string
      - description: Device serial number (for device-specific files)
        in: query
        name: serial
        type: string
      - description: Thumbnail JPEG, long edge 400
        in: formData
        name: thumbnail
        required: true
        type: file
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Upload a client-rendered thumbnail for a file
      tags:
      - thumbnails
  /trash:
    get:
      description: Lists a device's trashed items, most recently trashed first, with
        how many days anything stays before the hourly purge deletes it. A non-admin
        sees what they trashed and what was trashed from a place they can read.
      parameters:
      - description: Device serial; empty for internal storage
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_trash.listTrashResponse'
        "404":
          description: Unknown device
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List the trash
      tags:
      - trash
  /trash/contents:
    get:
      description: Lists what a trashed folder, or a folder inside one, holds, sorted
        by name. Each entry's path is relative to the trashed item and can be passed
        back here, to restore, or to delete. Also returns where the folder would be
        restored to and when the trashed item expires. A trashed item the caller cannot
        see is not found.
      parameters:
      - description: Device serial; empty for internal storage
        in: query
        name: serial
        type: string
      - description: The trashed item
        in: query
        name: trashName
        required: true
        type: string
      - description: Path inside the trashed item; empty for the item itself
        in: query
        name: path
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_trash.listTrashContentsResponse'
        "400":
          description: Malformed trash name or path, or not a folder
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Unknown device, trash name or path
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List a folder in the trash
      tags:
      - trash
  /trash/delete:
    post:
      consumes:
      - application/json
      description: Deletes the named trashed items for good. An item with a path deletes
        only that file or folder from inside a trashed folder. Every item is checked
        first, so a batch naming an unknown item deletes nothing.
      parameters:
      - description: 'Device serial and the items to delete: a trash name, plus a
          path inside a trashed folder to delete only that'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_trash.trashItemsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_trash.deletedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: An item the caller can see but did not trash and cannot write
            where it came from
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Unknown device, trash name or path, or an item the caller cannot
            see
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Delete items from the trash permanently
      tags:
      - trash
  /trash/empty:
    post:
      consumes:
      - application/json
      description: 'Permanently deletes everything in a device''s trash. A non-admin
        empties only the items they could delete one at a time: the ones they trashed
        and the ones trashed from a folder they can write.'
      parameters:
      - description: Device serial; empty for internal storage
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_trash.emptyTrashRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_trash.deletedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Unknown device
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Empty the trash
      tags:
      - trash
  /trash/restore:
    post:
      consumes:
      - application/json
      description: Moves trashed items back to where they were deleted from. An item
        with a path restores only that file or folder from inside a trashed folder,
        to the folder's original path joined with it, recreating missing parent folders;
        the trashed folder keeps the rest. Every item is checked first, so a batch
        naming an unknown item, one whose destination is now occupied, or two whose
        destinations overlap restores nothing; nothing is ever overwritten.
      parameters:
      - description: 'Device serial and the items to restore: a trash name, plus a
          path inside a trashed folder to restore only that'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_trash.trashItemsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_trash.restoreTrashResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: No write access on the folder an item goes back into
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Unknown device, trash name or path, or an item the caller cannot
            see
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Destination occupied or overlapping another in the batch, or
            original location unknown
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Restore items from the trash
      tags:
      - trash
  /users/{id}/avatar:
    get:
      description: Serves a user's 256x256 profile picture to any signed-in user,
        with an ETag derived from its version; a matching If-None-Match gets 304.
        Clients add the picture's avatarUpdatedAt as the v query parameter, so a changed
        picture is a new URL. A user with no picture is a 404.
      parameters:
      - description: User id
        in: path
        name: id
        required: true
        type: integer
      - description: Cache-buster, the picture's avatarUpdatedAt; ignored by the Quark
        in: query
        name: v
        type: integer
      produces:
      - image/jpeg
      - image/png
      responses:
        "200":
          description: OK
          schema:
            type: file
        "304":
          description: Not Modified
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get a user's profile picture
      tags:
      - users
  /users/me/avatar:
    delete:
      description: Removes the caller's profile picture; clients fall back to initials.
        Removing a picture that is not there succeeds. Publishes account_changed when
        one was removed.
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Remove your profile picture
      tags:
      - users
    put:
      consumes:
      - multipart/form-data
      description: Replaces the caller's profile picture with the image in the multipart
        field "file" (JPEG, PNG, WebP, HEIC, GIF, BMP or TIFF, at most 10 MiB). The
        Quark center-crops and resizes it to 256x256 and keeps only the re-encoded
        file, so EXIF and location data are dropped. Publishes account_changed.
      parameters:
      - description: The image
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_users.SetAvatarResponse'
        "400":
          description: Not an image
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "413":
          description: Larger than 10 MiB
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Set your profile picture
      tags:
      - users
