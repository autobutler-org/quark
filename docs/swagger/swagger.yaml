  /files/search/content:
    get:
      description: |-
        Full-text search over indexed file contents using SQLite FTS5.
        Only text-based file formats are indexed (.txt, .md, .csv, .yaml, .json, etc.).
        Binary formats (images, video, PDF) are not indexed.
        Returns up to `limit` results ordered by relevance rank.
      parameters:
      - description: 'Search query (FTS5 syntax: words, AND/OR/NOT, \'
        in: query
        name: q
        required: true
        type: string
      - description: Maximum results to return (default 50, max 200)
        in: query
        name: limit
        type: integer
      produces:
