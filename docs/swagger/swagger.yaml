      responses:
        "202":
          description: Ok
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Create a new folder
      tags:
      - files
  /files/list-archive:
    get:
      description: Opens the archive at filePath and returns the direct children of
        subPath as FileNodeJSON entries. No data is extracted to disk — only archive
        headers are read.
      parameters:
      - description: Path to the archive file (relative to device files directory)
        in: query
        name: filePath
        required: true
        type: string
      - description: Virtual subdirectory inside the archive to list (empty = root)
        in: query
        name: subPath
        type: string
      - description: Device serial number
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_files.FileNodeJSON'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List contents of an archive file at a given virtual path
      tags:
      - files
  /files/recent:
    get:
      description: Returns files sorted by modification time (newest first) across
        all managed devices.
      parameters:
      - description: Maximum number of files to return (default 20, max 200)
        in: query
        name: limit
        type: integer
      - collectionFormat: csv
        description: Filter by device serial(s)
        in: query
        items:
          type: string
        name: serial
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_files.FileNodeWithTimeJSON'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
