  /settings/remote-access:
    delete:
      description: Logs the Tailscale tsnet node out, stops it, and deletes its state,
        so re-enabling provisions a fresh key. Admin only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_settings.RemoteAccessResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Disable remote access
      tags:
      - settings
    get:
      description: Returns whether remote access is switched on, whether the Tailscale
        node has actually joined the tailnet, its remote URL once it has, and the
        last start failure
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_settings.RemoteAccessResponse'
      summary: Get remote access status
      tags:
      - settings
    post:
      consumes:
      - application/json
      description: Starts a Tailscale tsnet node and proxies traffic to the local
        server. A Quark with no tailnet enrollment fetches a pre-auth key from the
        provisioning service; authKey overrides that key. The node joins the tailnet
        asynchronously; poll GET for connected. Admin only.
      parameters:
      - description: Optional pre-auth key override
        in: body
        name: body
        schema:
          $ref: '#/definitions/v0_settings.RemoteAccessRequest'
      produces:
      - application/json
      responses:
        "200":
