      - BearerAuth: []
      summary: List all photo albums
      tags:
      - albums
    post:
      consumes:
      - application/json
      description: Creates a photo album owned by the caller, optionally nested under
        one of the caller's albums. The name cannot contain / and must be unique among
        its siblings ignoring case; the caller's root albums, their Favorites album
        included, are siblings of each other.
      parameters:
      - description: Album name and optional parent ID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_albums.createAlbumRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v0_albums.AlbumJSON'
        "400":
          description: 'Bad Request: missing name, a / in the name, or parent not
            found among the caller''s albums'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: 'Forbidden: system album as the parent'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: 'Conflict: an album with that name already exists here'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Create a photo album
      tags:
      - albums
  /albums/{id}:
