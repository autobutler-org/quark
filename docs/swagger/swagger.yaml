      description: Changes the parent of one of the caller's albums. Pass null parentId
        to move to root. The new parent must be the caller's own and must not already
        hold an album with the same name ignoring case; the caller's root albums,
        their Favorites album included, are siblings of each other.
      parameters:
      - description: Album ID
