      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.StatFileJSON'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Stat a file or directory
      tags:
      - files
  /files/upload:
    post:
      consumes:
      - multipart/form-data
      description: Upload one or more files via multipart/form-data. Needs write access
        on the top-level directory; the caller owns each file the upload creates.
        A name already in use is a 409 unless overwrite or keepBoth says what to do
        about it. Answers with the files-relative path each file landed at, after
        any keepBoth rename.
      parameters:
      - description: Device serial number to upload to
        in: query
        name: serial
        type: string
      - description: Replace a file of the same name
        in: query
        name: overwrite
        type: boolean
      - description: Land under the first free name, e.g. file_(1).txt, when the name
          is taken
        in: query
        name: keepBoth
        type: boolean
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.uploadFilesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Upload files to the top-level directory
      tags:
      - files
  /files/upload-session:
    post:
      consumes:
      - application/json
      description: 'Reserve a session for one file; the bytes follow as chunks on
        PUT. Needs write access on the directory the file lands in. The session belongs
        to the caller: it is not found for anyone else. A name already in use is a
        409 unless overwrite or keepBoth says what to do about it.'
      parameters:
      - description: File the session will carry
        in: body
        name: session
        required: true
        schema:
          $ref: '#/definitions/v0_files.createUploadSessionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.createUploadSessionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Open a resumable upload session
      tags:
      - files
  /files/upload-session/{sessionId}:
    delete:
      description: Drops the session and the bytes staged for it
      parameters:
      - description: Upload session id
        in: path
        name: sessionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Abandon a resumable upload session
      tags:
      - files
    get:
      description: Returns the committed offset a resuming client continues from
      parameters:
      - description: Upload session id
        in: path
        name: sessionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.uploadSessionStatusResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Ask what a resumable upload has committed
      tags:
      - files
    put:
      consumes:
      - application/octet-stream
      description: Append the chunk named by Content-Range; the last one commits the
        file, and the caller owns it if it is new. A session opened by someone else
        is not found. A 409 carrying X-Upload-Offset is a chunk out of step; one without
        it is a name already in use.
      parameters:
      - description: Upload session id
        in: path
        name: sessionId
        required: true
        type: string
      - description: Byte range of this chunk, e.g. bytes 0-8388607/20971520
        in: header
        name: Content-Range
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.uploadChunkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Send one chunk of a resumable upload
      tags:
      - files
  /files/upload/{rootDir}:
    post:
      consumes:
      - multipart/form-data
      description: Upload one or more files via multipart/form-data. Needs write access
        on the directory; the caller owns each file the upload creates. A name already
        in use is a 409 unless overwrite or keepBoth says what to do about it. Answers
        with the files-relative path each file landed at, after any keepBoth rename.
      parameters:
      - description: Directory to upload into
        in: path
        name: rootDir
        required: true
        type: string
      - description: Device serial number to upload to
        in: query
