        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get metadata for a single photo
      tags:
      - photos
  /photos/rotate:
    post:
      consumes:
      - application/json
      description: Persists the viewer rotation (0/1/2/3 × 90° CW) for a photo server-side.
        Needs write access on the photo.
      parameters:
      - description: Rotation request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_photos.rotatePhotoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Save the rotation for a photo
      tags:
      - photos
  /sbom:
    get:
      description: Returns the Go version and all embedded dependency information
        from the compiled binary
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_version.SbomJSON'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get software bill of materials
      tags:
      - version
  /settings:
    get:
      description: Retrieves application settings
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_settings.SettingsJSON'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get settings
      tags:
      - settings
    post:
      consumes:
      - application/json
      description: Updates application settings
      parameters:
      - description: Settings
        in: body
        name: settings
        required: true
        schema:
          $ref: '#/definitions/v0_settings.SettingsJSON'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_settings.SettingsJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Update settings
      tags:
      - settings
  /settings/access-requests:
    put:
      consumes:
      - application/json
      description: Sets whether people can request an account from the sign-in page.
        Requests are on until an admin turns them off. Admin-only.
      parameters:
      - description: Whether account requests are on
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_settings.accessRequestsSetting'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_settings.accessRequestsSetting'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Turn account requests on or off
      tags:
      - settings
  /settings/features:
    get:
      description: Returns every registered beta feature flag with its admin-facing
        label and description, its default, the release or issue it was introduced
        in, the issue that will remove it, and whether it is on now. Open to any signed-in
        user, so the app can hide a feature that is off.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/featureflagutil.ListFlagsResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List the beta feature flags
      tags:
      - settings
  /settings/features/{key}:
    put:
      consumes:
      - application/json
      description: Sets whether the beta feature named by key is on for everyone on
        the Quark, and publishes feature_flag_changed. Turning a feature off hides
        it; nothing it stored is deleted. A key the registry does not declare, including
        a retired flag's, is 404. Admin-only.
      parameters:
      - description: Feature flag key
        in: path
        name: key
        required: true
        type: string
      - description: Whether the feature is on
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_settings.featureSetting'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/featureflagutil.FlagState'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: unknown feature flag
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Turn a beta feature flag on or off
      tags:
      - settings
  /settings/me:
    get:
      description: Returns the settings the caller chose for their own account. themeColor
        overrides the Quark's theme color; the empty string, which is also what an
        account that has chosen nothing gets, means follow the Quark.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/usersettingsutil.Settings'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get your own settings
      tags:
      - settings
    put:
      consumes:
      - application/json
      description: 'Replaces the settings of the caller''s own account with the body.
        themeColor is a preset name (a lowercase letter, then up to 31 lowercase letters,
        digits or hyphens) or a custom color as lowercase #rrggbb; the empty string,
        or leaving it out, means follow the Quark. A field the settings do not have
        is refused. Publishes no event: the change concerns only the caller.'
      parameters:
      - description: The settings
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/usersettingsutil.Settings'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/usersettingsutil.Settings'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Replace your own settings
      tags:
      - settings
  /settings/public:
    get:
      description: 'Returns the Quark''s settings that are safe to show before sign-in.
        Needs no session, so the sign-in page can read them. themeColor is the theme
        color an admin chose for the Quark, a preset name or a lowercase #rrggbb color,
        or the empty string when no admin has chosen.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_settings.PublicSettingsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Get the Quark's public settings
      tags:
      - settings
  /settings/remote-access:
    delete:
      description: Logs the Tailscale tsnet node out and stops it. Its state, with
        the machine key, is kept, so re-enabling rejoins as the same node with the
        same IP. Admin only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_settings.RemoteAccessResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Disable remote access
      tags:
      - settings
    get:
      description: Returns whether remote access is switched on, whether the Tailscale
        node has actually joined the tailnet, its remote URL once it has, and the
        last start failure
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_settings.RemoteAccessResponse'
      security:
      - BearerAuth: []
      summary: Get remote access status
      tags:
      - settings
    post:
      consumes:
      - application/json
      description: Starts a Tailscale tsnet node and proxies traffic to the local
        server. Every enable presents a fresh pre-auth key from the provisioning service,
        which authKey overrides. The node keeps its machine key across disable, so
        it rejoins the tailnet as the same node with the same IP. The node joins the
        tailnet asynchronously; poll GET for connected. Admin only.
      parameters:
      - description: Optional pre-auth key override
        in: body
        name: body
        schema:
          $ref: '#/definitions/v0_settings.RemoteAccessRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_settings.RemoteAccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Enable remote access via Tailscale
      tags:
      - settings
  /settings/remote-access/devices:
    post:
      description: Mints a single-use pre-auth key that adds the caller's device,
        such as a phone, to this Quark's Headscale household, and returns what the
        device needs to join the tailnet and reach the Quark. Any signed-in user may
        call it. 409 when the Quark is on the user's own tailnet, when remote access
        is off, or when the Quark has no household to add to; 503 while remote access
        is still connecting.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_settings.PairDeviceResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Custom tailnet, remote access off, or no household
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
        "503":
          description: Remote access is still connecting
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Pair a device for remote access
      tags:
      - settings
  /settings/theme-color:
    put:
      consumes:
      - application/json
      description: 'Sets the theme color for everyone on the Quark who has not chosen
        their own, and publishes public_settings_changed. themeColor is a preset name
        (a lowercase letter, then up to 31 lowercase letters, digits or hyphens) or
        a custom color as lowercase #rrggbb; the empty string clears it. Only the
        shape is checked: the Quark keeps no list of preset names. Admin-only.'
      parameters:
      - description: The theme color
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_settings.themeColorSetting'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_settings.PublicSettingsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Set the Quark's theme color
      tags:
      - settings
  /ssh/enabled:
    put:
      consumes:
      - application/json
      description: Starts sshd and opens port 22, or stops sshd and closes the port.
        The choice survives a reboot. Admin-only.
      parameters:
      - description: Whether SSH access should be on
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_ssh.setSSHEnabledBody'
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: SSH access can't be managed on this Quark
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Turn SSH access on or off
      tags:
      - ssh
  /ssh/keys:
    delete:
      description: Removes the allowed key with the given SHA256 fingerprint. The
        fingerprint is a query parameter because it can contain a slash. Admin-only.
      parameters:
      - description: SHA256 fingerprint, as SHA256:...
        in: query
        name: fingerprint
        required: true
        type: string
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no allowed key has that fingerprint
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: SSH access can't be managed on this Quark
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Stop a public key signing in over SSH
      tags:
      - ssh
    post:
      consumes:
      - application/json
      description: Adds one OpenSSH public key to those allowed to sign in as quark.
        Options such as command= are dropped. Admin-only.
      parameters:
      - description: The public key
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_ssh.addSSHKeyBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/sshutil.Key'
        "400":
          description: not an SSH public key
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: the key is already allowed, or SSH access can't be managed
            on this Quark
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Allow a public key to sign in over SSH
      tags:
      - ssh
  /ssh/password:
    delete:
      description: Removes the quark login account's password, so only allowed keys
        can sign in. Admin-only.
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: SSH access can't be managed on this Quark
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Clear the SSH login password
      tags:
      - ssh
    put:
      consumes:
      - application/json
      description: Sets the password for the quark login account. Quark does not store
        it. At least 12 characters, no control characters. Admin-only.
      parameters:
      - description: The new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_ssh.setSSHPasswordBody'
      responses:
        "200":
          description: OK
        "400":
          description: too short, too long, or holds control characters
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: SSH access can't be managed on this Quark
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Set the SSH login password
      tags:
      - ssh
  /ssh/status:
    get:
      description: Whether SSH access can be managed on this Quark (and why not),
        whether sshd is running, and the public keys allowed to sign in as quark.
        Admin-only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_ssh.sshStatusResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get SSH access status
      tags:
      - ssh
  /storage/devices/rename:
