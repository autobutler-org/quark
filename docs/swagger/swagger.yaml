  /events:
    get:
      description: Upgrades the connection to WebSocket and pushes JSON events for
        file system mutations (upload, delete, move, new_folder). Each connection
        hears only events about paths its user can read; admins hear every event.
        A connection closes once its account is turned off, deleted, promoted or demoted.
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Stream real-time file/device events
      tags:
      - events
  /files:
    delete:
      description: Move files to the device's trash (internal storage included), returning
        immediately. They can be restored through /trash/restore until the hourly
        purge deletes them after the retention period. DB cleanup and events are dispatched
        in the background.
      parameters:
      - description: Root directory
        in: query
        name: rootDir
        type: string
      - collectionFormat: csv
        description: Array of file paths to delete
        in: query
        items:
          type: string
        name: filePaths
        required: true
        type: array
      - description: Device serial number to filter by
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Delete files
      tags:
      - files
    get:
      description: merges files across all managed devices for the given filePath.
        If deviceSerial is empty, list files across all devices. Otherwise, only for
        the specified device
      parameters:
      - description: File dir to list
        in: query
        name: rootDir
        type: string
      - description: Device serial number to filter by
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_files.FileNodeJSON'
            type: array
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Lists files
      tags:
      - files
    put:
      consumes:
      - application/json
      description: Enqueue a file move operation between paths/devices. Needs write
        access on the file and on the folder it moves into.
      parameters:
      - description: Move file request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_files.moveFileRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Ok
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Move or rename a file
      tags:
      - files
  /files/by-type:
    get:
      description: Recursively walks all managed devices and returns files whose fileType
        matches the given value, sorted newest-first.
      parameters:
      - description: File type to filter by (e.g. qdoc, qsheet)
        in: query
