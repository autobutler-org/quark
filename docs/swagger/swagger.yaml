      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Disable (unmount) a USB storage device
      tags:
      - storage
    post:
      description: Mounts a USB storage device identified by serial and returns mount
        info
      parameters:
      - description: Device serial
        in: path
        name: serial
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Enable (mount) a USB storage device
      tags:
      - storage
  /storage/protection:
    get:
      description: Reports how protected the files are. unprotected means no snapshot-backup
        drive has a completed backup within 30 days, basic means one such drive after
        partitions of one disk are grouped, and protected means two or more. The live
        copy on the default-storage drive and the internal drive never count. A failed,
        unfinished, or stale backup does not count. A drive whose health verdict is
        replace-soon does not count, even inside 30 days. Watch and unknown still
        follow the 30-day rule. sentence is one plain sentence. nextStep is assign-backup-role,
        start-backup, or keep-one-elsewhere. drives lists each snapshot-backup drive,
        whether it counts, why not, and when it was last backed up. Refetch when a
        backup completes or fails (backup_completed, backup_failed).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_storage.ProtectionStatus'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get data protection status
      tags:
      - storage
  /thumbnails/{filePath}:
    get:
      description: 'Returns a thumbnail for the specified photo, video or music track.
        A track''s thumbnail is its cover art, embedded or from its folder as the
        music library recorded it, and a track with none is a 404. A photo or video''s
        is resized from the thumbnail a client uploaded for it when there is a fresh
        one, generated from the file otherwise. When the device cannot render a video
        or HEIC itself, the 404 body carries "clientRender": true, telling a client
        that may write the file to render a thumbnail (JPEG, long edge 400) and PUT
        it to this path. For a video, its "reason" says why the device could not:
        "unsupported" for a codec it has no decoder for, "unreadable" for a file that
        does not parse as a video.'
      parameters:
      - description: Path to the image file
        in: path
        name: filePath
        required: true
        type: string
      - description: Device serial number (for device-specific files)
        in: query
        name: serial
        type: string
      - description: 'Thumbnail size tier: sm (96px), md (240px), lg (400px). Defaults
          to lg.'
        enum:
        - sm
        - md
        - lg
        in: query
        name: size
        type: string
      produces:
      - image/png
      - image/jpeg
      responses:
        "200":
          description: OK
          schema:
            type: file
        "304":
          description: Not Modified
        "404":
          description: Not Found. clientRender is true when a client should render
            the thumbnail and PUT it
          schema:
            $ref: '#/definitions/v0_thumbnails.clientRenderResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get thumbnail for an image
      tags:
      - thumbnails
    put:
      consumes:
      - multipart/form-data
      description: 'Stores the thumbnail a client rendered for a photo or video, replacing
        any stored before: a JPEG with a long edge of 400 and rotation applied, in
        a part named "thumbnail". The sm, md and lg sizes are resized from it, and
        a photo''s thumbnail feeds near-duplicate detection. It lives in the thumbnail
        cache, so a move, rename or cache clear drops it and a client renders it again
        on view. Needs write access on the file.'
      parameters:
      - description: Path to the photo or video
        in: path
        name: filePath
        required: true
        type: string
      - description: Device serial number (for device-specific files)
        in: query
        name: serial
        type: string
      - description: Thumbnail JPEG, long edge 400
        in: formData
        name: thumbnail
        required: true
        type: file
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Upload a client-rendered thumbnail for a file
      tags:
      - thumbnails
  /trash:
    get:
      description: Lists a device's trashed items, most recently trashed first, with
        how many days anything stays before the hourly purge deletes it. A non-admin
