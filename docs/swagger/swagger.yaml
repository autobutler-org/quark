  /photos/copy:
    post:
      consumes:
      - application/json
      description: Creates a copy of the photo in the same directory with a non-conflicting
        name (e.g. photo_copy.jpg). Needs read access on the photo and write access
        on its folder; the caller owns the copy.
      parameters:
      - description: Copy request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_photos.copyPhotoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_photos.copyPhotoResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Duplicate a photo file
      tags:
      - photos
  /photos/duplicates:
    get:
      description: Returns groups of duplicate photos, each photo in at most one group.
        A group is exact when every photo shares a SHA-256 content hash, and near
        when their perceptual dHashes are within the threshold. Each group carries
        maxDistance, the largest Hamming distance between any two of its dHashes (0
        for exact). Exact groups come first, then near groups by ascending maxDistance;
        ties sort by first photo, and photos within a group by device, then path.
        Photos are hashed when a thumbnail is rendered or uploaded, and a pass at
        server start hashes the rest of the library; trashed photos and photos no
        longer on disk are left out.
      parameters:
      - description: Hamming distance threshold for near-duplicates (default 10, max
          20)
        in: query
        name: threshold
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              groups:
                items:
                  $ref: '#/definitions/photoutil.DuplicateGroup'
                type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List duplicate photos
      tags:
      - photos
  /photos/favorite:
    get:
      description: Returns whether the specified photo is in the caller's own favorites.
        Needs read access on the photo.
      parameters:
      - description: Device serial
        in: query
        name: serial
