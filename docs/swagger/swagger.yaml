definitions:
  authutil.SessionInfo:
    properties:
      createdAt:
        type: string
      expiresAt:
        type: string
      id:
        type: string
    type: object
  photoutil.AlbumRef:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  photoutil.DuplicateGroup:
    properties:
      kind:
        description: |-
          Kind is "exact" (identical content hash) or "near" (perceptual hash
          Hamming distance within the configured threshold).
        type: string
      photos:
        description: Photos is the list of photos in this duplicate group.
        items:
          $ref: '#/definitions/photoutil.DuplicatePhoto'
        type: array
    type: object
  photoutil.DuplicatePhoto:
    properties:
      deviceSerial:
        type: string
      relPath:
        type: string
    type: object
  photoutil.ExifSummary:
    properties:
      aperture:
        type: number
      dateTaken:
        type: string
      focalLength:
        type: number
      iso:
        type: integer
      latitude:
        type: number
      lens:
        type: string
      longitude:
        type: number
      make:
        type: string
      model:
        type: string
      shutterSpeed:
        type: string
    type: object
  photoutil.PhotoSummary:
    properties:
      fileName:
        type: string
      hasLiveVideo:
        type: boolean
      mtime:
        type: integer
      relPath:
        type: string
      serial:
        type: string
      size:
        type: integer
    type: object
  serverutil.ContentType:
    enum:
    - text/html
    - application/json
    type: string
    x-enum-varnames:
    - ContentTypeHTML
    - ContentTypeJSON
  serverutil.Response:
    properties:
      contentType:
        $ref: '#/definitions/serverutil.ContentType'
      data: {}
      error: {}
      statusCode:
        type: integer
    type: object
  storageutil.TrashContentsItem:
    properties:
      isDir:
        type: boolean
      modifiedAt:
        type: string
      name:
        type: string
      path:
        description: |-
          Path is relative to the trashed item, and is what a contents listing,
          a restore or a delete takes to address this entry.
        type: string
      size:
        type: integer
    type: object
  storageutil.TrashItem:
    properties:
      expiresAt:
        description: ExpiresAt is when the hourly purge deletes the item for good.
        type: string
      isDir:
        type: boolean
      name:
        description: Name is the item's base name as it was before it was trashed.
        type: string
      originalPath:
        description: |-
          OriginalPath is where a restore puts the item back, relative to the
          device's files directory. Empty when its metadata is missing.
        type: string
      size:
        type: integer
      trashName:
        description: TrashName addresses the item in restore and delete requests.
        type: string
      trashedAt:
        type: string
    type: object
  storageutil.TrashRef:
    properties:
      path:
        description: |-
          Path is relative to the trashed item, slash-separated; empty is the
          item itself.
        type: string
      trashName:
        type: string
    type: object
  updateutil.UpdateSource:
    properties:
      account:
        type: string
      kind:
        $ref: '#/definitions/updateutil.UpdateSourceKind'
      path:
        type: string
    type: object
  updateutil.UpdateSourceKind:
    enum:
    - azure
    - github
    type: string
    x-enum-varnames:
    - UpdateSourceKindAzure
    - UpdateSourceKindGithub
  updateutil.UpdateVersion:
    properties:
      url:
        type: string
      version:
        type: string
    type: object
  v0_admin.userSummary:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      isAdmin:
        type: boolean
      username:
        type: string
    type: object
  v0_albums.AlbumItemJSON:
    properties:
      addedAt:
        type: string
      albumId:
        type: integer
      deviceSerial:
        type: string
      id:
        type: integer
      relPath:
        type: string
    type: object
  v0_albums.AlbumJSON:
    properties:
      children:
        items:
          $ref: '#/definitions/v0_albums.AlbumJSON'
        type: array
      createdAt:
        type: string
      id:
        type: integer
      itemCount:
        type: integer
      name:
        type: string
      parentId:
        type: integer
      smartType:
        type: string
      updatedAt:
        type: string
    type: object
  v0_albums.addPhotoRequest:
    properties:
      deviceSerial:
        type: string
      relPath:
        type: string
    type: object
  v0_albums.createAlbumRequest:
    properties:
      name:
        type: string
      parentId:
        type: integer
    required:
    - name
    type: object
  v0_albums.moveAlbumRequest:
    properties:
      parentId:
        type: integer
    type: object
  v0_albums.renameAlbumRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  v0_books.BookJSON:
    properties:
      fileName:
        type: string
      mtime:
        type: integer
      relPath:
        type: string
      size:
        type: integer
      type:
        type: string
    type: object
  v0_favorites.favoriteItemJSON:
    properties:
      createdAt:
        type: string
      deviceSerial:
        type: string
      relPath:
        type: string
    type: object
  v0_favorites.favoriteRequest:
    properties:
      deviceSerial:
        type: string
      relPath:
        type: string
    type: object
  v0_favorites.favoriteResponse:
    properties:
      isFavorite:
        type: boolean
    type: object
  v0_files.ContentSearchResult:
    properties:
      relPath:
        description: RelPath is the path to the file relative to the device's FilesDir.
        type: string
      serial:
        description: Serial is the storage device serial number.
        type: string
      snippet:
        description: |-
          Snippet is a highlighted excerpt around the matched terms.
          Matched terms are enclosed in <b> tags.
        type: string
    type: object
  v0_files.ConvertXlsxJSON:
    properties:
      cells:
        type: integer
      path:
        type: string
      rows:
        type: integer
      tabs:
        type: integer
    type: object
  v0_files.FileNodeJSON:
    properties:
      compressedSize:
        type: integer
      deviceName:
        type: string
      devicePath:
        type: string
      deviceSerial:
        type: string
      dirPath:
        description: Directory path containing the file, for easier client-side handling
        type: string
      fileType:
        description: Kept for older clients; route viewers by file name instead
        type: string
      fullPath:
        type: string
      isDir:
        type: boolean
      name:
        type: string
      size:
        type: integer
    type: object
  v0_files.FileNodeWithTimeJSON:
    properties:
      compressedSize:
        type: integer
      deviceName:
        type: string
      devicePath:
        type: string
      deviceSerial:
        type: string
      dirPath:
        description: Directory path containing the file, for easier client-side handling
        type: string
      fileType:
        description: Kept for older clients; route viewers by file name instead
        type: string
      fullPath:
        type: string
      isDir:
        type: boolean
      modifiedAt:
        type: string
      name:
        type: string
      size:
        type: integer
    type: object
  v0_files.StatFileJSON:
    properties:
      fileType:
        description: Kept for older clients; route viewers by file name instead
        type: string
      isDir:
        type: boolean
      name:
        type: string
    type: object
  v0_files.createUploadSessionRequest:
    properties:
      fileName:
        type: string
      overwrite:
        type: boolean
      rootDir:
        type: string
      serial:
        type: string
      totalSize:
        type: integer
    type: object
  v0_files.createUploadSessionResponse:
    properties:
      expiresAt:
        type: string
      offset:
        type: integer
      sessionId:
        type: string
    type: object
  v0_files.moveFileRequest:
    properties:
      newDeviceSerial:
        type: string
      newFilePath:
        type: string
      oldDeviceSerial:
        type: string
      oldFilePath:
        type: string
    type: object
  v0_files.uploadChunkResponse:
    properties:
      complete:
        type: boolean
      offset:
        type: integer
      path:
        type: string
      sessionId:
        type: string
    type: object
  v0_files.uploadSessionStatusResponse:
    properties:
      expiresAt:
        type: string
      fileName:
        type: string
      offset:
        type: integer
      rootDir:
        type: string
      sessionId:
        type: string
      totalSize:
        type: integer
    type: object
  v0_health.HealthJSON:
    properties:
      alerts:
        items:
          type: string
        type: array
      cpuCoreCount:
        type: integer
      cpuCorePercents:
        items:
          type: number
        type: array
      cpuPercent:
        type: number
      diskPercent:
        type: number
      diskTotalBytes:
        type: integer
      diskUsedBytes:
        type: integer
      healthy:
        type: boolean
      hostname:
        description: |-
          Hostname is the OS hostname of the quark device.
          Clients can use this to display the device's LAN name (e.g. quark.local).
        type: string
      memPercent:
        type: number
      memTotalBytes:
        type: integer
      memUsedBytes:
        type: integer
      temperatureCelsius:
        type: number
    type: object
  v0_photos.PaginatedPhotosResponse:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      photos:
        items:
          $ref: '#/definitions/photoutil.PhotoSummary'
        type: array
      total:
        type: integer
    type: object
  v0_photos.PhotoMetadataJSON:
    properties:
      albums:
        items:
          $ref: '#/definitions/photoutil.AlbumRef'
        type: array
      exif:
        $ref: '#/definitions/photoutil.ExifSummary'
      fileName:
        type: string
      fileSize:
        type: integer
      height:
        type: integer
      isFavorite:
        type: boolean
      livePhotoVideoPath:
        type: string
      mtime:
        type: integer
      rotationQuarters:
        type: integer
      width:
        type: integer
    type: object
  v0_photos.copyPhotoRequest:
    properties:
      relPath:
        type: string
      serial:
        type: string
    required:
    - relPath
    type: object
  v0_photos.copyPhotoResponse:
    properties:
      relPath:
        type: string
    type: object
  v0_photos.rotatePhotoRequest:
    properties:
      relPath:
        type: string
      rotationQuarters:
        description: 0–3; 0 deletes the record
        type: integer
      serial:
        type: string
    required:
    - relPath
    type: object
  v0_settings.RemoteAccessRequest:
    properties:
      authKey:
        description: |-
          AuthKey overrides the provisioned pre-auth key. It is used only when the
          Quark has no tailnet enrollment to reuse.
        type: string
    type: object
  v0_settings.RemoteAccessResponse:
    properties:
      connected:
        description: Connected is true only once the node has joined the tailnet.
        type: boolean
      enabled:
        description: 'Enabled is the persisted setting: the user asked for remote
          access.'
        type: boolean
      error:
        description: |-
          Error is the last start failure, a diagnostic for the log reader rather
          than copy for a user.
        type: string
      remoteUrl:
        description: RemoteURL is set only when Connected.
        type: string
    type: object
  v0_settings.SettingsJSON:
    properties:
      autoUpdate:
        type: boolean
    type: object
  v0_trash.deletedResponse:
    properties:
      deleted:
        type: integer
    type: object
  v0_trash.emptyTrashRequest:
    properties:
      serial:
        type: string
    type: object
  v0_trash.listTrashContentsResponse:
    properties:
      expiresAt:
        type: string
      items:
        items:
          $ref: '#/definitions/storageutil.TrashContentsItem'
        type: array
      originalPath:
        type: string
    type: object
  v0_trash.listTrashResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/storageutil.TrashItem'
        type: array
      retentionDays:
        type: integer
    type: object
  v0_trash.restoreTrashResponse:
    properties:
      restoredPaths:
        items:
          type: string
        type: array
    type: object
  v0_trash.trashItemsRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/storageutil.TrashRef'
        type: array
      serial:
        type: string
    type: object
  v0_version.SbomDependencyJSON:
    properties:
      path:
        type: string
      replace:
        $ref: '#/definitions/v0_version.SbomDependencyJSON'
      sum:
        type: string
      version:
        type: string
    type: object
  v0_version.SbomJSON:
    properties:
      dependencies:
        items:
          $ref: '#/definitions/v0_version.SbomDependencyJSON'
        type: array
      goVersion:
        type: string
      main:
        $ref: '#/definitions/v0_version.SbomModuleJSON'
    type: object
  v0_version.SbomModuleJSON:
    properties:
      path:
        type: string
      sum:
        type: string
      version:
        type: string
    type: object
  v0_version.UpdateParams:
    properties:
      force:
        type: boolean
      source:
        $ref: '#/definitions/updateutil.UpdateSource'
      version:
        type: string
    type: object
  v0_version.UpdateRequest:
    properties:
      version:
        type: string
    type: object
  v0_version.VersionJSON:
    properties:
      buildDate:
        type: string
      gitCommit:
        type: string
      goVersion:
        type: string
      semver:
        type: string
    type: object
  v0_videos.VideoMetadataJSON:
    properties:
      albums:
        items:
          $ref: '#/definitions/v0_videos.albumRefJSON'
        type: array
      audioCodec:
        type: string
      bitrate:
        description: bits/s
        type: integer
      duration:
        description: seconds
        type: number
      fileName:
        type: string
      fileSize:
        type: integer
      framerate:
        type: number
      height:
        type: integer
      isFavorite:
        type: boolean
      mtime:
        type: integer
      rotation:
        description: degrees
        type: integer
      videoCodec:
        type: string
      width:
        type: integer
    type: object
  v0_videos.albumRefJSON:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  v0_videos.extractFrameRequest:
    properties:
      relPath:
        type: string
      serial:
        type: string
      timestampMs:
        type: integer
    type: object
  v0_videos.extractFrameResponse:
    properties:
      relPath:
        type: string
    type: object
  v0_videos.trimVideoRequest:
    properties:
      endMs:
        type: integer
      relPath:
        type: string
      serial:
        type: string
      startMs:
        type: integer
    type: object
  v0_videos.trimVideoResponse:
    properties:
      relPath:
        type: string
    type: object
info:
  contact: {}
paths:
  /admin/demote/{username}:
    put:
      description: Removes admin role from the given username. Fails if they are the
        last admin. Admin-only.
      parameters:
      - description: Username to demote
        in: path
        name: username
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Demote admin to regular user
      tags:
      - admin
  /admin/promote/{username}:
    put:
      description: Grants admin role to the given username. Admin-only.
      parameters:
      - description: Username to promote
        in: path
        name: username
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Promote user to admin
      tags:
      - admin
  /admin/users:
    get:
      description: Returns all registered users. Admin-only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_admin.userSummary'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: List all users
      tags:
      - admin
  /albums:
    get:
      description: Returns all photo albums as a flat list. Use ?tree=true to get
        a nested tree.
      parameters:
      - description: Return as nested tree (default false)
        in: query
        name: tree
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_albums.AlbumJSON'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: List all photo albums
      tags:
      - albums
    post:
      consumes:
      - application/json
      description: Creates a new photo album, optionally nested under a parent.
      parameters:
      - description: Album name and optional parent ID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_albums.createAlbumRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v0_albums.AlbumJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Create a photo album
      tags:
      - albums
  /albums/{id}:
    delete:
      description: Deletes an album and all its children (cascades). Does not delete
        photos from disk.
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Delete a photo album
      tags:
      - albums
    get:
      description: Returns a single album with its item count and direct children.
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_albums.AlbumJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Get a photo album by ID
      tags:
      - albums
  /albums/{id}/items:
    delete:
      consumes:
      - application/json
      description: Removes the album membership pointer. Does not delete the photo
        from disk.
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: integer
      - description: Photo reference
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_albums.addPhotoRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Remove a photo from an album
      tags:
      - albums
    get:
      description: Returns all photo items (pointers) in the given album.
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_albums.AlbumItemJSON'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: List photos in an album
      tags:
      - albums
    post:
      consumes:
      - application/json
      description: Adds a photo (by device serial + relative path) to an album. Idempotent.
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: integer
      - description: Photo reference
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_albums.addPhotoRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v0_albums.AlbumItemJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Add a photo to an album
      tags:
      - albums
  /albums/{id}/move:
    patch:
      consumes:
      - application/json
      description: Changes the parent of an album. Pass null parentId to move to root.
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: integer
      - description: New parent ID (null for root)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_albums.moveAlbumRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_albums.AlbumJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Move a photo album to a new parent
      tags:
      - albums
  /albums/{id}/rename:
    patch:
      consumes:
      - application/json
      description: Updates the name of an existing album.
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: integer
      - description: New album name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_albums.renameAlbumRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_albums.AlbumJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Rename a photo album
      tags:
      - albums
  /auth/account:
    delete:
      description: 'Deletes the selected aspects and logs the caller out everywhere.
        Pass account=true to delete only the caller''s own account, which is what
        App Store Guideline 5.1.1(v) requires; the other aspects are a factory reset
        of the appliance. All four are opt-in and a request selecting none is rejected,
        so a truncated call cannot destroy anything. The confirm parameter must equal
        the authenticated username. Databases are dropped and re-migrated in place,
        so no restart is required. Repeat calls are idempotent. External device data
        is reached only when devices=true; a drive that is not attached at reset time
        keeps its data. Deleting the last account returns the appliance to first-boot
        setup by design. Aspects are independent: deleting the account or the database
        does NOT delete stored files, and files left behind are readable by whoever
        sets the appliance up next — the response reports filesRetained=true whenever
        that happens, so pass files=true as well to erase the data itself.'
      parameters:
      - description: Delete the caller's own account (users row). Does NOT delete
          stored files unless files=true is also passed; files left behind stay readable
          by whoever sets the appliance up next.
        in: query
        name: account
        type: boolean
      - description: Delete the appliance databases (quark.db, quark.health.db). Does
          NOT delete stored files unless files=true is also passed; files left behind
          stay readable by whoever sets the appliance up next.
        in: query
        name: database
        type: boolean
      - description: Delete stored files under the data directory
        in: query
        name: files
        type: boolean
      - description: Delete the Quark data directory on attached external devices
        in: query
        name: devices
        type: boolean
      - description: Must equal the authenticated username
        in: query
        name: confirm
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              deleted:
                properties:
                  account:
                    type: boolean
                  database:
                    type: boolean
                  devices:
                    type: boolean
                  files:
                    type: boolean
                type: object
              filesRetained:
                type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Delete account data (factory reset)
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates with username and password, returns a session token
      parameters:
      - description: '{username, password}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Login
      tags:
      - auth
  /auth/logout:
    post:
      description: Invalidates the current session
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Logout
      tags:
      - auth
  /auth/recover:
    post:
      consumes:
      - application/json
      description: Resets password using recovery phrase
      parameters:
      - description: '{recoveryPhrase, newPassword}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Recover account
      tags:
      - auth
  /auth/sessions:
    delete:
      description: Deletes all active sessions for the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              revoked:
                type: boolean
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Revoke all sessions (log out everywhere)
      tags:
      - auth
    get:
      description: Returns all non-expired sessions for the authenticated user. Each
        session is identified by the SHA-256 hash of its token — pass this ID to DELETE
        /auth/sessions/{id} to revoke a specific session.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              sessions:
                items:
                  $ref: '#/definitions/authutil.SessionInfo'
                type: array
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: List active sessions
      tags:
      - auth
  /auth/sessions/{id}:
    delete:
      description: Deletes a specific session. The session ID is the SHA-256 hex hash
        of the session token, as returned by GET /auth/sessions.
      parameters:
      - description: Session ID (hex SHA-256 of token)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              revoked:
                type: boolean
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Revoke a session by ID
      tags:
      - auth
  /auth/setup:
    post:
      consumes:
      - application/json
      description: Creates the owner account. Can only be called once.
      parameters:
      - description: '{username, password}'
