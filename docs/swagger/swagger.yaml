  /auth/account:
    delete:
      consumes:
      - application/json
      description: 'Deletes the selected aspects and logs the caller out everywhere.
        Pass account=true to delete only the caller''s own account, which is what
        App Store Guideline 5.1.1(v) requires; the other aspects are a factory reset
        of the appliance. All four are opt-in and a request selecting none is rejected,
        so a truncated call cannot destroy anything. The JSON body''s password field
        must carry the caller''s own auth key, which is checked before anything is
        deleted; a raw password, which only an app from before auth keys sends, is
        refused with 426 (#2430); it travels in the body rather than the URL so it
        never reaches an access or proxy log. Attempts share the per-IP limit of the
        sign-in endpoints, so this endpoint cannot be used to guess the password.
        A reset of the database, files or devices holds the database write lock while
        it drops and re-migrates, so another instance serving the same install never
        sees it half done, and then every instance, this one included, restarts within
        a few seconds: expect requests to fail briefly after a 200. Repeat calls are
        idempotent while the account exists. External device data is reached only
        when devices=true; a drive that is not attached at reset time keeps its data.
        Deleting the last account returns the appliance to first-boot setup by design.
        Aspects are independent: deleting the account or the database does NOT delete
        stored files, and files left behind are readable by whoever sets the appliance
        up next — the response reports filesRetained=true whenever that happens, so
        pass files=true as well to erase the data itself.'
      parameters:
      - description: Delete the caller's own account (users row). Does NOT delete
          stored files unless files=true is also passed; files left behind stay readable
          by whoever sets the appliance up next.
        in: query
        name: account
        type: boolean
      - description: Delete the appliance database (quark.db). Does NOT delete stored
          files unless files=true is also passed; files left behind stay readable
          by whoever sets the appliance up next.
        in: query
        name: database
        type: boolean
      - description: Delete stored files under the data directory
        in: query
        name: files
        type: boolean
      - description: Delete the Quark data directory on attached external devices
        in: query
        name: devices
        type: boolean
      - description: The caller's own auth key, in the password field
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_auth.deleteAccountBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              deleted:
                properties:
                  account:
                    type: boolean
                  database:
                    type: boolean
                  devices:
                    type: boolean
                  files:
                    type: boolean
                type: object
              filesRetained:
                type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: no session, or the session's account no longer exists
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: the auth key is wrong, or database, files or devices were requested
            by a non-admin
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: account=true from the only active admin while other active
            or disabled accounts exist; nothing is deleted
          schema:
            $ref: '#/definitions/serverutil.Response'
        "426":
          description: 'password is a raw password: the app is too old'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "429":
          description: too many attempts from this address; nothing is deleted
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Delete account data (factory reset)
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: 'Authenticates with {username, authKey} and returns a session token.
        authKey is the standard base64 of the 32-byte key the client derived from
        the password and the salt GET /auth/salt returned. {username, password, authKey}
        is the one-time upgrade of an account GET /auth/salt calls legacy: the password
        is checked against the stored one, and the key, its salt and a cleared password
        hash are stored in one write, so the password never signs in again; a failed
        write refuses the sign-in with 500. An account that already has an auth key
        is checked by the key, and the password beside it is ignored. A body carrying
        password with no authKey, which only an app from before auth keys sends, is
        refused with 426 before anything is checked (#2430). legacyRecovery is true
        for an account that has no recovery key yet, such as one an admin created:
        the client generates a phrase and sends its key to PUT /auth/recovery-key.
        A pending or disabled account with the right key gets 403 with its status,
        so the app can tell it from a wrong password. Repeated failures lock out the
        client address, the account at that address, or the account from new addresses
        for a while: the answer is 429 with Retry-After in seconds, whether or not
        the username exists.'
      parameters:
      - description: The username, the authKey, and for the upgrade the password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_auth.credentialsBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_auth.loginResponse'
        "400":
          description: a missing or malformed authKey
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: status is pending or disabled
          schema:
            $ref: '#/definitions/v0_auth.accountRefusal'
        "426":
          description: 'the body carried a password with no authKey: the app is too
            old'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "429":
          description: locked out after repeated failures; see Retry-After
          headers:
            Retry-After:
              description: seconds until the lockout lifts
              type: integer
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: the upgrade's write failed
          schema:
            $ref: '#/definitions/serverutil.Response'
        "503":
          description: the account lookup failed; nothing was checked or counted toward
            a lockout
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Login
      tags:
      - auth
  /auth/logout:
    post:
      description: Invalidates the session the request carries, as a bearer token,
        the session cookie, or both, and clears the cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /auth/password:
    put:
      consumes:
      - application/json
      description: Re-confirms the caller with password, which carries the auth key
        of the password the account has now, exactly as PUT /auth/recovery-key takes
        it; a wrong or missing key is a 403, a raw password is a 426, and nothing
        is written. Then replaces the account's auth key with newAuthKey, the standard
        base64 of the 32-byte key the client derived from the new password and the
        salt GET /auth/salt returned (#3022). chatKeys, when sent, replaces the account's
        chat identity in the same transaction, re-wrapped under the new password,
        exactly as /auth/recover stores it, and vaultKey likewise replaces the wraps
        of the account's vault key (storing it as the first when the account has none)
        and publishes vault_changed to the account's sessions; nothing changes if
        any part fails. Every other session of the account is signed out in the same
        transaction; this one stays signed in. Shares the sign-in rate limit, and
        the body is at most 8 KiB.
      parameters:
      - description: The caller's auth key, the new password's auth key and optionally
          the re-wrapped chat keys and vault key
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_auth.changePasswordBody'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: a malformed newAuthKey, chatKeys or vaultKey
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: no session, or the session's account no longer exists
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: the auth key is wrong or missing
          schema:
            $ref: '#/definitions/serverutil.Response'
        "426":
          description: 'password is a raw password: the app is too old'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Change the caller's password
      tags:
      - auth
  /auth/recover:
    post:
      consumes:
      - application/json
      description: 'Resets the named account''s password using its recoveryKey, the
        standard base64 of the 32-byte key the client derived from the phrase and
        the salt GET /auth/salt returned. A wrong key, an unknown username and an
        account with no recovery key all read as a wrong phrase. newAuthKey, the standard
        base64 of the 32-byte key the client derived from the new password and the
        same salt, replaces the account''s auth key and clears its password hash.
        An account GET /auth/salt calls legacyRecovery recovers once with its raw
        recoveryPhrase in place of recoveryKey, beside newAuthKey and newRecoveryKey,
        the key of a phrase the client just generated: the reset stores both keys
        and clears the phrase and password hashes. An account with a recovery key
        refuses every phrase as a wrong one. A recoveryPhrase without both new keys,
        or a newPassword, is what only an app from before auth keys sends, and is
        refused with 426 (#2430). chatKeys, when sent, replaces the account''s chat
        identity in the same transaction: the client fetched it from /auth/recover/keys,
        opened it with the phrase and re-wrapped it under the new password (#2416).
        vaultKey, when sent, likewise replaces the wraps of the account''s vault key
        in the same transaction, fetched from /auth/recover/vault-key and re-wrapped
        the same way (storing it as the first when the account has none), and publishes
        vault_changed to the account''s sessions (#3459). The body is at most 8 KiB.'
      parameters:
      - description: The account, its recovery key or legacy phrase, the new keys,
          and optionally its re-wrapped chat keys and vault key
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_auth.recoverAccountBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: status is pending or disabled
          schema:
            $ref: '#/definitions/v0_auth.accountRefusal'
        "426":
          description: 'the body carried newPassword, or a phrase without both new
            keys: the app is too old'
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Recover account
      tags:
      - auth
  /auth/recover/keys:
    post:
      consumes:
      - application/json
      description: The first step of recovering an account that has chat keys (#2416).
        Checks the recovery key exactly as /auth/recover does, changes nothing, and
        returns the account's wrapped chat identity so the client can open it with
        the phrase wrap key and send it back re-wrapped under the new password in
        /auth/recover. Needs no session and shares the sign-in rate limit. An unknown
        username or a wrong key reads as a wrong phrase. An account GET /auth/salt
        calls legacyRecovery may send its raw recoveryPhrase in place of recoveryKey,
        checked against the stored phrase, to fetch the wraps before its one legacy
        recovery; an account with a recovery key refuses every phrase as a wrong one
        (#2430).
      parameters:
      - description: The account and its recovery key, or a legacy account's phrase
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_auth.recoverChatKeysBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.Keys'
        "400":
          description: a wrong key or phrase, an unknown username, or a missing or
            malformed key
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: status is pending or disabled
          schema:
            $ref: '#/definitions/v0_auth.accountRefusal'
        "404":
          description: the account has no chat keys yet
          schema:
            $ref: '#/definitions/serverutil.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Fetch chat keys for account recovery
      tags:
      - auth
  /auth/recover/vault-key:
    post:
      consumes:
      - application/json
      description: The vault's half of the first step of recovering an account (#3459),
        beside POST /auth/recover/keys for chat. Checks the recovery key exactly as
        /auth/recover does, changes nothing, and returns the account's wrapped vault
        key so the client can open it with the phrase wrap key and send it back re-wrapped
        under the new password as vaultKey in /auth/recover. Needs no session and
        shares the sign-in rate limit. An unknown username or a wrong key reads as
        a wrong phrase. A legacy account, one GET /auth/salt calls legacyRecovery,
        may send its raw recoveryPhrase in place of recoveryKey, as /auth/recover/keys
        takes it.
      parameters:
      - description: The account and its recovery key, or a legacy account's phrase
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_auth.recoverChatKeysBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/vaultutil.Key'
        "400":
          description: a wrong key or phrase, an unknown username, or a missing or
            malformed key
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: status is pending or disabled
          schema:
            $ref: '#/definitions/v0_auth.accountRefusal'
        "404":
          description: the account has no vault
          schema:
            $ref: '#/definitions/serverutil.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Fetch the vault key for account recovery
      tags:
      - auth
  /auth/recovery-key:
    put:
      consumes:
      - application/json
      description: Re-confirms the caller with password, which carries the auth key,
        exactly as DELETE /auth/account takes it; a wrong or missing key is a 403,
        a raw password is a 426, and nothing is written. Then gives the signed-in
        account the recovery key its client derived from a recovery phrase the client
        generated, (#2430). recoveryKey is the standard base64 of the 32-byte key
        derived from the phrase and the salt GET /auth/salt returned. chatKeys, when
        sent, replaces the account's chat identity in the same transaction, re-wrapped
        under the new phrase, exactly as /auth/recover stores it, and vaultKey likewise
        replaces the wraps of the account's vault key (storing it as the first when
        the account has none) and publishes vault_changed to the account's sessions;
        nothing changes if any part fails. The client calls this after a sign-in whose
        response says legacyRecovery, such as the first sign-in of an account an admin
        created. Shares the sign-in rate limit, and the body is at most 8 KiB.
      parameters:
      - description: The caller's auth key, the new recovery key and optionally the
          re-wrapped chat keys and vault key
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_auth.setRecoveryKeyBody'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: a malformed recoveryKey, chatKeys or vaultKey
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: no session, or the session's account no longer exists
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: the auth key is wrong or missing
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: the account has no auth key yet, so no salt to derive the key
            with
          schema:
            $ref: '#/definitions/serverutil.Response'
        "426":
          description: 'password is a raw password: the app is too old'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Set the caller's recovery key
      tags:
      - auth
  /auth/request-account:
    post:
      consumes:
      - application/json
      description: Creates a pending account that can sign in once an admin approves
        it. Needs no session and is rate-limited per IP. A pending request keeps its
        username taken until it is denied. The body carries authKey, the standard
        base64 of the 32-byte key the client derived from the password and the salt
        GET /auth/salt returned, and recoveryKey, the standard base64 of the 32-byte
        key the client derived from a recovery phrase it generated and the same salt;
        the Quark makes no phrase, and the response is an empty object. Without recoveryKey
        the account cannot recover until a sign-in gives it one. A body carrying password,
        the raw password an app from before auth keys sends, is refused with 426 before
        anything is checked (#2430).
      parameters:
      - description: The username, the authKey and the recoveryKey
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_auth.newAccountBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: invalid username, authKey or recoveryKey
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: requests are turned off, or the Quark is not set up
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: that username is taken
          schema:
            $ref: '#/definitions/serverutil.Response'
        "426":
          description: 'the body carried a raw password or phrase: the app is too
            old'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Request an account
      tags:
      - auth
  /auth/salt:
    get:
      description: 'Returns the salt a client derives the named account''s auth key
        with, as the standard base64 of 16 bytes. Needs no session and is rate-limited
        per IP. A username with no account gets a salt too, the same one every time,
        so the answer does not say whether the account exists. legacy is true for
        an account that has no auth key yet: the client signs in once with the password
        beside the key, and the Quark moves the account to the key and forgets the
        password (#2430). legacyRecovery is true for an account that has no recovery
        key: the client gives it one at sign-in through PUT /auth/recovery-key, or
        recovers it once with the raw phrase and a new phrase''s key. An unknown username
        reads false for both, like an account that has moved to keys.'
      parameters:
      - description: The account's username
        in: query
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_auth.saltResponse'
        "400":
          description: no username
          schema:
            $ref: '#/definitions/serverutil.Response'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Get the salt for an auth key
      tags:
      - auth
  /auth/sessions:
    delete:
      description: Deletes every session of the authenticated user except the one
        the request was authenticated with. A request authenticated without a session
        (HTTP Basic) has none to keep, so every session is deleted.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              revoked:
                type: boolean
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Revoke all other sessions (sign out everywhere else)
      tags:
      - auth
    get:
      description: Returns all non-expired sessions for the authenticated user. Each
        session is identified by the SHA-256 hash of its token — pass this ID to DELETE
        /auth/sessions/{id} to revoke a specific session. The session the request
        was authenticated with has current=true.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              sessions:
                items:
                  $ref: '#/definitions/authutil.SessionInfo'
                type: array
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List active sessions
      tags:
      - auth
  /auth/sessions/{id}:
    delete:
      description: Deletes a specific session. The session ID is the SHA-256 hex hash
        of the session token, as returned by GET /auth/sessions.
      parameters:
      - description: Session ID (hex SHA-256 of token)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              revoked:
                type: boolean
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Revoke a session by ID
      tags:
      - auth
  /auth/setup:
    post:
      consumes:
      - application/json
      description: Creates the owner account, with a home under users/ on the internal
        device that it owns; an existing folder of that name under users/ becomes
        the home. Can only be called once. The body carries authKey, the standard
        base64 of the 32-byte key the client derived from the password and the salt
        GET /auth/salt returned, and recoveryKey, the standard base64 of the 32-byte
        key the client derived from a recovery phrase it generated and the same salt;
        the Quark makes no phrase. Without recoveryKey the account cannot recover
        until a sign-in gives it one. A body carrying password, the raw password an
        app from before auth keys sends, is refused with 426 before anything is checked
        (#2430). The response carries token.
      parameters:
      - description: The username, the authKey and the recoveryKey
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_auth.newAccountBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "426":
          description: 'the body carried a raw password or phrase: the app is too
            old'
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: First-boot user setup
      tags:
      - auth
  /auth/status:
    get:
      description: 'Returns whether initial setup has been completed and, once it
        has, accessRequestsEnabled: whether the sign-in page may offer to request
        an account. For a caller with a valid session it also returns that caller''s
        username, userId and isAdmin flag, and avatarUpdatedAt (Unix milliseconds)
        when they have a profile picture.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Check auth setup status
      tags:
      - auth
  /books:
    get:
      description: Finds all books in the files directory
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_books.BookJSON'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List books
      tags:
      - books
  /calendar/events:
    get:
      description: Lists the household calendar's one-off events that overlap [from,
        to) and every repeating event with an occurrence there, by start. A series
        whose repeatUntil date ends before the range is left out; one without repeatUntil
        repeats forever. A repeating event is listed once, as its first occurrence
        and preset; the client expands the occurrences. The range is widened by a
        day each way so all-day events are not missed at its edges, and can span at
        most 400 days.
      parameters:
      - description: Range start, RFC 3339
        in: query
        name: from
        required: true
        type: string
      - description: Range end (exclusive), RFC 3339
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_calendar.EventListJSON'
        "400":
          description: 'Bad Request: missing or malformed from/to, or a reversed or
            too-long range'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List calendar events in a range
      tags:
      - calendar
    post:
      consumes:
      - application/json
      description: Adds an event to the household calendar, owned by the caller, and
        tells every open client it changed. Times are RFC 3339; an all-day event starts
        and ends at midnight UTC, the end exclusive. repeat is none, daily, weekly
        or monthly, and a repeating event must end before it repeats. repeatUntil
        is a repeating event's last date, inclusive, sent as midnight UTC; it may
        not fall before the first occurrence's date, null or absent repeats forever,
        and a one-off event ignores it. reminderMinutes counts back from the start,
        0 to a week; an all-day event's may be negative down to -1439 so it falls
        on its own day (-540 is 9 AM). colorIndex is 0 to 5. timeZone is the IANA
        zone the event was made in, like America/New_York, or empty when the client
        does not know it; any other name is a 400.
      parameters:
      - description: The event
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_calendar.eventRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v0_calendar.EventJSON'
        "400":
          description: 'Bad Request: a malformed body or an event that breaks a rule'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Create a calendar event
      tags:
      - calendar
  /calendar/events/{id}:
    delete:
      description: Deletes an event, every occurrence of a repeating one included,
        and tells every open client it changed.
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: 'Bad Request: id is not a number'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Delete a calendar event
      tags:
      - calendar
    get:
      description: Returns one event of the household calendar. A repeating event
        is returned as its series.
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_calendar.EventJSON'
        "400":
          description: 'Bad Request: id is not a number'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get a calendar event
      tags:
      - calendar
    put:
      consumes:
      - application/json
      description: Replaces every field of an event, under the same rules as a create,
        and tells every open client it changed. For a repeating event the change applies
        to the whole series. The event keeps its owner.
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      - description: The event's new fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_calendar.eventRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_calendar.EventJSON'
        "400":
          description: 'Bad Request: a malformed id or body, or an event that breaks
            a rule'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Update a calendar event
      tags:
      - calendar
  /calendar/events/{id}/move:
    post:
      consumes:
      - application/json
      description: Moves one occurrence of a repeating event, that occurrence and
        every one after it, or the whole series. scope is one, following or all. occurrenceStart
        is the start of the occurrence that was moved, and start and end are where
        it was dropped, all RFC 3339. one records that start on the series and creates
        a one-off at the new time, owned by the series' owner. following ends the
        series the day before that occurrence and creates a new series at the new
        time, carrying later skipped starts shifted by the same amount; the first
        occurrence moves the whole series. all moves the series' own start and end
        as far as that occurrence moved. The series, and the created event when there
        is one, come back together.
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      - description: Which occurrence moved, and where
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_calendar.moveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_calendar.MoveJSON'
        "400":
          description: 'Bad Request: a malformed id or body, or a move that breaks
            a rule'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Move a calendar event's occurrence
      tags:
      - calendar
  /chat/channels:
    get:
      description: 'Returns the channels the caller is a member of, directly, through
        a group, or through everyone, general first and then by name, each with the
        caller''s effective permissions there: the union of every row that reaches
        them, and unreadCount: the messages after the caller''s read marker (PUT /chat/channels/{id}/read)
        that someone else wrote and nobody deleted, 0 on a channel the caller lacks
        read_messages on, and lastReadMessageId: the caller''s read marker there,
        so a session that missed chat_read_marker_changed can restore it, 0 before
        the first read and without read_messages. A channel on which that set is empty
        is left out. Admins get only their own channels too, unless they pass all=1:
        then the channels they are not in follow, in the same order, with an empty
        set.'
      parameters:
      - description: 1 adds the channels an admin is not in; refused for anyone else
        in: query
        name: all
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.ListChannelsResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: all=1 from an account that isn't an admin
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List the caller's chat channels
      tags:
      - chat
    post:
      consumes:
      - application/json
      description: Creates a private channel and gives the caller every permission
        on it. Any signed-in account may. The name is trimmed, has 1 to 64 characters
        and no line breaks or tabs, and is unique ignoring case; the topic has at
        most 512 characters. Publishes chat_channel_changed.
      parameters:
      - description: The name and an optional topic
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_chat.createChannelBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/chatutil.Channel'
        "400":
          description: an invalid name or topic
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: another channel has that name
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Create a chat channel
      tags:
      - chat
  /chat/channels/{id}:
    delete:
      description: Deletes a channel and its members. Needs manage_channel, or an
        admin, and general can't be deleted. Publishes chat_channel_changed to everyone
        who had a non-empty set on it.
      parameters:
      - description: Channel id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: the channel is general
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: the caller lacks manage_channel
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such channel, or the caller's set on it is empty and they
            aren't an admin
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Delete a chat channel
      tags:
      - chat
    patch:
      consumes:
      - application/json
      description: Changes a channel's name, topic or both; a field left out is unchanged.
        Needs manage_channel, or an admin. The name rules are create's. permissions
        in the answer is empty for an admin who isn't a member. Publishes chat_channel_changed.
      parameters:
      - description: Channel id
        in: path
        name: id
        required: true
        type: integer
      - description: The new name, topic or both
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_chat.updateChannelBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.Channel'
        "400":
          description: an invalid name or topic
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: the caller lacks manage_channel
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such channel, or the caller's set on it is empty and they
            aren't an admin
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: another channel has that name
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Rename a chat channel or change its topic
      tags:
      - chat
  /chat/channels/{id}/events:
    get:
      description: 'Pages the channel''s membership and key events oldest first: member_set,
        member_removed and key_created. Each has the JSON payload its signature covers;
        signature and signerSignKey are absent until the actor''s client signs it,
        and an unsigned event is shown as unverified. Needs read_messages; anyone
        else, delegated managers included, gets 404.'
      parameters:
      - description: Channel id
        in: path
        name: id
        required: true
        type: integer
      - description: The last event id already seen
        in: query
        name: after
        type: integer
      - description: At most this many, capped at 200
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.ListEventsResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such channel, or the caller isn't a member
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List a chat channel's system events
      tags:
      - chat
  /chat/channels/{id}/events/{eventId}/signature:
    put:
      consumes:
      - application/json
      description: Stores the caller's 64-byte Ed25519 signature, base64, over an
        event's canonical bytes, with the caller's published signing key beside it.
        Only the event's actor may sign it, and only once, whether or not they are
        still a member. The channel's members hear chat_channel_changed, so they can
        show it as verified.
      parameters:
      - description: Channel id
        in: path
        name: id
        required: true
        type: integer
      - description: Event id
        in: path
        name: eventId
        required: true
        type: integer
      - description: The signature
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_chat.signEventBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.ChannelEvent'
        "400":
          description: a signature of the wrong size
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such channel or event, or the caller isn't the event's actor
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: the event is already signed
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Sign a chat channel event the caller made
      tags:
      - chat
  /chat/channels/{id}/keys:
    get:
      description: 'Returns the channel''s key versions, the newest (0 before any
        exists, when the first member to open the channel creates version 1), the
        caller''s own key grants, and whether the key needs rotating because someone
        without read_messages holds the current version. Needs read_messages: anyone
        else, delegated managers and admins included, gets 404.'
      parameters:
      - description: Channel id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.GetChannelKeysResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such channel, or the caller isn't a member
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get a chat channel's key versions and the caller's grants
      tags:
      - chat
    post:
      consumes:
      - application/json
      description: 'Starts a channel''s key (version 1) or rotates it once rotationNeeded
        is true, storing the caller''s own grant of the new key: sealedKey is the
        80-byte crypto_box_seal of the key to the caller''s X25519 key and signature
        the caller''s 64-byte Ed25519 signature over the grant, both base64. The caller
        then fills the other members'' grants. Any member with published chat keys
        may do it. Returns the key_created event for the caller to sign. Publishes
        chat_key_needed to key holders when members lack the new version.'
      parameters:
      - description: Channel id
        in: path
        name: id
        required: true
        type: integer
      - description: The version and the caller's grant of it
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_chat.createKeyVersionBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.CreateKeyVersionResult'
        "400":
          description: a sealed key or signature of the wrong size, or a signature
            that doesn't verify against the caller's chat keys
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such channel, the caller isn't a member, or has no chat
            keys
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: version isn't the next one (another member created it first),
            or the key doesn't need rotating
          schema:
            $ref: '#/definitions/serverutil.Response'
        "429":
          description: the caller sent too many of these in a short time; the limit
            is per account
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Create the next version of a chat channel's key
      tags:
      - chat
  /chat/channels/{id}/keys/grants:
    post:
      consumes:
      - application/json
      description: 'Stores up to 256 grants, each a version of the channel key the
        caller holds, sealed (80 bytes) to a member with published chat keys and signed
        (64 bytes) by the caller, base64. The Quark verifies each signature against
        the caller''s published signing key before storing anything. The first grant
        for a member and version wins: a later one is ignored and the stored one returned.
        Publishes chat_key_granted to the recipients.'
      parameters:
      - description: Channel id
        in: path
        name: id
        required: true
        type: integer
      - description: The grants
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_chat.uploadGrantsBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.UploadGrantsResult'
        "400":
          description: a malformed grant, a signature that doesn't verify, or one
            for someone who isn't a member with chat keys
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: the caller holds no grant for that version
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such channel, the caller isn't a member, or has no chat
            keys
          schema:
            $ref: '#/definitions/serverutil.Response'
        "429":
          description: the caller sent too many of these in a short time; the limit
            is per account
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Upload key grants for other members
      tags:
      - chat
  /chat/channels/{id}/keys/grants/{version}:
    delete:
      description: Deletes the caller's own grant of one version of the channel key,
        for a grant the caller's app couldn't open or verify. Grants are first-write-wins,
        so this is how a recipient clears a useless one. The caller is pending again,
        and the key holders hear chat_key_needed so one of them refills it. Only the
        recipient can delete a grant.
      parameters:
      - description: Channel id
        in: path
        name: id
        required: true
        type: integer
      - description: Key version
        in: path
        name: version
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.RejectGrantResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such channel, the caller isn't a member, or holds no grant
            of that version
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Reject your own key grant
      tags:
      - chat
  /chat/channels/{id}/keys/pending:
    get:
      description: Lists the holders of read_messages, direct or through a group or
        everyone, who have published chat keys but lack a version of the channel's
        key that the caller holds, each with the X25519 key to seal it to. Also says
        whether the key needs rotating. Needs read_messages; anyone else, delegated
        managers included, gets 404.
      parameters:
      - description: Channel id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.ListPendingGrantsResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such channel, or the caller isn't a member
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List the key grants the caller can fill
      tags:
      - chat
  /chat/channels/{id}/members:
    delete:
      consumes:
      - application/json
      description: Removes one account's or group's row from a channel and returns
        the channel's members as they now stand. Any member may remove their own account's
        row, which is leaving. Removing anyone else needs manage_members and a target
        whose effective set is a strict subset of the caller's, unless the caller
        holds manage_channel; only an admin may remove the channel's creator or skip
        those rules. everyone can't be removed from general. Publishes chat_channel_changed
        to everyone who was or now is a member.
      parameters:
      - description: Channel id
        in: path
        name: id
        required: true
        type: integer
      - description: One account or group
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_chat.removeMemberBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.ListMembersResult'
        "400":
          description: not exactly one account or group, everyone on general, or the
            last holder of manage_channel while other members remain, when the caller
            is not an admin
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: removing someone else without manage_members, or someone the
            caller may not remove
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such channel, the caller's set on it is empty and they aren't
            an admin, or the account or group has no row
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Remove a chat channel member
      tags:
      - chat
    get:
      description: Returns a channel's rows, groups first and then accounts, each
        by name. A group carries the active accounts in it, everyone's being every
        active account. Each account carries avatarUpdatedAt (Unix milliseconds) when
        it has a profile picture, the v parameter for /users/{id}/avatar. Each row
        carries its own permissions. Anyone with a non-empty set on the channel, a
        delegated manager included, or an admin may list them.
      parameters:
      - description: Channel id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.ListMembersResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such channel, or the caller's set on it is empty and they
            aren't an admin
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List a chat channel's members
      tags:
      - chat
    put:
      consumes:
      - application/json
      description: Gives one active account or existing group a set of permissions
        on a channel, replacing the set its row had, and returns the channel's members
        as they now stand. Needs manage_members, or an admin. A caller may grant only
        permissions they hold, and may take permissions away only from a principal
        whose effective set is a strict subset of theirs unless they hold manage_channel;
        only an admin may demote the channel's creator. everyone keeps read_messages
        on general. Publishes chat_channel_changed to everyone who was or now is a
        member.
      parameters:
      - description: Channel id
        in: path
        name: id
        required: true
        type: integer
      - description: One account or group, and its permissions
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_chat.setMemberBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.ListMembersResult'
        "400":
          description: not exactly one account or group, everyone below read_messages
            on general, or leaving the channel without a manage_channel holder when
            the caller is not an admin
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: the caller lacks manage_members, grants a permission they lack,
            or demotes someone they may not
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such channel, the caller's set on it is empty and they aren't
            an admin, or no active account or group has that id
          schema:
            $ref: '#/definitions/serverutil.Response'
        "422":
          description: an unknown permission, an empty set, or a message permission
            without read_messages
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Add a chat channel member or change its permissions
      tags:
      - chat
  /chat/channels/{id}/messages:
    get:
      description: Returns messages oldest first. With after, the page starts after
        that id (after=0 is the beginning), which is how a client catches up on anything
        the events socket dropped. Otherwise it ends before before, or at the newest
        message when before is left out. Deleted messages come back as tombstones
        with deletedAt and no ciphertext. Needs read_messages; anyone else gets 404,
        delegated managers and admins included.
      parameters:
      - description: Channel id
        in: path
        name: id
        required: true
        type: integer
      - description: Page backward from this message id
        in: query
        name: before
        type: integer
      - description: Page forward from this message id
        in: query
        name: after
        type: integer
      - description: At most this many, 50 by default, capped at 200
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.ListMessagesResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such channel, or the caller lacks read_messages
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Page a chat channel's encrypted messages
      tags:
      - chat
    post:
      consumes:
      - application/json
      description: 'Stores ciphertext, base64, that the caller''s client encrypted
        under the channel key of keyVersion, and sends the stored row to the channel''s
        readers as chat_message_created. The Quark never sees the text. A ciphertext''s
        24-byte nonce is taken once per channel and key version: repeating your own
        live post byte for byte returns it with 200 and stores nothing, and any other
        reuse is 409. clientMessageId, up to 64 bytes, names the send: a retry encrypts
        again under a fresh nonce, so it carries the same clientMessageId, and one
        the caller already sent to this channel returns that message with 200 and
        stores nothing, whatever the ciphertext. Ciphertext is at most 16 KiB. Needs
        send_messages; a reader without it gets 403, and anyone without read_messages
        404, delegated managers and admins included.'
      parameters:
      - description: Channel id
        in: path
        name: id
        required: true
        type: integer
      - description: The encrypted message
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_chat.postMessageBody'
      produces:
      - application/json
      responses:
        "200":
          description: the caller already posted this clientMessageId or exactly this
            ciphertext; nothing new was stored
          schema:
            $ref: '#/definitions/chatutil.Message'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/chatutil.Message'
        "400":
          description: ciphertext too short, a key version the channel doesn't have,
            or a clientMessageId over 64 bytes
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: the caller reads the channel but lacks send_messages
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such channel, or the caller lacks read_messages
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: the channel already has a message with this nonce under keyVersion,
            deleted ones included
          schema:
            $ref: '#/definitions/serverutil.Response'
        "413":
          description: ciphertext over 16 KiB
          schema:
            $ref: '#/definitions/serverutil.Response'
        "429":
          description: the caller sent too many of these in a short time; the limit
            is per account
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Post an encrypted message to a chat channel
      tags:
      - chat
  /chat/channels/{id}/read:
    put:
      consumes:
      - application/json
      description: 'Moves the caller''s read marker in the channel to messageId, the
        newest message they have read there, and returns where the marker stands with
        the unread count past it: the messages after it that someone else wrote and
        nobody deleted. The marker never moves backward: an id at or before it changes
        nothing and still answers 200 with the marker as it stands. A move publishes
        chat_read_marker_changed with {channelId, lastReadMessageId, unreadCount}
        to the caller''s own sessions alone, so their other devices clear the count.
        Needs read_messages; anyone else gets 404, delegated managers and admins included.'
      parameters:
      - description: Channel id
        in: path
        name: id
        required: true
        type: integer
      - description: The newest message read
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_chat.markReadBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.MarkReadResult'
        "400":
          description: the body isn't JSON with a messageId
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such channel, the caller lacks read_messages, or the channel
            has no message with that id
          schema:
            $ref: '#/definitions/serverutil.Response'
        "429":
          description: the caller sent too many of these in a short time; the limit
            is per account
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Mark a chat channel read up to a message
      tags:
      - chat
  /chat/keys/{userId}:
    get:
      description: Returns an active account's X25519 box and Ed25519 signing public
        keys, base64, and never its wrapped private seeds. Any signed-in account may
        ask. 404 means the account doesn't exist, isn't active, or has no chat keys
        yet.
      parameters:
      - description: Account id
        in: path
        name: userId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.PublicKeys'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such active account, or it has no chat keys yet
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get an account's public chat keys
      tags:
      - chat
  /chat/keys/me:
    get:
      description: Returns the caller's chat public keys and the private seeds wrapped
        on the client under the login password and, when present, the recovery phrase.
        Byte fields are base64. The Quark never opens them. 404 means the caller has
        no chat keys yet and the client should generate them.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.Keys'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: the caller has no chat keys yet
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get the caller's chat identity
      tags:
      - chat
    put:
      consumes:
      - application/json
      description: Stores the caller's chat public keys (32 bytes each) and private
        seeds wrapped on the client (at most 512 bytes each), with 16-byte Argon2id
        salts and the client's kdfParams object. wrappedByPhrase and saltRp are both
        present or both absent. Byte fields are base64 and the body is at most 8 KiB.
        Replaces any keys the caller had; a new box key drops the caller's channel
        key grants, which were sealed to the old one, and asks members to refill them
        with chat_key_needed.
      parameters:
      - description: The caller's chat identity; createdAt and updatedAt are ignored
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/chatutil.Keys'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.Keys'
        "400":
          description: keys of the wrong size or shape, or a body over 8 KiB
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Create or replace the caller's chat identity
      tags:
      - chat
  /chat/messages/{id}:
    delete:
      description: Wipes the message's ciphertext and sets deletedAt, leaving a tombstone
        so paging stays contiguous, and tells the channel's readers with chat_message_deleted.
        Allowed for the message's author or a holder of delete_messages, either of
        whom must hold read_messages now; another reader gets 403 and anyone without
        read_messages 404, delegated managers, demoted authors and admins included.
      parameters:
      - description: Message id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.Message'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: the caller neither wrote it nor holds delete_messages
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such message, or the caller lacks read_messages in its channel
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Delete a chat message
      tags:
      - chat
  /chat/messages/{id}/reactions:
    post:
      consumes:
      - application/json
      description: Stores a reaction, base64 ciphertext the caller's client encrypted
        under the channel key of keyVersion, and sends the stored row to the channel's
        readers as chat_reaction_changed. The Quark never sees the emoji. Ciphertext
        is at most 256 bytes, and an account may hold at most 20 reactions on one
        message. Needs add_reactions; a reader without it gets 403, and anyone without
        read_messages 404, delegated managers and admins included.
      parameters:
      - description: Message id
        in: path
        name: id
        required: true
        type: integer
      - description: The encrypted reaction
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_chat.reactionBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/chatutil.Reaction'
        "400":
          description: ciphertext too short or too long, or a key version the channel
            doesn't have
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: the caller reads the channel but lacks add_reactions
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such message, or the caller lacks read_messages in its channel
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: the message was deleted, or the caller already holds 20 reactions
            on it
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: React to a chat message
      tags:
      - chat
  /chat/reactions/{id}:
    delete:
      description: Deletes the reaction and tells the channel's readers with a chat_reaction_changed
        that carries no reaction. Removing your own needs add_reactions, and removing
        someone else's manage_reactions; either way the caller must hold read_messages
        now, and anyone without it gets 404, delegated managers and admins included.
      parameters:
      - description: Reaction id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chatutil.Reaction'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: your own without add_reactions, or someone else's without manage_reactions
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: no such reaction, or the caller lacks read_messages in its
            channel
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Remove a reaction from a chat message
      tags:
      - chat
  /devices:
    get:
      description: 'Returns the unique client IP + User-Agent combinations that have
        connected to the quark, most recently seen first, with current set on the
        one that matches this request. The list is bounded: the least recently seen
        are dropped past a cap and after a month unseen.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_devices.ConnectedDeviceJSON'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List connected devices
      tags:
      - devices
  /devices/{id}:
    delete:
      description: Deletes a connected device entry by ID
      parameters:
      - description: Device ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Remove a connected device record
      tags:
      - devices
  /events:
    get:
      description: Upgrades the connection to WebSocket and pushes JSON events for
        file system mutations (upload, delete, move, new_folder). Each connection
        hears only events about paths its user can read; admins hear every event.
        A connection closes once its account is turned off, deleted, promoted or demoted.
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Stream real-time file/device events
      tags:
      - events
  /feeds:
    get:
      description: Returns the caller's subscriptions, folders first, then by the
        caller's name or the publisher's title. Another account's subscriptions are
        not included. An account with none gets an empty list.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/feedutil.Feed'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List the caller's feed subscriptions
      tags:
      - feeds
    post:
      consumes:
      - application/json
      description: 'Subscribes the caller to a feed. Without discover, url is the
        feed address and nothing is fetched. With discover, url is a site page: it
        is fetched and searched for a feed link. One link is subscribed to. Several
        links return 409 and the candidates, and store nothing; the caller subscribes
        to the chosen candidate with discover left false. The address must be http
        or https and must not resolve to a private, loopback or link-local range.
        A feed address can carry a private token, and no error repeats it. name is
        the caller''s label and folder is the one folder they file it under. Publishes
        feed_changed to the caller''s sessions.'
      parameters:
      - description: The feed or site address
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_feeds.addRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/feedutil.Feed'
        "400":
          description: an address that is not allowed, a page with no feed, or a malformed
            body
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: the caller already subscribes to that feed, or the page offers
            several
          schema:
            $ref: '#/definitions/v0_feeds.ChoiceJSON'
        "413":
          description: a body over 16 KiB
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Subscribe to a feed
      tags:
      - feeds
  /feeds/{id}:
    delete:
      description: Deletes one of the caller's subscriptions and the entries stored
        for it. Another account's id, or one that names nothing, is a 404, for an
        admin too, and deletes nothing. Publishes feed_changed with the subscription's
        id to the caller's sessions.
      parameters:
      - description: Subscription id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: the caller has no subscription with that id
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Unsubscribe from a feed
      tags:
      - feeds
    get:
      description: Returns one subscription of the caller's. Another account's id,
        or one that names nothing, is a 404, for an admin too.
      parameters:
      - description: Subscription id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/feedutil.Feed'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: the caller has no subscription with that id
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get one of the caller's feed subscriptions
      tags:
      - feeds
    patch:
      consumes:
      - application/json
      description: Changes the caller's label, the folder they file the subscription
        under, or both. A missing field is left as it is. An empty name clears the
        label, so the publisher's title shows, and an empty folder takes the feed
        out of its folder. Another account's id, or one that names nothing, is a 404,
        for an admin too, and changes nothing. The feed URL is not changed. Publishes
        feed_changed to the caller's sessions.
      parameters:
      - description: Subscription id
        in: path
        name: id
        required: true
        type: integer
      - description: The label, the folder, or both
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_feeds.updateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/feedutil.Feed'
        "400":
          description: a label that is not valid, or a body that changes nothing
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: the caller has no subscription with that id
          schema:
            $ref: '#/definitions/serverutil.Response'
        "413":
          description: a body over 16 KiB
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Rename a feed or file it in a folder
      tags:
      - feeds
  /files:
    delete:
      description: Move files to the device's trash (internal storage included), returning
        immediately. They can be restored through /trash/restore until the hourly
        purge deletes them after the retention period. DB cleanup and events are dispatched
        in the background.
      parameters:
      - description: Root directory
        in: query
        name: rootDir
        type: string
      - collectionFormat: csv
        description: Array of file paths to delete, at most 1000 (fileutil.MaxDeleteFiles)
        in: query
        items:
          type: string
        name: filePaths
        required: true
        type: array
      - description: Device serial number to filter by
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: 'Bad Request: no paths, more than 1000, or a path outside the
            files directory'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Delete files
      tags:
      - files
    get:
      description: merges files across all managed devices for the given filePath.
        If deviceSerial is empty, list files across all devices. Otherwise, only for
        the specified device
      parameters:
      - description: File dir to list
        in: query
        name: rootDir
        type: string
      - description: Device serial number to filter by
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_files.FileNodeJSON'
            type: array
        "400":
          description: 'Bad Request: a rootDir outside the files directory'
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Lists files
      tags:
      - files
    put:
      consumes:
      - application/json
      description: Enqueue a file move operation between paths/devices. Needs write
        access on the file and on the folder it moves into. A file already at the
        new path is replaced; a .qslide, .qsheet or .qdoc on the internal device is
        first snapshotted into its version history.
      parameters:
      - description: Move file request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_files.moveFileRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Ok
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Move or rename a file
      tags:
      - files
  /files/by-type:
    get:
      description: Recursively walks all managed devices and returns files whose fileType
        matches the given value, sorted newest-first. A live-sync copy on the default-storage
        drive of a file on the internal drive is listed once, as the internal file.
      parameters:
      - description: File type to filter by (e.g. qdoc, qsheet)
        in: query
        name: fileType
        required: true
        type: string
      - collectionFormat: csv
        description: Filter by device serial(s)
        in: query
        items:
          type: string
        name: serial
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_files.FileNodeJSON'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List all files of a given type
      tags:
      - files
  /files/convert/document:
    post:
      description: 'Reads a .docx, .docm or .odt document and writes it as a sibling
        .qdoc, the format the document editor opens ("Open as Quark doc"). The document
        itself is left untouched. What a .qdoc cannot hold is flattened or left out
        and named in warnings: a table becomes one line per row with tab-separated
        cells, and images are dropped. Answers 409 when a .qdoc of that name already
        exists and overwrite was not asked for; with overwrite on the internal device,
        the replaced document is first snapshotted into its version history. A file
        that is not what its name says is a 400. Needs read access on the document
        and write access on its directory; the caller owns a newly created .qdoc.'
      parameters:
      - description: Path to the .docx, .docm or .odt file to convert
        in: query
        name: filePath
        required: true
        type: string
      - description: Device serial number
        in: query
        name: serial
        type: string
      - description: Replace an existing .qdoc of the same name
        in: query
        name: overwrite
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.ConvertDocumentJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Convert a document to a Quark document
      tags:
      - files
  /files/convert/xlsx:
    post:
      description: Reads an .xlsx or .xlsm workbook and writes it back as a sibling
        .qsheet, the format the Sheets editor opens. The workbook itself is left untouched.
        Answers 409 when a .qsheet of that name already exists and overwrite was not
        asked for; with overwrite on the internal device, the replaced sheet is first
        snapshotted into its version history. Needs read access on the workbook and
        write access on its directory; the caller owns a newly created .qsheet.
      parameters:
      - description: Path to the .xlsx or .xlsm file to convert
        in: query
        name: filePath
        required: true
        type: string
      - description: Device serial number
        in: query
        name: serial
        type: string
      - description: Replace an existing .qsheet of the same name
        in: query
        name: overwrite
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.ConvertXlsxJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Convert a spreadsheet to a Quark spreadsheet
      tags:
      - files
  /files/download:
    get:
      description: Downloads a single file or zips a folder and streams it back to
        the client
      parameters:
      - description: File path to download
        in: query
        name: filePath
        type: string
      - description: Device serial number to filter by
        in: query
        name: serial
        type: string
      - description: Output format conversion (e.g. 'jpeg' to convert HEIC to JPEG)
        in: query
        name: format
        type: string
      - description: 'Token from POST /files/download-token, for a browser link that
          cannot send an Authorization header. It is good for one download: the first
          request, then retries that resume it with a Range header or start it over
          without one, until the file is delivered or 10 minutes pass with no request.
          The response is then always an attachment.'
        in: query
        name: downloadToken
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "422":
          description: Image too large to convert
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
        "503":
          description: Every folder zip slot is busy, or no JPEG conversion slot came
            free; retry after the Retry-After header
          headers:
            Retry-After:
              description: seconds to wait before retrying
              type: integer
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Download a file or folder
      tags:
      - files
  /files/download-archive-file:
    get:
      description: Reads the specified entry from the archive and streams it to the
        client. No data is extracted to disk. With format=jpeg an image entry other
        than camera RAW is converted and served as image/jpeg; every other entry is
        served as it is. An archive that trips a safety limit (entry count, entry
        or total decompressed size, folder depth), names an entry outside itself,
        or needs a password is refused with 400 and a message saying which.
      parameters:
      - description: Path to the archive file (relative to device files directory)
        in: query
        name: filePath
        required: true
        type: string
      - description: Path of the entry inside the archive
        in: query
        name: entryPath
        required: true
        type: string
      - description: Device serial number
        in: query
        name: serial
        type: string
      - description: Output format conversion ('jpeg' converts HEIC, TIFF, BMP and
          other decodable images to JPEG)
        in: query
        name: format
        type: string
      - description: 'Token from POST /files/download-token, for a browser link that
          cannot send an Authorization header. It is good for one download: the first
          request, then retries that resume it with a Range header or start it over
          without one, until the file is delivered or 10 minutes pass with no request.
          The response is then always an attachment.'
        in: query
        name: downloadToken
        type: string
      produces:
      - application/octet-stream
      - image/jpeg
      responses:
        "200":
          description: File content
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Entry not found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "422":
          description: Image too large to convert
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
        "503":
          description: Server busy converting other images
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Download a single file from inside an archive
      tags:
      - files
  /files/download-token:
    post:
      description: 'Issues a token that authenticates one download by GET /files/download
        (or /files/download-archive-file, where filePath is the archive) of the same
        filePath and serial, passed as the downloadToken query parameter. A browser
        link cannot send an Authorization header; this lets the web client hand the
        download to the browser, which streams it to disk. The token is good for one
        download: the first request, then retries of an interrupted one, resuming
        with a Range header or starting over without one, until the file is delivered
        or 10 minutes pass with no request. A folder is zipped on the fly and cannot
        be resumed. The token runs as the caller, makes the response an attachment,
        and expires unused after about a minute. Needs read access on the path.'
      parameters:
      - description: File path the token is for
        in: query
        name: filePath
        required: true
        type: string
      - description: Device serial number the token is for
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.createDownloadTokenResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Issue a download token
      tags:
      - files
  /files/export/pptx:
    get:
      description: 'Streams a .qslide back as a .pptx attachment, one slide per slide
        in show order. Shapes, lines and arrows, rich text, pictures, groups, rotation,
        stacking order, backgrounds and speaker notes carry across. Pictures are read
        from the files they name on the same device and embedded; one the caller cannot
        read, or that is missing, too large, or not a PNG, JPEG, GIF or BMP, is drawn
        as a gray placeholder with its alt text. Only reads: nothing is written beside
        the presentation. Needs read access on the .qslide.'
      parameters:
      - description: Path to the .qslide file to export
        in: query
        name: filePath
        required: true
        type: string
      - description: Device serial number
        in: query
        name: serial
        type: string
      produces:
      - application/vnd.openxmlformats-officedocument.presentationml.presentation
      responses:
        "200":
          description: The presentation
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Download a Quark presentation as a PowerPoint file
      tags:
      - files
  /files/export/xlsx:
    get:
      description: 'Streams a .qsheet back as an .xlsx attachment, one worksheet per
        tab in tab order. Values, bold, italic, colors, alignment, number formats,
        column widths and frozen panes carry across; formulas are written as their
        text, since the editor''s formula dialect is not Excel''s and the server has
        no evaluator to supply the cached results Excel expects. Only reads: nothing
        is written beside the sheet. Needs read access on the .qsheet.'
      parameters:
      - description: Path to the .qsheet file to export
        in: query
        name: filePath
        required: true
        type: string
      - description: Device serial number
        in: query
        name: serial
        type: string
      produces:
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        "200":
          description: The workbook
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Download a Quark spreadsheet as an Excel workbook
      tags:
      - files
  /files/extract:
    post:
      description: Extracts a zip, tar, compressed tar (gz, bz2, xz, zst), rar or
        7z archive, or a cbz, cb7, jar, apk or whl, into a new folder beside it named
        after the archive without its extension, numbered when that name is taken;
        a bare .gz, .bz2, .xz or .zst decompresses to a new file beside it. Nothing
        appears under the new name until the extraction is complete. Needs read access
        on the archive and write access on its directory; the caller owns what is
        extracted. An archive that trips a safety limit (entry count, entry or total
        decompressed size, folder depth), names an entry outside itself, or needs
        a password is refused with 400 and a message saying which.
      parameters:
      - description: Path to the archive to extract
        in: query
        name: filePath
        required: true
        type: string
      - description: Device serial number
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Extract an archive in place
      tags:
      - files
  /files/folder/{folderDir}:
    post:
      consumes:
      - multipart/form-data
      description: Enqueue create-folder operation under the given folder directory.
        Needs write access on that directory; the caller owns the new folder.
      parameters:
      - description: Folder directory
        in: path
        name: folderDir
        required: true
        type: string
      - description: Name of the new folder
        in: formData
        name: folderName
        required: true
        type: string
      - description: Device serial number to create folder on
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Ok
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Create a new folder
      tags:
      - files
  /files/import/pptx:
    post:
      description: 'Reads a .pptx (or .pptm or .ppsx) and writes it as a .qslide,
        the format the Slides editor opens, in rootDir — the PowerPoint file''s own
        folder when rootDir is left out. Its pictures are copied into a <name>_media
        folder beside the presentation. Nothing is overwritten: a name already taken
        is kept, and the import lands under the next free numbered name, as Talk_(1).qslide.
        What the editor cannot show — charts, tables, SmartArt, video, animations
        — is skipped and listed in the warnings, slide by slide. The PowerPoint file
        itself is left untouched. Needs read access on it and write access on rootDir;
        the caller owns what the import created.'
      parameters:
      - description: Path to the .pptx file to import
        in: query
        name: filePath
        required: true
        type: string
      - description: Folder to write the presentation into; defaults to the .pptx's
          folder
        in: query
        name: rootDir
        type: string
      - description: Device serial number
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.ImportPptxJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Import a PowerPoint file as a Quark presentation
      tags:
      - files
  /files/list-archive:
    get:
      description: Opens the archive at filePath and returns the direct children of
        subPath as FileNodeJSON entries. No data is extracted to disk — only archive
        headers are read. An archive that trips a safety limit (entry count, entry
        or total decompressed size, folder depth), names an entry outside itself,
        or needs a password is refused with 400 and a message saying which.
      parameters:
      - description: Path to the archive file (relative to device files directory)
        in: query
        name: filePath
        required: true
        type: string
      - description: Virtual subdirectory inside the archive to list (empty = root)
        in: query
        name: subPath
        type: string
      - description: Device serial number
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_files.FileNodeJSON'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List contents of an archive file at a given virtual path
      tags:
      - files
  /files/recent:
    get:
      description: Returns files sorted by modification time (newest first) across
        all managed devices.
      parameters:
      - description: Maximum number of files to return (default 20, max 200)
        in: query
        name: limit
        type: integer
      - collectionFormat: csv
        description: Filter by device serial(s)
        in: query
        items:
          type: string
        name: serial
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_files.FileNodeJSON'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List recently uploaded files
      tags:
      - files
  /files/search:
    get:
      description: searches for a file across all managed devices for the given search
        term. If deviceSerial is empty, search across all devices. Otherwise, only
        for the specified device. Returns at most 500 files, only ones the caller
        can read; an empty search term returns an empty list
      parameters:
      - description: Search term to find; empty finds nothing
        in: query
        name: query
        type: string
      - description: Device serial number to filter by
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_files.FileNodeJSON'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Searches for files
      tags:
      - files
  /files/search/content:
    get:
      description: |-
        Full-text search over indexed file contents: FTS5 on SQLite, a tsvector on PostgreSQL, which ranks differently.
        Only text-based file formats are indexed (.txt, .md, .csv, .yaml, .json, etc.).
        Binary formats (images, video, PDF) are not indexed.
        Returns up to `limit` results ordered by relevance rank.
      parameters:
      - description: 'Search query (FTS5 syntax: words, AND/OR/NOT, \'
        in: query
        name: q
        required: true
        type: string
      - description: Maximum results to return (default 50, max 200)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_files.ContentSearchResult'
            type: array
        "400":
          description: Bad Request — missing query
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Search file contents
      tags:
      - files
  /files/stat:
    get:
      description: 'Returns filesystem metadata for the given files-relative path:
        whether it is a directory and its file type. Useful for deep-link resolution
        when the path extension alone is ambiguous (e.g. a folder named "things.qdoc").'
      parameters:
      - description: Files-relative path to stat
        in: query
        name: filePath
        required: true
        type: string
      - description: Device serial number
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.StatFileJSON'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Stat a file or directory
      tags:
      - files
  /files/upload:
    post:
      consumes:
      - multipart/form-data
      description: Upload one or more files via multipart/form-data. Needs write access
        on the top-level directory; the caller owns each file the upload creates.
        A name already in use is a 409 unless overwrite or keepBoth says what to do
        about it. Overwriting a .qslide, .qsheet or .qdoc on the internal device first
        snapshots its old content into its version history. Answers with the files-relative
        path each file landed at, after any keepBoth rename. A photo or video's client-rendered
        thumbnail (JPEG, long edge 400) may follow its file as a part named thumbnail
        whose filename is the file's; one that names no earlier file, or is not a
        valid JPEG, is skipped. A request with no part named files is a 400.
      parameters:
      - description: Device serial number to upload to
        in: query
        name: serial
        type: string
      - description: Replace a file of the same name
        in: query
        name: overwrite
        type: boolean
      - description: Land under the first free name, e.g. file_(1).txt, when the name
          is taken
        in: query
        name: keepBoth
        type: boolean
      - collectionFormat: multi
        description: One file per part; repeat the part to upload more than one
        in: formData
        items:
          type: file
        name: files
        required: true
        type: array
      - description: Thumbnail JPEG for the file of the same filename sent before
          it
        in: formData
        name: thumbnail
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.uploadFilesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Upload files to the top-level directory
      tags:
      - files
  /files/upload-session:
    post:
      consumes:
      - application/json
      description: 'Reserve a session for one file; the bytes follow as chunks on
        PUT. Needs write access on the directory the file lands in. The session belongs
        to the caller: it is not found for anyone else. A name already in use is a
        409 unless overwrite or keepBoth says what to do about it.'
      parameters:
      - description: File the session will carry
        in: body
        name: session
        required: true
        schema:
          $ref: '#/definitions/v0_files.createUploadSessionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.createUploadSessionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/serverutil.Response'
        "429":
          description: Too Many Requests — too many sessions are open; finish or cancel
            one first
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Open a resumable upload session
      tags:
      - files
  /files/upload-session/{sessionId}:
    delete:
      description: Drops the session and the bytes staged for it
      parameters:
      - description: Upload session id
        in: path
        name: sessionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Abandon a resumable upload session
      tags:
      - files
    get:
      description: Returns the committed offset a resuming client continues from
      parameters:
      - description: Upload session id
        in: path
        name: sessionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.uploadSessionStatusResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Ask what a resumable upload has committed
      tags:
      - files
    put:
      consumes:
      - application/octet-stream
      description: Append the chunk named by Content-Range; the last one commits the
        file, and the caller owns it if it is new. A commit that replaces a .qslide,
        .qsheet or .qdoc on the internal device first snapshots its old content into
        its version history. A session opened by someone else is not found. A 409
        carrying X-Upload-Offset is a chunk out of step; one without it is a name
        already in use. A photo or video's client-rendered thumbnail goes to PUT /thumbnails/{filePath}
        once the last chunk answers with where the file landed.
      parameters:
      - description: Upload session id
        in: path
        name: sessionId
        required: true
        type: string
      - description: Byte range of this chunk, e.g. bytes 0-8388607/20971520
        in: header
        name: Content-Range
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.uploadChunkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Send one chunk of a resumable upload
      tags:
      - files
  /files/upload/{rootDir}:
    post:
      consumes:
      - multipart/form-data
      description: Upload one or more files via multipart/form-data. Needs write access
        on the directory; the caller owns each file the upload creates. A name already
        in use is a 409 unless overwrite or keepBoth says what to do about it. Overwriting
        a .qslide, .qsheet or .qdoc on the internal device first snapshots its old
        content into its version history. Answers with the files-relative path each
        file landed at, after any keepBoth rename. A photo or video's client-rendered
        thumbnail (JPEG, long edge 400) may follow its file as a part named thumbnail
        whose filename is the file's; one that names no earlier file, or is not a
        valid JPEG, is skipped. A request with no part named files is a 400.
      parameters:
      - description: Directory to upload into
        in: path
        name: rootDir
        required: true
        type: string
      - description: Device serial number to upload to
        in: query
        name: serial
        type: string
      - description: Replace a file of the same name
        in: query
        name: overwrite
        type: boolean
      - description: Land under the first free name, e.g. file_(1).txt, when the name
          is taken
        in: query
        name: keepBoth
        type: boolean
      - collectionFormat: multi
        description: One file per part; repeat the part to upload more than one
        in: formData
        items:
          type: file
        name: files
        required: true
        type: array
      - description: Thumbnail JPEG for the file of the same filename sent before
          it
        in: formData
        name: thumbnail
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_files.uploadFilesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Upload files to a nested directory
      tags:
      - files
  /health:
    get:
      description: 'Returns current hardware health: CPU, memory, disk usage and temperature.
        Sets healthy=false with alert messages when any metric exceeds its critical
        threshold, or when the database (SQLite or PostgreSQL) does not answer a ping
        within 2 seconds.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_health.HealthJSON'
      security:
      - BearerAuth: []
      summary: Get system health status
      tags:
      - health
  /hostname:
    get:
      description: The device's hostname, the name it answers to on the local network
        when that differs (another device already had the name, so Avahi took the
        next free one), and whether this Quark can be renamed. A Quark that is not
        the installed Linux service reports available false with a reason. Admin-only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_hostname.hostnameResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get the device hostname
      tags:
      - hostname
    put:
      consumes:
      - application/json
      description: 'Sets the device''s hostname with no reboot, and publishes hostname_changed.
        The device then answers to the new name under .local, advertises itself as
        "Quark on" that name, and serves a regenerated TLS certificate that covers
        the new name, so an app that saved the old address has to move to the new
        one. hostname is one RFC 1123 label: 1 to 63 lowercase letters, digits or
        hyphens, with at least one letter and no hyphen at either end. advertisedHostname
        in the answer differs from hostname when another device already had the name;
        that can take a second to show, so read GET /hostname afterwards. Admin-only.'
      parameters:
      - description: The new hostname
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_hostname.setHostnameBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_hostname.hostnameResponse'
        "400":
          description: Not a valid hostname
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: This Quark can't be renamed
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Rename the device
      tags:
      - hostname
  /jobs:
    get:
      description: Returns the jobs of the requested kinds the caller may see, newest
        first, finished ones included. An admin sees every job; anyone else sees the
        jobs they queued whose file they can still read, with error left blank. This
        is the source of truth for job state; the job_* events are a hint to refresh
        and can be dropped.
      parameters:
      - collectionFormat: multi
        description: Job kinds to list; repeat for more than one (kind=video-transcode&kind=...)
        in: query
        items:
          type: string
        name: kind
        required: true
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/jobutil.Job'
            type: array
        "400":
          description: Bad Request — kind is missing, empty, or not a registered kind
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List background jobs
      tags:
      - jobs
  /jobs/{id}:
    delete:
      description: Cancels a pending or running job and returns it, now canceled.
        A pending job never runs; a running job is stopped and cleans up after itself.
        Only the account that queued the job, or an admin, may cancel it; any other
        caller gets 404.
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jobutil.Job'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Conflict — the job has already finished
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Cancel a background job
      tags:
      - jobs
    get:
      description: Returns one background job by id. A caller who is not an admin
        gets only a job they queued whose file they can still read, with error left
        blank; any other job is 404.
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jobutil.Job'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get a background job
      tags:
      - jobs
  /jobs/{id}/retry:
    post:
      description: Resets a failed job to pending so it runs again. It keeps its id
        and createdAt; progress, error, startedAt, and finishedAt are cleared, and
        the returned jobId is the same id. Only the account that queued the job, or
        an admin, may retry it; any other caller gets 404. The job runs as the account
        that queued it, which must still be active and able to write the folder of
        the file the job works on, or the retry is refused with 403. A retry whose
        inputs no longer exist, such as a transcode of a video that was moved or deleted,
        is refused with 422.
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/v0_jobs.retryJobResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden — the account that queued the job can no longer sign
            in or write the folder
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Conflict — only a failed job can be retried, and a job already
            reset by a retry is no longer failed
          schema:
            $ref: '#/definitions/serverutil.Response'
        "422":
          description: Unprocessable Entity — the job's inputs no longer exist
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Retry a background job
      tags:
      - jobs
  /music/albums:
    get:
      description: Returns a page of albums ordered by album artist and title, and
        how many there are. An album is listed when the caller can read one of its
        tracks, and its counts, year and cover come from those tracks alone. coverSerial
        and coverPath name the track to ask the thumbnail endpoint for.
      parameters:
      - description: Keep one album artist's albums, compared without case; empty
          names the untagged artist
        in: query
        name: artist
        type: string
      - description: Albums to skip
        in: query
        name: offset
        type: integer
      - description: 'Page size: 50 when absent, at most 200'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_music.AlbumsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List music albums
      tags:
      - music
  /music/artists:
    get:
      description: Returns a page of album artists by name, and how many there are,
        counted over the tracks the caller can read.
      parameters:
      - description: Artists to skip
        in: query
        name: offset
        type: integer
      - description: 'Page size: 50 when absent, at most 200'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_music.ArtistsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List music artists
      tags:
      - music
  /music/genres:
    get:
      description: Returns every genre by name, counted over the tracks the caller
        can read.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_music.GenresResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List music genres
      tags:
      - music
  /music/rescan:
    post:
      description: Queues a full scan of every device, which reads each changed audio
        file and drops the tracks whose files are gone. Its progress shows as a music_rescan
        job. Admin only.
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/jobutil.Job'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Rescan the music library
      tags:
      - music
  /music/search:
    get:
      description: Matches the query against title, artist, album artist, album and
        genre, best ranked first, and returns only tracks the caller can read. The
        snippet is tag text with the matched terms in <b>…</b>; escape it before rendering
        it as HTML. Answers 501 when the database is PostgreSQL (#2958).
      parameters:
      - description: Search text; FTS5 column filters such as artist:nina pass through
        in: query
        name: q
        required: true
        type: string
      - description: 'Most results: 50 when absent, at most 200'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_music.SearchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Search the music library
      tags:
      - music
  /music/status:
    get:
      description: Returns how many tracks the caller can read, when the last full
        scan finished, and the scan pending or running now, so an empty Music page
        can say "scanning" rather than "no music".
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/musicutil.StatusResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get the music library's status
      tags:
      - music
  /music/tracks:
    get:
      description: 'Returns a sorted page of the tracks the caller can read, and how
        many there are. The default order is album order: album artist, album, disc,
        track; every sort breaks ties that way.'
      parameters:
      - description: Keep one album's tracks
        in: query
        name: albumKey
        type: string
      - description: Keep one album artist's tracks, compared without case; empty
          names the untagged artist
        in: query
        name: artist
        type: string
      - description: Keep one genre's tracks, compared without case; empty names the
          untagged genre
        in: query
        name: genre
        type: string
      - description: Sort key; album order when absent
        enum:
        - title
        - artist
        - album
        - added
        - year
        in: query
        name: sort
        type: string
      - description: Sort direction
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      - description: Tracks to skip
        in: query
        name: offset
        type: integer
      - description: 'Page size: 50 when absent, at most 200'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_music.TracksResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List music tracks
      tags:
      - music
  /notifications:
    get:
      description: 'Returns the caller''s current notifications. The list is derived
        on each request and not stored, so a notification is there for as long as
        its condition holds. An admin gets backup_due while this Quark has no completed
        snapshot backup on record, and backup_stale, with lastBackupAt, once the last
        one is 30 days old; other accounts get neither. A type listed in the caller''s
        disabledNotifications setting (PUT /settings/me) is left out. link is the
        app route to open. There is no notification event: refetch on backup_completed,
        after changing your own settings, and when the app comes back to the foreground.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/notificationutil.ListResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List your notifications
      tags:
      - notifications
  /photos:
    get:
      description: Finds all photos across all managed devices with pagination support.
        Under sort=taken each photo carries its EXIF capture date as takenAt, read
        on the spot for a photo never read before, and pendingDates counts those left
        for a later listing. q keeps the photos whose file name contains that text,
        ignoring case, and total counts those matches.
      parameters:
      - description: Pagination offset (default 0)
        in: query
        name: offset
        type: integer
      - description: Page size (default 50, max 200)
        in: query
        name: limit
        type: integer
      - description: Device serial to filter by
        in: query
        name: serial
        type: string
      - description: 'Sort field: added (date added), taken (date taken) or name (default
          added)'
        in: query
        name: sort
        type: string
      - description: 'Sort order: asc or desc (default desc)'
        in: query
        name: order
        type: string
      - description: File name substring to keep, ignoring case. Blank lists the whole
          library
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_photos.PaginatedPhotosResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List photos
      tags:
      - photos
  /photos/copy:
    post:
      consumes:
      - application/json
      description: Creates a copy of the photo in the same directory with a non-conflicting
        name (e.g. photo_copy.jpg). Needs read access on the photo and write access
        on its folder; the caller owns the copy.
      parameters:
      - description: Copy request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_photos.copyPhotoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_photos.copyPhotoResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Duplicate a photo file
      tags:
      - photos
  /photos/duplicates:
    get:
      description: Returns groups of duplicate photos, each photo in at most one group.
        A group is exact when every photo shares a SHA-256 content hash, and near
        when their perceptual dHashes are within the threshold. Each group carries
        maxDistance, the largest Hamming distance between any two of its dHashes (0
        for exact). Exact groups come first, then near groups by ascending maxDistance;
        ties sort by first photo, and photos within a group by device, then path.
        Photos are hashed when a thumbnail is rendered or uploaded, and a pass at
        server start hashes the rest of the library; trashed photos and photos no
        longer on disk are left out.
      parameters:
      - description: Hamming distance threshold for near-duplicates (default 10, max
          20)
        in: query
        name: threshold
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              groups:
                items:
                  $ref: '#/definitions/photoutil.DuplicateGroup'
                type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List duplicate photos
      tags:
      - photos
  /photos/favorite:
    get:
      description: Returns whether the specified photo is in the caller's own favorites.
        Needs read access on the photo.
      parameters:
      - description: Device serial
        in: query
        name: serial
        type: string
      - description: Relative path to the photo
        in: query
        name: relPath
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_favorites.favoriteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Check if a photo is favorited
      tags:
      - favorites
    post:
      consumes:
      - application/json
      description: Adds the photo to the caller's own favorites if not already favorited;
        removes it otherwise. Needs read access on the photo.
      parameters:
      - description: Photo reference
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_favorites.favoriteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_favorites.favoriteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Toggle a photo favorite
      tags:
      - favorites
  /photos/favorites:
    get:
      description: Returns the photos the caller has favorited and can still read,
        newest first. Every account has its own favorites, admins included.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v0_favorites.favoriteItemJSON'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List all favorited photos
      tags:
      - favorites
  /photos/index-status:
    get:
      description: 'Admin only. Reports the background pass that hashes and dates
        every library photo on this device: how many photos the library holds, how
        many have both hashes (which duplicate detection needs), how many have had
        their capture date read, how many failed and the first 500 of those with a
        reason (undecodable, missing_converter, too_large or unreadable), when a pass
        last finished, and whether one is running or paused. The state is in memory:
        a restart forgets a pause and starts a fresh pass that skips what is already
        indexed. photo_index_changed events say when to fetch it again.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/photoutil.IndexStatusResult'
        "403":
          description: Not an admin
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get the photo library index status
      tags:
      - photos
  /photos/index/pause:
    post:
      description: Admin only. Holds the background pass that hashes and dates library
        photos before its next photo, leaving every IO slot to requests; the photo
        being read finishes first. A pass that has not started holds before its first
        photo. Pausing a paused pass changes nothing. The pause lasts until resumed
        or the server restarts, and publishes photo_index_changed.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/photoutil.IndexStatusResult'
        "403":
          description: Not an admin
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Pause the photo library index pass
      tags:
      - photos
  /photos/index/resume:
    post:
      description: Admin only. Lets a paused photo library index pass carry on from
        the photo it stopped before. Resuming a pass that is not paused changes nothing.
        Publishes photo_index_changed.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/photoutil.IndexStatusResult'
        "403":
          description: Not an admin
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Resume the photo library index pass
      tags:
      - photos
  /photos/metadata:
    get:
      description: Returns EXIF, file info, and the caller's own favorite state and
        album membership for the specified photo.
      parameters:
      - description: Device serial
        in: query
        name: serial
        type: string
      - description: Relative path to the photo file
        in: query
        name: relPath
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_photos.PhotoMetadataJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get metadata for a single photo
      tags:
      - photos
  /photos/rotate:
    post:
      consumes:
      - application/json
      description: Persists the viewer rotation (0/1/2/3 × 90° CW) for a photo server-side.
        Needs write access on the photo.
      parameters:
      - description: Rotation request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_photos.rotatePhotoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Save the rotation for a photo
      tags:
      - photos
  /playback:
    get:
      description: Returns the caller's own resume position and watched flag for the
        video, all zero with no updatedAt when nothing is stored. Needs read access
        on the video.
      parameters:
      - description: Files-relative path of the video
        in: query
        name: relPath
        required: true
        type: string
      - description: Device serial number; empty for the internal drive
        in: query
        name: deviceSerial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/playbackutil.State'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get the caller's playback state for a video
      tags:
      - playback
    put:
      consumes:
      - application/json
      description: Stores where the caller's player has got to. A position at or past
        95% of the duration marks the video watched and resets the position to 0;
        an earlier one keeps the stored watched flag. Needs read access on the video.
      parameters:
      - description: Video reference, position and duration in milliseconds
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_playback.savePlaybackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/playbackutil.State'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Save the caller's resume position for a video
      tags:
      - playback
  /playback/watched:
    put:
      consumes:
      - application/json
      description: Marking a video watched resets the caller's resume position to
        0 and keeps the stored duration. Marking it unwatched forgets the caller's
        state for it, resume position included, and returns the zero state. Needs
        read access on the video.
      parameters:
      - description: Video reference and the watched flag
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_playback.setWatchedRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/playbackutil.State'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Mark a video watched or unwatched for the caller
      tags:
      - playback
  /previews/document:
    get:
      description: 'Streams a .docx, .docm or .odt document as NDJSON, one block per
        line, for the read-only document viewer: a meta line, then headings, paragraphs,
        list items, tables, images (naming the part GET /previews/part serves), page
        breaks and omitted markers, then an end line with word, character and paragraph
        counts, warnings, and truncated set when a limit stopped the document early.
        The end line is always last: a stream without one was cut off by a server
        error. Nothing the document contains is executed or fetched. A file that is
        not what its name says is a 400. Needs read access on the document.'
      parameters:
      - description: Path to the document
        in: query
        name: filePath
        required: true
        type: string
      - description: Device serial number
        in: query
        name: serial
        type: string
      produces:
      - application/x-ndjson
      responses:
        "200":
          description: NDJSON block stream
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
        "503":
          description: Server busy converting other documents
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Preview a word-processing document
      tags:
      - previews
  /previews/part:
    get:
      description: 'Streams one image a document preview''s image block names. This
        is not a general zip browser: only a PNG, JPEG, GIF or WebP entry under the
        document''s media folder (word/media/ for .docx and .docm, Pictures/ for .odt),
        named without any climbing, is served, and anything else is a 404. Needs read
        access on the document.'
      parameters:
      - description: Path to the document
        in: query
        name: filePath
        required: true
        type: string
      - description: The image's entry inside the document, e.g. word/media/image1.png
        in: query
        name: part
        required: true
        type: string
      - description: Device serial number
        in: query
        name: serial
        type: string
      produces:
      - image/png
      - image/jpeg
      - image/gif
      - image/webp
      responses:
        "200":
          description: Image content
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get an image from inside a document
      tags:
      - previews
  /previews/properties:
    get:
      description: 'Returns what a document says about itself: title, author, subject,
        created and modified dates, and the page, word, character, slide and sheet
        counts its authoring application last saved, as {title, author, subject, created,
        modified, pages, words, characters, slides, sheets, application, countsSource}.
        Fields the document does not carry are left out, and countsSource is always
        "saved": the counts are not recounted, and pages cannot be, since that needs
        a layout engine. Only the small metadata entry is read (docProps for DOCX,
        PPTX and XLSX, meta.xml for ODT, ODP and ODS, the \info group for RTF), never
        the body. A file that is not what its name says, or whose metadata is oversize,
        is a 400. Needs read access on the document.'
      parameters:
      - description: Path to the document
        in: query
        name: filePath
        required: true
        type: string
      - description: Device serial number
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/docpropsutil.Properties'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get a document's properties
      tags:
      - previews
  /sbom:
    get:
      description: Returns the Go version and all embedded dependency information
        from the compiled binary
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_version.SbomJSON'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get software bill of materials
      tags:
      - version
  /settings/access-requests:
    put:
      consumes:
      - application/json
      description: Sets whether people can request an account from the sign-in page.
        Requests are on until an admin turns them off. Admin-only.
      parameters:
      - description: Whether account requests are on
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_settings.accessRequestsSetting'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v0_settings.accessRequestsSetting'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Turn account requests on or off
      tags:
      - settings
  /settings/features:
    get:
      description: Returns every registered beta feature flag with its admin-facing
        label and description, its default, the release or issue it was introduced
        in, the issue that will remove it, and whether it is on now. Open to any signed-in
        user, so the app can hide a feature that is off.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/featureflagutil.ListFlagsResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List the beta feature flags
      tags:
      - settings
  /settings/features/{key}:
    put:
      consumes:
      - application/json
      description: Sets whether the beta feature named by key is on for everyone on
        the Quark, and publishes feature_flag_changed. Turning a feature off hides
        it; nothing it stored is deleted. A key the registry does not declare, including
        a retired flag's, is 404. Admin-only.
      parameters:
      - description: Feature flag key
        in: path
        name: key
        required: true
        type: string
      - description: Whether the feature is on
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v0_settings.featureSetting'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/featureflagutil.FlagState'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: unknown feature flag
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Turn a beta feature flag on or off
      tags:
      - settings
  /settings/me:
    get:
      description: Returns the settings the caller chose for their own account. themeColor
        overrides the Quark's theme color; the empty string, which is also what an
        account that has chosen nothing gets, means follow the Quark. disabledNotifications
        lists the notification types the caller turned off, and is left out when every
        type is on.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/usersettingsutil.Settings'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get your own settings
      tags:
      - settings
    put:
      consumes:
      - application/json
      description: 'Replaces the settings of the caller''s own account with the body.
        themeColor is a preset name (a lowercase letter, then up to 31 lowercase letters,
        digits or hyphens) or a custom color as lowercase #rrggbb; the empty string,
        or leaving it out, means follow the Quark. disabledNotifications lists the
        notification types (backup_due, backup_stale) the caller does not want, each
        at most once; because the body replaces the settings whole, leaving it out
        turns every type back on. A field the settings do not have, an unknown notification
        type and a repeated one are refused. Publishes no event: the change concerns
        only the caller.'
      parameters:
      - description: The settings
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/usersettingsutil.Settings'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/usersettingsutil.Settings'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Replace your own settings
      tags:
      - settings
  /settings/public:
    get:
      description: 'Returns the Quark''s settings that are safe to show before sign-in.
        Needs no session, so the sign-in page can read them. themeColor is the theme
        color an admin chose for the Quark, a preset name or a lowercase #rrggbb color,
        or the empty string when no admin has chosen.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
