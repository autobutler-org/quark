      - BearerAuth: []
      summary: Get system health status
      tags:
      - health
  /jobs:
    get:
      description: Returns the jobs of the requested kinds the caller may see, newest
        first, finished ones included. An admin sees every job; anyone else sees the
        jobs they queued whose file they can still read, with error left blank. This
        is the source of truth for job state; the job_* events are a hint to refresh
        and can be dropped.
      parameters:
      - collectionFormat: multi
        description: Job kinds to list; repeat for more than one (kind=video-transcode&kind=...)
        in: query
        items:
          type: string
        name: kind
        required: true
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/jobutil.Job'
            type: array
        "400":
          description: Bad Request — kind is missing, empty, or not a registered kind
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: List background jobs
      tags:
      - jobs
  /jobs/{id}:
    delete:
      description: Cancels a pending or running job and returns it, now canceled.
        A pending job never runs; a running job is stopped and cleans up after itself.
        Only the account that queued the job, or an admin, may cancel it; any other
        caller gets 404.
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jobutil.Job'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Conflict — the job has already finished
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Cancel a background job
      tags:
      - jobs
    get:
      description: Returns one background job by id. A caller who is not an admin
        gets only a job they queued whose file they can still read, with error left
        blank; any other job is 404.
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jobutil.Job'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Get a background job
      tags:
      - jobs
  /jobs/{id}/retry:
    post:
      description: Resets a failed job to pending so it runs again. It keeps its id
        and createdAt; progress, error, startedAt, and finishedAt are cleared, and
        the returned jobId is the same id. Only the account that queued the job, or
        an admin, may retry it; any other caller gets 404. The job runs as the account
        that queued it, which must still be active and able to write the folder of
        the file the job works on, or the retry is refused with 403. A retry whose
        inputs no longer exist, such as a transcode of a video that was moved or deleted,
        is refused with 422.
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/v0_jobs.retryJobResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "403":
          description: Forbidden — the account that queued the job can no longer sign
            in or write the folder
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "409":
          description: Conflict — only a failed job can be retried, and a job already
            reset by a retry is no longer failed
          schema:
            $ref: '#/definitions/serverutil.Response'
        "422":
          description: Unprocessable Entity — the job's inputs no longer exist
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      security:
      - BearerAuth: []
      summary: Retry a background job
      tags:
      - jobs
  /photos:
