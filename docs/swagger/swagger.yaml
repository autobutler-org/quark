basePath: /api/v0
definitions:
  accessutil.Grant:
    properties:
      builtin:
        description: Builtin marks the everyone group.
        type: boolean
      from:
        description: |-
          From is the path the row is on. A grant whose From is not the path
          asked about is inherited from that folder, and is changed there.
        type: string
      groupId:
        description: GroupID is set for a grant to a group.
        type: integer
      level:
        description: Level is read, write or owner.
        type: string
      name:
        description: Name is the account's username or the group's name.
        type: string
      userId:
        description: UserID is set for a grant to an account.
        type: integer
    type: object
  accessutil.GrantsResult:
    properties:
      canGrantOwner:
        description: |-
          CanGrantOwner is whether the caller may grant, change or revoke owner.
          Every owner may, so it equals CanManage.
        type: boolean
      canManage:
        description: |-
          CanManage is whether the caller may change the grants. Only a caller who
          may manage sees them at all, so it is true in every result.
        type: boolean
      deviceSerial:
        type: string
      grants:
        description: |-
          Grants lists the rows on the path, then one inherited grant per principal
          holding the highest level any parent folder gives it.
        items:
          $ref: '#/definitions/accessutil.Grant'
        type: array
      relPath:
        type: string
    type: object
  accessutil.ListPrincipalsResult:
    properties:
      groups:
        items:
          $ref: '#/definitions/accessutil.PrincipalGroup'
        type: array
      users:
        items:
          $ref: '#/definitions/accessutil.PrincipalUser'
        type: array
    type: object
  accessutil.ListSharedWithMeResult:
    properties:
      items:
        items:
          $ref: '#/definitions/accessutil.SharedItem'
        type: array
    type: object
  accessutil.PrincipalGroup:
    properties:
      builtin:
        description: Builtin marks the everyone group.
        type: boolean
      id:
        type: integer
      name:
        type: string
    type: object
  accessutil.PrincipalUser:
    properties:
      id:
        type: integer
      username:
        type: string
    type: object
  accessutil.SharedItem:
    properties:
      deviceSerial:
        description: DeviceSerial names the device; empty is the internal one.
        type: string
      level:
        description: Level is read, write or owner.
        type: string
      owner:
        description: |-
          Owner is the username of the account, or the name of the group, that
          owns the item. It is empty when no owner row covers the path.
        type: string
      relPath:
        type: string
    type: object
  authutil.SessionInfo:
    properties:
      createdAt:
        type: string
      current:
        description: Current marks the session the request was authenticated with.
        type: boolean
      expiresAt:
        type: string
      id:
        type: string
      lastUsedAt:
        description: |-
          LastUsedAt is when the session last renewed itself; renewal is
          debounced, so it can trail the newest request.
        type: string
    type: object
  backup.BackupJob:
    properties:
      bytesCopied:
        type: integer
      completedAt:
        type: string
      createdAt:
        type: string
      errorMsg:
        type: string
      filesCopied:
        type: integer
      filesSkipped:
        type: integer
      id:
        type: string
      progress:
        type: number
      sourceDevices:
        items:
          $ref: '#/definitions/backup.SourceDeviceProgress'
        type: array
      status:
        $ref: '#/definitions/backup.BackupJobStatus'
      targetDeviceSerial:
        type: string
      totalBytes:
        type: integer
      totalFiles:
        type: integer
      updatedAt:
        type: string
    type: object
  backup.BackupJobStatus:
    enum:
    - PENDING
    - SCANNING
    - COPYING
    - COMPLETED
    - FAILED
    type: string
    x-enum-varnames:
    - BackupStatusPending
    - BackupStatusScanning
    - BackupStatusCopying
    - BackupStatusCompleted
    - BackupStatusFailed
  backup.SourceDeviceProgress:
    properties:
      bytesCopied:
        type: integer
      bytesTotal:
        type: integer
      deviceName:
        type: string
      deviceSerial:
        type: string
      filesCopied:
        type: integer
      filesSkipped:
        type: integer
      filesTotal:
        type: integer
    type: object
  chatutil.Channel:
    properties:
      createdAt:
        type: string
      createdBy:
        description: |-
          CreatedBy is the account that created the channel; absent for general
          and for a channel whose creator was deleted.
        type: integer
      id:
        type: integer
      isDefault:
        description: IsDefault marks general.
        type: boolean
      isPrivate:
        description: IsPrivate is whether everyone has no row on the channel.
        type: boolean
      kind:
        description: Kind is channel; dm is reserved for direct messages (#2423).
        type: string
      lastReadMessageId:
        description: |-
          LastReadMessageID is the caller's read marker there, as PUT
          /chat/channels/{id}/read leaves it, so a session that missed
          chat_read_marker_changed can restore it (#3543). It is 0 before the
          first read and without read_messages.
        type: integer
      name:
        type: string
      permissions:
        description: |-
          Permissions is the caller's effective set: the union of every row that
          reaches them. Empty for an admin managing a channel they are not in.
        items:
          enum:
          - read_messages
          - send_messages
          - add_reactions
          - delete_messages
          - manage_channel
          - manage_members
          - manage_reactions
          type: string
        type: array
      serverId:
        type: integer
      topic:
        type: string
      unreadCount:
        description: |-
          UnreadCount is how many messages after the caller's read marker someone
          else wrote and nobody deleted (#2424). It is 0 without read_messages,
          so 0 on every channel an admin lists without being in it.
        type: integer
    type: object
  chatutil.ChannelEvent:
    properties:
      actorId:
        description: ActorID is who made the change; absent once that account is deleted.
        type: integer
      channelId:
        type: integer
      createdAt:
        type: string
      id:
        type: integer
      kind:
        description: Kind is member_set, member_removed or key_created.
        type: string
      payload:
        description: |-
          Payload is the JSON the signature covers, byte for byte: for a member
          change {"userId"|"groupId", "name", "permissions"}, for a key {"version"}.
        type: string
      signature:
        description: Signature and SignerSignKey are both absent until the actor signs.
        items:
          type: integer
        type: array
      signerSignKey:
        items:
          type: integer
        type: array
    type: object
  chatutil.CreateKeyVersionResult:
    properties:
      event:
        $ref: '#/definitions/chatutil.ChannelEvent'
      grant:
        $ref: '#/definitions/chatutil.KeyGrant'
      version:
        $ref: '#/definitions/chatutil.KeyVersion'
    type: object
  chatutil.GetChannelKeysResult:
    properties:
      currentVersion:
        description: |-
          CurrentVersion is the newest version, 0 before any exists: the first
          member client to open the channel then creates version 1.
        type: integer
      grants:
        description: Grants are the caller's own, one per version it has been given.
        items:
          $ref: '#/definitions/chatutil.KeyGrant'
        type: array
      rotationNeeded:
        description: |-
          RotationNeeded is set when someone holding the current version no longer
          holds read_messages; the next member client online creates the next one.
        type: boolean
      versions:
        items:
          $ref: '#/definitions/chatutil.KeyVersion'
        type: array
    type: object
  chatutil.GrantUpload:
    properties:
      sealedKey:
        items:
          type: integer
        type: array
      signature:
        items:
          type: integer
        type: array
      userId:
        type: integer
      version:
        type: integer
    type: object
  chatutil.KeyGrant:
    properties:
      createdAt:
        type: string
      grantedBy:
        description: GrantedBy is absent when the granter's account was deleted.
        type: integer
      granterSignKey:
        description: |-
          GranterSignKey is the granter's published Ed25519 key when the grant was
          uploaded, which Signature verifies against.
        items:
          type: integer
        type: array
      sealedKey:
        description: |-
          SealedKey is crypto_box_seal of the channel key to the member's X25519
          key.
        items:
          type: integer
        type: array
      signature:
        description: |-
          Signature is the granter's Ed25519 signature over the grant's canonical
          bytes (docs/chat-security.md).
        items:
          type: integer
        type: array
      userId:
        type: integer
      version:
        type: integer
    type: object
  chatutil.KeyVersion:
    properties:
      createdAt:
        type: string
      createdBy:
        description: CreatedBy is absent when the account that created it was deleted.
        type: integer
      version:
        type: integer
    type: object
  chatutil.Keys:
    properties:
      boxPublicKey:
        items:
          type: integer
        type: array
      createdAt:
        type: string
      kdfParams:
        description: KdfParams is the client's JSON object recording the Argon2id
          cost.
        type: object
      saltPw:
        items:
          type: integer
        type: array
      saltRp:
        items:
          type: integer
        type: array
      signPublicKey:
        items:
          type: integer
        type: array
      updatedAt:
        type: string
      wrappedByPassword:
        items:
          type: integer
        type: array
      wrappedByPhrase:
        description: WrappedByPhrase and SaltRp are both present or both absent.
        items:
          type: integer
        type: array
    type: object
  chatutil.ListChannelsResult:
    properties:
      channels:
        items:
          $ref: '#/definitions/chatutil.Channel'
        type: array
    type: object
  chatutil.ListEventsResult:
    properties:
      events:
        items:
          $ref: '#/definitions/chatutil.ChannelEvent'
        type: array
    type: object
  chatutil.ListMembersResult:
    properties:
      event:
        allOf:
        - $ref: '#/definitions/chatutil.ChannelEvent'
        description: |-
          Event is the member_set or member_removed event SetMember and
          RemoveMember recorded, for the caller to sign; absent from ListMembers.
      members:
        items:
          $ref: '#/definitions/chatutil.Member'
        type: array
    type: object
  chatutil.ListMessagesResult:
    properties:
      messages:
        items:
          $ref: '#/definitions/chatutil.Message'
        type: array
    type: object
  chatutil.ListPendingGrantsResult:
    properties:
      currentVersion:
        type: integer
      pending:
        items:
          $ref: '#/definitions/chatutil.PendingGrant'
        type: array
      rotationNeeded:
        type: boolean
    type: object
  chatutil.MarkReadResult:
    properties:
      channelId:
        type: integer
      lastReadMessageId:
        type: integer
      unreadCount:
        type: integer
    type: object
  chatutil.Member:
    properties:
      avatarUpdatedAt:
        description: |-
          AvatarUpdatedAt is an account's profile picture version in Unix
          milliseconds, absent when it has none.
        type: integer
      builtin:
        description: Builtin marks the everyone group.
        type: boolean
      groupId:
        description: GroupID is set for a group.
        type: integer
      name:
        description: Name is the account's username or the group's name.
        type: string
      permissions:
        description: Permissions is this row's set, not anyone's effective one.
        items:
          enum:
          - read_messages
          - send_messages
          - add_reactions
          - delete_messages
          - manage_channel
          - manage_members
          - manage_reactions
          type: string
        type: array
      userId:
        description: UserID is set for an account.
        type: integer
      users:
        description: |-
          Users are the active accounts in a group, everyone's being every active
          account. Absent for an account or an empty group.
        items:
          $ref: '#/definitions/chatutil.MemberUser'
        type: array
    type: object
  chatutil.MemberUser:
    properties:
      avatarUpdatedAt:
        description: |-
          AvatarUpdatedAt is the profile picture version in Unix milliseconds,
          absent when it has none.
        type: integer
      id:
        type: integer
      username:
        type: string
    type: object
  chatutil.Message:
    properties:
      authorId:
        description: AuthorID is absent once the author's account is deleted.
        type: integer
      channelId:
        type: integer
      ciphertext:
        description: |-
          Ciphertext is nonce || XChaCha20-Poly1305 output under the channel key
          of KeyVersion, with the channel id and key version as additional data
          (docs/chat-security.md). Absent once deleted.
        items:
          type: integer
        type: array
      createdAt:
        type: string
      deletedAt:
        type: string
      editedAt:
        type: string
      id:
        type: integer
      keyVersion:
        type: integer
      reactions:
        description: |-
          Reactions are the message's reactions, oldest first, in a
          ListMessages page. A deleted message has none: they go with its
          ciphertext.
        items:
          $ref: '#/definitions/chatutil.Reaction'
        type: array
    type: object
  chatutil.PendingGrant:
    properties:
      boxPublicKey:
        items:
          type: integer
        type: array
      userId:
        type: integer
      version:
        type: integer
    type: object
  chatutil.PublicKeys:
    properties:
      boxPublicKey:
        items:
          type: integer
        type: array
      signPublicKey:
        items:
          type: integer
        type: array
      userId:
        type: integer
    type: object
  chatutil.Reaction:
    properties:
      ciphertext:
        description: |-
          Ciphertext is nonce || XChaCha20-Poly1305 output under the channel key
          of KeyVersion, with the channel, key version, message and reacting
          account as additional data (docs/chat-security.md).
        items:
          type: integer
        type: array
      createdAt:
        type: string
      id:
        type: integer
      keyVersion:
        description: |-
          KeyVersion is the channel key the reaction was encrypted under, which
          needn't be its message's.
        type: integer
      messageId:
        type: integer
      userId:
        type: integer
    type: object
  chatutil.RejectGrantResult:
    properties:
      version:
        type: integer
    type: object
  chatutil.UploadGrantsResult:
    properties:
      grants:
        items:
          $ref: '#/definitions/chatutil.KeyGrant'
        type: array
    type: object
  docpropsutil.Properties:
    properties:
      application:
        type: string
      author:
        type: string
      characters:
        type: integer
      countsSource:
        description: CountsSource is always [CountsSourceSaved].
        type: string
      created:
        description: |-
          Created and Modified are RFC 3339 when the document's date parses as
          one, and the document's own text otherwise.
        type: string
      modified:
        type: string
      pages:
        type: integer
      sheets:
        type: integer
      slides:
        type: integer
      subject:
        type: string
      title:
        type: string
      words:
        type: integer
    type: object
  featureflagutil.FlagState:
    properties:
      default:
        description: Default is whether the feature is on while no admin has set the
          flag.
        type: boolean
      description:
        type: string
      enabled:
        type: boolean
      introducedIn:
        description: |-
          IntroducedIn is the release or issue the beta started at, so a flag
          that has outlived its beta is visible.
        type: string
      key:
        description: 'Key is stable: it is the flag''s name in the API and in the
          settings table.'
        type: string
      label:
        description: |-
          Label and Description are admin-facing copy. Description says what
          turning the flag off actually does.
        type: string
      sunsetIssue:
        description: SunsetIssue is the issue that removes the flag. Required.
        type: integer
    type: object
  featureflagutil.ListFlagsResult:
    properties:
      features:
        items:
          $ref: '#/definitions/featureflagutil.FlagState'
        type: array
    type: object
  feedutil.Candidate:
    properties:
      title:
        type: string
      type:
        type: string
      url:
        type: string
    type: object
  feedutil.Feed:
    properties:
      consecutiveFailures:
        type: integer
      createdAt:
        type: string
      etag:
        type: string
      folder:
        type: string
      icon:
        type: string
      id:
        type: integer
      lastError:
        type: string
      lastFetchedAt:
        type: string
      lastModified:
        type: string
      name:
        type: string
      siteLink:
        type: string
      title:
        type: string
      updatedAt:
        type: string
      url:
        type: string
    type: object
  fileversionutil.Kind:
    enum:
    - auto
    - named
    type: string
    x-enum-varnames:
    - KindAuto
    - KindNamed
  grouputil.Group:
    properties:
      builtin:
        type: boolean
      id:
        type: integer
      members:
        items:
          $ref: '#/definitions/grouputil.Member'
        type: array
      name:
        type: string
    type: object
  grouputil.Member:
    properties:
      id:
        type: integer
      username:
        type: string
    type: object
  jobutil.Job:
    properties:
      attempts:
        description: |-
          Attempts is how many times the job has started running: 0 before its
          first run. A retry leaves it alone; the next run bumps it.
        type: integer
      createdAt:
        description: CreatedAt is when the job was queued.
        type: string
      error:
        description: Error is diagnostic text for a failed job, not copy for a user.
        type: string
      finishedAt:
        description: FinishedAt is null until the job completes, fails, or is canceled.
        type: string
      id:
        type: integer
      kind:
        type: string
      lane:
        description: |-
          Lane is the concurrency lane within Kind the job runs in, such as "copy"
          for a transcode that only copies streams. It is "" for a kind with one
          lane.
        type: string
      name:
        description: Name is display text, such as "Convert vacation.mkv to MOV".
        type: string
      params:
        description: |-
          Params is the kind-specific JSON object the job was enqueued with, so a
          client can build its own label from Kind and Params.
        type: object
      progress:
        type: number
      startedAt:
        description: StartedAt is null until the job starts running.
        type: string
      status:
        allOf:
        - $ref: '#/definitions/jobutil.Status'
        enum:
        - pending
        - running
        - completed
        - failed
        - canceled
    type: object
  jobutil.Status:
    enum:
    - pending
    - running
    - completed
    - failed
    - canceled
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusRunning
    - StatusCompleted
    - StatusFailed
    - StatusCanceled
  musicutil.Album:
    properties:
      albumArtist:
        type: string
      albumKey:
        type: string
      coverPath:
        type: string
      coverSerial:
        description: |-
          CoverSerial and CoverPath name the track to ask the thumbnail endpoint
          for: one with cover art when any has it, otherwise the first.
        type: string
      durationMs:
        type: integer
      title:
        type: string
      trackCount:
        type: integer
      year:
        description: Year is the earliest tagged year among the tracks, 0 when none
          is.
        type: integer
    type: object
  musicutil.Artist:
    properties:
      albumCount:
        type: integer
      coverPath:
        type: string
      coverSerial:
        type: string
      name:
        type: string
      trackCount:
        type: integer
    type: object
  musicutil.Genre:
    properties:
      name:
        type: string
      trackCount:
        type: integer
    type: object
  musicutil.SearchResult:
    properties:
      snippet:
        description: |-
          Snippet is the best-matching tag with the matched terms in <b>…</b>.
          It is tag text from a file: escape it before rendering as HTML.
        type: string
      track:
        $ref: '#/definitions/musicutil.Track'
    type: object
  musicutil.StatusResult:
    properties:
      lastScanAt:
        description: |-
          LastScanAt is when the newest finished scan completed, null when none
          is on record.
        type: string
      scanJobId:
        description: |-
          ScanJobID is the scan pending or running now, absent when there is
          none.
        type: integer
      trackCount:
        description: TrackCount is how many tracks the caller can read.
        type: integer
    type: object
  musicutil.Track:
    properties:
      album:
        description: Album is the album title.
        type: string
      albumArtist:
        description: AlbumArtist is the album artist, the track artist when untagged.
        type: string
      albumKey:
        description: 'AlbumKey identifies the album: album artist, album, device and
          folder.'
        type: string
      artist:
        description: Artist is the track artist.
        type: string
      discNo:
        description: DiscNo is the disc number, 0 when untagged.
        type: integer
      durationExact:
        description: DurationExact is false when DurationMs is a bitrate estimate.
        type: boolean
      durationMs:
        description: DurationMs is the playing time, 0 when unknown.
        type: integer
      genre:
        description: Genre is the genre.
        type: string
      hasCover:
        description: HasCover reports embedded or folder cover art.
        type: boolean
      relPath:
        description: RelPath is the file's path within the device's files namespace.
        type: string
      serial:
        description: Serial is the device holding the file, '' for the internal drive.
        type: string
      title:
        description: Title is the tagged title, or the file name without its extension.
        type: string
      trackNo:
        description: TrackNo is the track number, 0 when untagged.
        type: integer
      year:
        description: Year is the release year, 0 when untagged.
        type: integer
    type: object
  notificationutil.ListResult:
    properties:
      notifications:
        description: Notifications is never nil, so an account with none reads [].
        items:
          $ref: '#/definitions/notificationutil.Notification'
        type: array
    type: object
  notificationutil.Notification:
    properties:
      lastBackupAt:
        description: |-
          LastBackupAt is when the last snapshot backup completed. Only
          TypeBackupStale carries it.
        type: string
      link:
        description: Link is the app route to open when the notification is tapped.
        type: string
      type:
        $ref: '#/definitions/notificationutil.Type'
    type: object
  notificationutil.Type:
    enum:
    - backup_due
    - backup_stale
    type: string
    x-enum-varnames:
    - TypeBackupDue
    - TypeBackupStale
  photoutil.AlbumRef:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  photoutil.DuplicateGroup:
    properties:
      kind:
        description: |-
          Kind is "exact" (identical content hash) or "near" (perceptual hash
          Hamming distance within the configured threshold).
        type: string
      maxDistance:
        description: |-
          MaxDistance is the largest Hamming distance between any two of the
          group's dHashes, over every photo clustered, including any the caller
          cannot read. It is 0 for an exact group.
        type: integer
      photos:
        description: Photos is the list of photos in this duplicate group.
        items:
          $ref: '#/definitions/photoutil.DuplicatePhoto'
        type: array
    type: object
  photoutil.DuplicatePhoto:
    properties:
      deviceSerial:
        type: string
      relPath:
        type: string
    type: object
  photoutil.ExifSummary:
    properties:
      aperture:
        type: number
      dateTaken:
        type: string
      focalLength:
        type: number
      iso:
        type: integer
      latitude:
        type: number
      lens:
        type: string
      longitude:
        type: number
      make:
        type: string
      model:
        type: string
      shutterSpeed:
        type: string
    type: object
  photoutil.IndexFailure:
    properties:
      reason:
        description: Reason is one of the IndexFailure* constants.
        type: string
      relPath:
        type: string
      serial:
        type: string
    type: object
  photoutil.IndexStatusResult:
    properties:
      datesRead:
        description: DatesRead is the photos whose capture date has been read.
        type: integer
      failed:
        description: Failed is the photos the current or last pass could not fully
          read.
        type: integer
      failures:
        description: Failures lists the first [MaxIndexFailures] of them.
        items:
          $ref: '#/definitions/photoutil.IndexFailure'
        type: array
      hashed:
        description: |-
          Hashed is the photos with both a perceptual and a content hash, which
          duplicate detection needs.
        type: integer
      lastRunAt:
        description: LastRunAt is when a pass last finished, nil if none has since
          start.
        type: string
      paused:
        description: Paused is whether the pass is held, or will hold when it starts.
        type: boolean
      running:
        description: Running is whether a pass is under way, paused or not.
        type: boolean
      total:
        description: Total is the photos in the library when the pass last listed
          it.
        type: integer
    type: object
