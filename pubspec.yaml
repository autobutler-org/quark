name: quark
description: "The Quark app: files, photos, documents and chat on a Quark at home."
publish_to: "none"

environment:
  sdk: ^3.11.0
  flutter: 3.47.8

# Dart pub workspace: one shared pubspec.lock and one resolution for the app,
# every package under packages/, and every example app. Members declare
# `resolution: workspace` in their own pubspec.
workspace:
  - packages/data_table
  - packages/data_table/examples/spreadsheet
  - packages/quark_formula
  - packages/quark_icons
  - packages/quark_icons/examples/icon_gallery
  - packages/quark_slides
  - packages/quark_widgets
  - packages/quark_widgets/examples/widget_gallery

dependencies:
  flutter:
    sdk: flutter

  # No Dart file imports it, but it ships the font CupertinoIcons draws from:
  # cupertino_ui's CupertinoTextField (QuarkWidget.textField on iOS), search
  # field and nav bar draw its glyphs, and cupertino_ui does not depend on it.
  cupertino_icons: ^2.0.0
  flutter_file_dialog: ^3.3.2
  flutter_web_plugins:
    sdk: flutter
  file_picker: ^13.1.0
  http: ^1.5.0
  # SHA-256 of a Quark's certificate, for pinning (#2721).
  crypto: ^3.0.7
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  open_file: ^4.0.0
  path_provider: ^2.1.6
  # The app group container, for the native autofill vault cache (#3596).
  path_provider_foundation: ^2.6.0
  video_player: ^2.6.0
  web: ^1.1.1
  photo_manager: ^3.12.0
  desktop_drop: ^0.9.0
  go_router: ^18.0.1
  # The Markdown viewer's word count walks the parsed tree (#3275). The
  # widgets package already parses with this.
  markdown: ^7.1.0
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.3
  flutter_quill: ^11.6.0
  flutter_localizations:
    sdk: flutter
  # The thumbnail disk cache's own store (#1777).
  flutter_cache_manager: ^3.4.1
  shimmer: ^4.0.0
  flutter_quill_to_pdf: ^2.3.9
  printing: ^5.15.0
  flutter_svg: ^2.3.0
  # mDNS browsing for `_quark._tcp` on iOS and Android (#2312).
  bonsoir: ^7.1.5
  data_table:
    path: packages/data_table
  quark_icons:
    path: packages/quark_icons
  quark_slides:
    path: packages/quark_slides
  quark_widgets:
    path: packages/quark_widgets

  # Thumbnails rendered with the platform decoders on iOS and Android (#2379):
  # video frames through AVAssetImageGenerator and MediaMetadataRetriever,
  # photos and HEIC re-encoded to JPEG. Imported only by
  # lib/services/mobile_thumbnail_renderer.dart, behind the client_thumbnails
  # conditional import, so web builds never load them.
  # flutter_image_compress_common is the Android/iOS implementation of
  # flutter_image_compress, depended on directly: the app-facing package also
  # endorses a web implementation, which Flutter registers in every web build
  # whether or not the app imports it.
  fc_native_video_thumbnail: ^3.0.1
  flutter_image_compress_common: ^1.1.1
  flutter_image_compress_platform_interface: ^1.1.0

  # Flutter Probe on-device agent (Android/iOS e2e). Started only when the app
  # is built with --dart-define=PROBE_AGENT=true; see lib/probe_bootstrap*.dart
  # and `make test/probe`. Kept as a regular dependency so lib/ can import it;
  # the dart-define + tree-shaking keep it inactive in normal/release builds.
  flutter_probe_agent: ^0.26.0
  sodium: ^4.1.1+1
  # The in-app PDF viewer (#1184), built on PDFium. Its web WASM ships in the
  # app bundle, so the viewer works with no internet connection.
  pdfrx: ^2.6.5
  # video_player has no Linux implementation (#3151). video_player_media_kit
  # plays through libmpv instead, and media_kit_libs_linux links the system
  # libmpv into the Linux runner. Registered for Linux only, by
  # lib/services/video_playback_backend.dart, so Android, iOS and web keep
  # their own video_player backends.
  video_player_media_kit: ^2.0.0
  media_kit_libs_linux: ^1.2.1
  # Linux upload thumbnails (#3421): a screenshot of the libmpv player's frame,
  # resized and re-encoded as JPEG with image.
  media_kit: ^1.2.6
  image: ^4.5.4
  # The phone joins the tailnet itself (#1881). hook/build.dart compiles
  # cmd/tsnetbridge for the iOS and Android targets. cspell:words ffi tsnetbridge
  code_assets: ^2.1.0
  ffi: ^2.2.0
  hooks: ^2.2.0

# desktop_drop pinned to upstream's merge commit of MixinNetwork/flutter-plugins#503
# (the #1831 fix): upstream's web handler called webkitGetAsEntry()! on every
# item in a drag, which is null for the string items a drag carries alongside
# its files (the browser's downloads menu sends text/uri-list and text/plain),
# so nothing uploaded and the drag highlight stayed stuck. The pin stays on the
# 0.8.4 API until the hosted ^0.9 migration is unblocked: desktop_drop 0.9
# needs cross_file ^0.4 while flutter_image_compress_platform_interface needs
# cross_file ^0.3.
# Drop this override once that move is done (#3640).
dependency_overrides:
  desktop_drop:
    git:
      url: https://github.com/MixinNetwork/flutter-plugins.git
      ref: 541ad007b7fa7a3316778f559415d3eb3cebfe67
      path: packages/desktop_drop

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  video_player_platform_interface: ^6.9.0

  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/quark.png
  image_path: assets/quark.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/sbom_flutter.json
    - assets/demo/
