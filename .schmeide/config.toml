# schmeide repo config: https://github.com/autobutler-org/schmeide/blob/main/docs/config.md

# The pre-push check AGENTS.md asks for: the whole `make check` gate plus the
# unit tests. The Makefile needs GNU Make 3.82+, and the runner runs this with
# `sh -c`, where `make` on macOS is Apple's 3.81, so prefer gmake as
# git/hooks/pre-commit does.
#
# The runner starts from a fresh worktree with no resolved Dart packages
# (.dart_tool/package_config.json). Without them `dart format` cannot find
# package:flutter_lints/flutter.yaml, falls back to its default style and
# rewrites a hundred-odd files, so check/format/flutter fails on any change.
# Resolve them first, as AGENTS.md asks of any fresh worktree.
gate = "flutter pub get && $(command -v gmake || echo make) check test"

# The slowest required check (Build: build-android, build-ios) takes up to ~10m
# on a pull request; 20m leaves room for runner queueing.
check_wait = "20m"

# `check test` builds and tests both the Go backend and the Flutter app, which
# can run past the 30m default on a cold cache.
gate_timeout = "1h"

[automate]
# Add green pull requests to the merge queue (squash) without a person.
merge = "on"
# Give the writer fix rounds for review findings.
review_fix = "on"
# Accepted ahead of the feature; schmeide does not create issues yet.
create_issues = "on"
