# What each job in build.yml, test.yml, performance.yml and ci-image.yml reads, for
# dorny/paths-filter. On a pull request and in the merge queue a job runs only when its
# set matched; pushes to main run everything. A path missing here means a pull request
# that breaks that job merges green and fails on main afterwards, so when a job starts
# reading something new, add it.
ci: &ci
  - Makefile
  - .github/path-filters.yml
  - .github/actions/**
  - .github/workflows/build.yml
  - .github/workflows/test.yml
backend: &backend
  - *ci
  - "**/*.go"
  - go.mod
  - go.sum
  - sqlc.yaml
  - sql/**
  # Migrations and the embedded web directory are read by //go:embed.
  - internal/**
  - scripts/apply-coverage-ignore.bash
  - scripts/coverage-excluded-packages.txt
  # test/chaos/powercut builds its image from these.
  - test/chaos/powercut/**
# test.yml's test-postgres: the database layer and a first run of the server, on
# PostgreSQL. It builds and drives the server, so it reads what the backend jobs read.
postgres:
  - *ci
  - "**/*.go"
  - go.mod
  - go.sum
  - sqlc.yaml
  - sql/**
  # Migrations and the embedded web directory are read by //go:embed.
  - internal/**
# performance.yml: the server under load, and the harness that loads it.
performance:
  - *backend
  - .github/workflows/performance.yml
  - test/performance/**
flutter: &flutter
  - *ci
  - lib/**
  - packages/**
  - assets/**
  - pubspec.yaml
  - pubspec.lock
  - analysis_options.yaml
  # generate/frontend/quark-icons runs `npx fantasticon`.
  - package.json
  # setup-node takes its Node version from here.
  - .nvmrc
  - package-lock.json
  - scripts/generate_flutter_sbom.dart
web:
  - *flutter
  - web/**
  # build/frontend/web copies its output here for the backend to embed.
  - internal/server/public/**
android:
  - *flutter
  - android/**
linux:
  - *flutter
  - linux/**
ios:
  - *flutter
  - ios/**
  - scripts/ios-ci-signing.bash
frontend:
  - *flutter
  - test/**
  # test/web_index_html_test.dart reads web/index.html.
  - web/**
# ci-image.yml. The six build jobs are required checks. The workflow always
# starts on a pull request and in the merge queue, and the jobs skip with if:
# when this set did not match. A workflow-level paths filter would leave those
# checks with no status, and the pull request would wait forever.
image:
  - ci/**
  - linux/apt-packages.txt
  - go.mod
  - pubspec.yaml
  - .nvmrc
  - Makefile
  - .github/workflows/ci-image.yml
  - .github/path-filters.yml
