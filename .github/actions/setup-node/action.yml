name: Setup Node
runs:
  using: composite
  steps:
    # The quark CI images already carry the .nvmrc version.
    - name: Check installed Node
      id: node
      shell: bash
      run: |
        if [ "$(node --version 2>/dev/null)" = "v$(cat .nvmrc)" ]; then
          echo "installed=true" >> "${GITHUB_OUTPUT}"
        fi
    - name: Setup Node
      if: steps.node.outputs.installed != 'true'
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
    - name: Install node modules
      shell: bash
      run: |
        # The npm registry drops connections often enough that one install fails
        # a job whose tree is fine. build-android on #3311 died in this step and
        # never compiled; the same install passed on the other frontend jobs.
        attempt=1
        until npm ci; do
          if [ "$attempt" -ge 3 ]; then
            exit 1
          fi
          echo "npm ci failed (attempt ${attempt}); retrying"
          attempt=$((attempt + 1))
          sleep $((attempt * 5))
        done
