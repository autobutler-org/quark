# errand: on Errand, restore the installed-Node check from #3856 so an image that already
# carries the .nvmrc version skips the download.
name: Setup Node
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
    - name: Install node modules
      shell: bash
      run: |
        # The npm registry drops connections often enough that one install fails
        # a job whose tree is fine. build-android on #3311 died in this step and
        # never compiled; the same install passed on the other frontend jobs.
        attempt=1
        until npm ci; do
          if [ "$attempt" -ge 3 ]; then
            exit 1
          fi
          echo "npm ci failed (attempt ${attempt}); retrying"
          attempt=$((attempt + 1))
          sleep $((attempt * 5))
        done
