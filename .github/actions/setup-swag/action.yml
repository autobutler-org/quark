# errand: delete with the marked steps that use it; ci-backend carries swag.
name: Setup swag
description: Install swag at the version pinned in the Makefile, restoring it from the cache when present.
runs:
  using: composite
  steps:
    - name: Read pinned version
      id: version
      shell: bash
      run: |
        echo "version=$(sed -n 's/^SWAG_VERSION := //p' Makefile)" >> "${GITHUB_OUTPUT}"

    - name: Restore swag
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/bin/swag
        key: swag-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

    - name: Install swag
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        make setup/swag

    - name: Fix PATH
      shell: bash
      run: |
        echo "${HOME}/go/bin" >> "${GITHUB_PATH}"
