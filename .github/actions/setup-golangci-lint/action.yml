# errand: delete with the marked steps that use it; ci-backend carries golangci-lint.
name: Setup golangci-lint
description: Install golangci-lint at the version pinned in the Makefile, restoring it from the cache when present.
runs:
  using: composite
  steps:
    - name: Read pinned version
      id: version
      shell: bash
      run: |
        echo "version=$(sed -n 's/^GOLANGCI_LINT_VERSION := //p' Makefile)" >> "${GITHUB_OUTPUT}"

    - name: Restore golangci-lint
      id: cache
      uses: actions/cache@v6
      with:
        path: ~/go/bin/golangci-lint
        key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

    - name: Install golangci-lint
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        make setup/gotools/golangci-lint

    - name: Fix PATH
      shell: bash
      run: |
        echo "${HOME}/go/bin" >> "${GITHUB_PATH}"
