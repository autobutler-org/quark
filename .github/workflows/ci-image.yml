# cspell:words autobutlerci InstallAzureCLIDeb imagetools
name: CI image

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ci/**
      - linux/apt-packages.txt
      - go.mod
      - pubspec.yaml
      - .nvmrc
      - Makefile
      - .github/workflows/ci-image.yml
  pull_request:
    paths:
      - ci/**
      - linux/apt-packages.txt
      - go.mod
      - pubspec.yaml
      - .nvmrc
      - Makefile
      - .github/workflows/ci-image.yml
  merge_group:

concurrency:
  group: ci-image-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: autobutlerci.azurecr.io/quark
  REGISTRY_NAME: autobutlerci
  AZURE_TENANT_ID: 1196631e-40d1-42f3-91a4-1c80f49065f8
  AZURE_SUBSCRIPTION_ID: 8add0a4f-6638-4cf3-95bd-cd46ab3ca970

jobs:
  build:
    name: build ${{ matrix.name }} ${{ matrix.arch }}
    # A fork pull request would build its Dockerfile on the privileged runners.
    if: (github.event_name != 'pull_request' && github.event_name != 'merge_group') || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: errand
      labels: ${{ matrix.label }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ci-backend
            dockerfile: ci/backend.Dockerfile
            arch: amd64
            label: errand-x64
          - name: ci-backend
            dockerfile: ci/backend.Dockerfile
            arch: arm64
            label: errand
          - name: ci-frontend
            dockerfile: ci/frontend.Dockerfile
            arch: amd64
            label: errand-x64
          - name: ci-frontend
            dockerfile: ci/frontend.Dockerfile
            arch: arm64
            label: errand
          - name: ci-full
            dockerfile: ci/full.Dockerfile
            arch: amd64
            label: errand-x64
          - name: ci-full
            dockerfile: ci/full.Dockerfile
            arch: arm64
            label: errand
    steps:
      - uses: actions/checkout@v7

      - name: Read tool versions
        run: |
          set -euo pipefail
          GO_VERSION=$(awk '/^go /{print $2; exit}' go.mod)
          FLUTTER_VERSION=$(awk '/^  flutter:/{print $2; exit}' pubspec.yaml)
          NODE_VERSION=$(tr -d '[:space:]' < .nvmrc)
          GOLANGCI_LINT_VERSION=$(sed -n 's/^GOLANGCI_LINT_VERSION := //p' Makefile)
          GOVULNCHECK_VERSION=$(sed -n 's/^GOVULNCHECK_VERSION := //p' Makefile)
          SQLC_VERSION=$(sed -n 's/^SQLC_VERSION := //p' Makefile)
          SWAG_VERSION=$(sed -n 's/^SWAG_VERSION := //p' Makefile)
          for name in GO_VERSION FLUTTER_VERSION NODE_VERSION GOLANGCI_LINT_VERSION GOVULNCHECK_VERSION SQLC_VERSION SWAG_VERSION; do
            value="${!name}"
            if [ -z "${value}" ]; then
              echo "${name} is empty. Check go.mod, pubspec.yaml, .nvmrc, and the Makefile."
              exit 1
            fi
            echo "${name}=${value}" | tee -a "$GITHUB_ENV"
          done

      - name: Build
        run: |
          set -euo pipefail
          cp linux/apt-packages.txt ci/apt-packages.txt
          docker build \
            --file "${{ matrix.dockerfile }}" \
            --build-arg "GO_VERSION=${GO_VERSION}" \
            --build-arg "FLUTTER_VERSION=${FLUTTER_VERSION}" \
            --build-arg "NODE_VERSION=${NODE_VERSION}" \
            --build-arg "GOLANGCI_LINT_VERSION=${GOLANGCI_LINT_VERSION}" \
            --build-arg "GOVULNCHECK_VERSION=${GOVULNCHECK_VERSION}" \
            --build-arg "SQLC_VERSION=${SQLC_VERSION}" \
            --build-arg "SWAG_VERSION=${SWAG_VERSION}" \
            --tag "${REGISTRY}/${{ matrix.name }}:${GITHUB_SHA}-${{ matrix.arch }}" \
            ci

      - name: Require the image publisher client id
        if: github.event_name != 'pull_request'
        env:
          CLIENT_ID: ${{ vars.CI_IMAGE_AZURE_CLIENT_ID }}
        run: |
          if [ -z "${CLIENT_ID}" ]; then
            echo "CI_IMAGE_AZURE_CLIENT_ID is not set on autobutler-org/quark."
            echo "Set it to output ci_image_identity_client_id:"
            echo "  gh variable set CI_IMAGE_AZURE_CLIENT_ID --repo autobutler-org/quark --body <client-id>"
            exit 1
          fi

      # The public Actions runner does not ship az. azure/login runs az, so
      # install it here until the runner image has it.
      - name: Install Azure CLI
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if command -v az >/dev/null 2>&1; then
            exit 0
          fi
          if ! sudo -n true; then
            echo "az is missing and passwordless sudo is not available."
            echo "Install Azure CLI on the Errand runner image, then re-run this job."
            exit 1
          fi
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - uses: azure/login@v3
        if: github.event_name != 'pull_request'
        with:
          client-id: ${{ vars.CI_IMAGE_AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          az acr login --name "${REGISTRY_NAME}"
          docker push "${REGISTRY}/${{ matrix.name }}:${GITHUB_SHA}-${{ matrix.arch }}"

  publish:
    name: publish latest
    needs: build
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on:
      group: errand
      labels: errand-x64
    timeout-minutes: 20
    steps:
      # The public Actions runner does not ship az. azure/login runs az, so
      # install it here until the runner image has it.
      - name: Install Azure CLI
        run: |
          set -euo pipefail
          if command -v az >/dev/null 2>&1; then
            exit 0
          fi
          if ! sudo -n true; then
            echo "az is missing and passwordless sudo is not available."
            echo "Install Azure CLI on the Errand runner image, then re-run this job."
            exit 1
          fi
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.CI_IMAGE_AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Point latest at both architectures
        run: |
          set -euo pipefail
          if ! docker buildx version >/dev/null 2>&1; then
            echo "docker buildx is required to publish the multi-arch tag."
            echo "The Errand runner image should include the buildx CLI plugin."
            exit 1
          fi
          az acr login --name "${REGISTRY_NAME}"
          for name in ci-backend ci-frontend ci-full; do
            image="${REGISTRY}/${name}"
            # Each arch tag is a manifest list: the image plus a BuildKit
            # attestation. docker pull of the arm64 list on this amd64
            # daemon asks for linux/amd64 and fails. imagetools reads the
            # registry and does not pull.
            docker buildx imagetools create --tag "${image}:latest" \
              "${image}:${GITHUB_SHA}-amd64" \
              "${image}:${GITHUB_SHA}-arm64"
            docker buildx imagetools create --tag "${image}:${GITHUB_SHA}" \
              "${image}:${GITHUB_SHA}-amd64" \
              "${image}:${GITHUB_SHA}-arm64"
          done
