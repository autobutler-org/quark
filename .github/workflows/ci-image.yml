name: CI image

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ci/**
      - linux/apt-packages.txt
      - go.mod
      - pubspec.yaml
      - .nvmrc
      - Makefile
      - .github/workflows/ci-image.yml

concurrency:
  group: ci-image
  cancel-in-progress: false

env:
  IMAGE: autobutlerci.azurecr.io/ci
  REGISTRY_NAME: autobutlerci
  AZURE_TENANT_ID: 1196631e-40d1-42f3-91a4-1c80f49065f8
  AZURE_SUBSCRIPTION_ID: 8add0a4f-6638-4cf3-95bd-cd46ab3ca970

jobs:
  build:
    name: build ${{ matrix.arch }}
    runs-on:
      group: errand
      labels: ${{ matrix.label }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            label: errand-x64
          - arch: arm64
            label: errand
    steps:
      - uses: actions/checkout@v7

      - name: Require the image publisher client id
        env:
          CLIENT_ID: ${{ vars.CI_IMAGE_AZURE_CLIENT_ID }}
        run: |
          if [ -z "${CLIENT_ID}" ]; then
            echo "CI_IMAGE_AZURE_CLIENT_ID is not set on autobutler-org/quark."
            echo "After the iac apply, set it to output ci_image_identity_client_id:"
            echo "  gh variable set CI_IMAGE_AZURE_CLIENT_ID --repo autobutler-org/quark --body <client-id>"
            exit 1
          fi

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.CI_IMAGE_AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push
        run: |
          set -euo pipefail
          go_version=$(awk '/^go /{print $2; exit}' go.mod)
          flutter_version=$(awk '/^  flutter:/{print $2; exit}' pubspec.yaml)
          node_version=$(tr -d '[:space:]' < .nvmrc)
          golangci=$(sed -n 's/^GOLANGCI_LINT_VERSION := //p' Makefile)
          govuln=$(sed -n 's/^GOVULNCHECK_VERSION := //p' Makefile)
          sqlc=$(sed -n 's/^SQLC_VERSION := //p' Makefile)
          swag=$(sed -n 's/^SWAG_VERSION := //p' Makefile)
          probe=$(sed -n 's/^PROBE_VERSION := //p' Makefile)
          for value in "${go_version}" "${flutter_version}" "${node_version}" "${golangci}" "${govuln}" "${sqlc}" "${swag}" "${probe}"; do
            if [ -z "${value}" ]; then
              echo "A tool version was empty. Check go.mod, pubspec.yaml, .nvmrc, and the Makefile."
              exit 1
            fi
          done
          cp linux/apt-packages.txt ci/apt-packages.txt
          az acr login --name "${REGISTRY_NAME}"
          docker build \
            --file ci/Dockerfile \
            --build-arg "GO_VERSION=${go_version}" \
            --build-arg "FLUTTER_VERSION=${flutter_version}" \
            --build-arg "NODE_VERSION=${node_version}" \
            --build-arg "GOLANGCI_LINT_VERSION=${golangci}" \
            --build-arg "GOVULNCHECK_VERSION=${govuln}" \
            --build-arg "SQLC_VERSION=${sqlc}" \
            --build-arg "SWAG_VERSION=${swag}" \
            --build-arg "PROBE_VERSION=${probe}" \
            --tag "${IMAGE}:${GITHUB_SHA}-${{ matrix.arch }}" \
            ci
          docker push "${IMAGE}:${GITHUB_SHA}-${{ matrix.arch }}"

  publish:
    name: publish latest
    needs: build
    runs-on:
      group: errand
      labels: errand-x64
    timeout-minutes: 15
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.CI_IMAGE_AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Point latest at both architectures
        run: |
          set -euo pipefail
          az acr login --name "${REGISTRY_NAME}"
          docker manifest create "${IMAGE}:latest" \
            "${IMAGE}:${GITHUB_SHA}-amd64" \
            "${IMAGE}:${GITHUB_SHA}-arm64"
          docker manifest push "${IMAGE}:latest"
          docker manifest create "${IMAGE}:${GITHUB_SHA}" \
            "${IMAGE}:${GITHUB_SHA}-amd64" \
            "${IMAGE}:${GITHUB_SHA}-arm64"
          docker manifest push "${IMAGE}:${GITHUB_SHA}"
