# cspell:words autobutlerci InstallAzureCLIDeb
name: CI image

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
  push:
    branches: [main]
  # No `on: paths:`: a workflow skipped by paths never reports its checks, and the
  # required ci-image check would wait forever. The `changes` job skips the builds
  # instead, and a job skipped by `if:` reports success.
  pull_request:
  merge_group:

concurrency:
  group: ci-image-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: autobutlerci.azurecr.io/quark
  REGISTRY_NAME: autobutlerci
  AZURE_TENANT_ID: 1196631e-40d1-42f3-91a4-1c80f49065f8
  AZURE_SUBSCRIPTION_ID: 8add0a4f-6638-4cf3-95bd-cd46ab3ca970

jobs:
  # Works out whether a change touches the images, from .github/path-filters.yml.
  # Pushes to main compare against the previous commit. Manual runs skip the filter,
  # its output is empty, and everything builds.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ci_image: ${{ steps.filter.outputs.ci_image }}
    steps:
      - uses: actions/checkout@v7
      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        # A filter that fails leaves the output empty, and every image builds.
        continue-on-error: true
        uses: dorny/paths-filter@v4
        with:
          filters: .github/path-filters.yml

  build:
    name: build ${{ matrix.name }} ${{ matrix.arch }}
    needs: changes
    # The merge queue does not build: the pull request already did.
    if: github.event_name != 'merge_group' && needs.changes.outputs.ci_image != 'false'
    runs-on:
      group: errand
      labels: ${{ matrix.label }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ci-backend
            dockerfile: ci/backend.Dockerfile
            arch: amd64
            label: errand-x64
          - name: ci-backend
            dockerfile: ci/backend.Dockerfile
            arch: arm64
            label: errand
          - name: ci-frontend
            dockerfile: ci/frontend.Dockerfile
            arch: amd64
            label: errand-x64
          - name: ci-frontend
            dockerfile: ci/frontend.Dockerfile
            arch: arm64
            label: errand
          - name: ci-full
            dockerfile: ci/full.Dockerfile
            arch: amd64
            label: errand-x64
          - name: ci-full
            dockerfile: ci/full.Dockerfile
            arch: arm64
            label: errand
    steps:
      - uses: actions/checkout@v7

      - name: Read tool versions
        run: |
          set -euo pipefail
          GO_VERSION=$(awk '/^go /{print $2; exit}' go.mod)
          FLUTTER_VERSION=$(awk '/^  flutter:/{print $2; exit}' pubspec.yaml)
          NODE_VERSION=$(tr -d '[:space:]' < .nvmrc)
          GOLANGCI_LINT_VERSION=$(sed -n 's/^GOLANGCI_LINT_VERSION := //p' Makefile)
          GOVULNCHECK_VERSION=$(sed -n 's/^GOVULNCHECK_VERSION := //p' Makefile)
          SQLC_VERSION=$(sed -n 's/^SQLC_VERSION := //p' Makefile)
          SWAG_VERSION=$(sed -n 's/^SWAG_VERSION := //p' Makefile)
          for name in GO_VERSION FLUTTER_VERSION NODE_VERSION GOLANGCI_LINT_VERSION GOVULNCHECK_VERSION SQLC_VERSION SWAG_VERSION; do
            value="${!name}"
            if [ -z "${value}" ]; then
              echo "${name} is empty. Check go.mod, pubspec.yaml, .nvmrc, and the Makefile."
              exit 1
            fi
            echo "${name}=${value}" | tee -a "$GITHUB_ENV"
          done

      - name: Build
        run: |
          set -euo pipefail
          cp linux/apt-packages.txt ci/apt-packages.txt
          docker build \
            --file "${{ matrix.dockerfile }}" \
            --build-arg "GO_VERSION=${GO_VERSION}" \
            --build-arg "FLUTTER_VERSION=${FLUTTER_VERSION}" \
            --build-arg "NODE_VERSION=${NODE_VERSION}" \
            --build-arg "GOLANGCI_LINT_VERSION=${GOLANGCI_LINT_VERSION}" \
            --build-arg "GOVULNCHECK_VERSION=${GOVULNCHECK_VERSION}" \
            --build-arg "SQLC_VERSION=${SQLC_VERSION}" \
            --build-arg "SWAG_VERSION=${SWAG_VERSION}" \
            --tag "${REGISTRY}/${{ matrix.name }}:${GITHUB_SHA}-${{ matrix.arch }}" \
            ci

      - name: Require the image publisher client id
        if: github.event_name != 'pull_request'
        env:
          CLIENT_ID: ${{ vars.CI_IMAGE_AZURE_CLIENT_ID }}
        run: |
          if [ -z "${CLIENT_ID}" ]; then
            echo "CI_IMAGE_AZURE_CLIENT_ID is not set on autobutler-org/quark."
            echo "Set it to output ci_image_identity_client_id:"
            echo "  gh variable set CI_IMAGE_AZURE_CLIENT_ID --repo autobutler-org/quark --body <client-id>"
            exit 1
          fi

      # The public Actions runner does not ship az. azure/login runs az, so
      # install it here until the runner image has it.
      - name: Install Azure CLI
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if command -v az >/dev/null 2>&1; then
            exit 0
          fi
          if ! sudo -n true; then
            echo "az is missing and passwordless sudo is not available."
            echo "Install Azure CLI on the Errand runner image, then re-run this job."
            exit 1
          fi
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - uses: azure/login@v3
        if: github.event_name != 'pull_request'
        with:
          client-id: ${{ vars.CI_IMAGE_AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          az acr login --name "${REGISTRY_NAME}"
          docker push "${REGISTRY}/${{ matrix.name }}:${GITHUB_SHA}-${{ matrix.arch }}"

  # The ruleset requires a check named ci-image. A matrix leg skipped by `if:`
  # reports under its unexpanded name, so the per-leg names would never arrive on a
  # skipped run; this job carries the name and fails when any leg did.
  ci-image:
    needs: [changes, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check every image built
        run: |
          [[ "${{ needs.changes.result }}" == success ]]
          [[ "${{ needs.build.result }}" =~ ^(success|skipped)$ ]]

  publish:
    name: publish latest
    needs: build
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on:
      group: errand
      labels: errand-x64
    timeout-minutes: 20
    steps:
      # The public Actions runner does not ship az. azure/login runs az, so
      # install it here until the runner image has it.
      - name: Install Azure CLI
        run: |
          set -euo pipefail
          if command -v az >/dev/null 2>&1; then
            exit 0
          fi
          if ! sudo -n true; then
            echo "az is missing and passwordless sudo is not available."
            echo "Install Azure CLI on the Errand runner image, then re-run this job."
            exit 1
          fi
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.CI_IMAGE_AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Point latest at both architectures
        run: |
          set -euo pipefail
          az acr login --name "${REGISTRY_NAME}"
          for name in ci-backend ci-frontend ci-full; do
            image="${REGISTRY}/${name}"
            docker pull "${image}:${GITHUB_SHA}-amd64"
            docker pull "${image}:${GITHUB_SHA}-arm64"
            docker manifest rm "${image}:latest" >/dev/null 2>&1 || true
            docker manifest create "${image}:latest" \
              "${image}:${GITHUB_SHA}-amd64" \
              "${image}:${GITHUB_SHA}-arm64"
            docker manifest push "${image}:latest"
            docker manifest rm "${image}:${GITHUB_SHA}" >/dev/null 2>&1 || true
            docker manifest create "${image}:${GITHUB_SHA}" \
              "${image}:${GITHUB_SHA}-amd64" \
              "${image}:${GITHUB_SHA}-arm64"
            docker manifest push "${image}:${GITHUB_SHA}"
          done
