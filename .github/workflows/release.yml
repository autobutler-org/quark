name: Release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
defaults:
  run:
    shell: bash

env:
  AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
  WORKING_DIR: ${{ github.workspace }}

jobs:
  web:
    # errand: group errand, label errand-x64-quark-frontend. GitHub-hosted until the Azure vCPU quota is raised (AGENTS.md, CI images).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check tag format
        run: |
          if [[ ! "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag must be in the format vX.Y.Z"
            exit 1
          fi
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      # errand: remove on errand-x64-quark-frontend; ci-frontend carries Flutter.
      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
      # errand: remove on errand-x64-quark-frontend; ci-frontend carries Node.
      - name: Setup Node
        uses: ./.github/actions/setup-node
      - name: Build frontend [web]
        env:
          FLUTTER_BUILD_MODE: release
        run: make build/frontend/web
      - name: Upload the web build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: internal/server/public/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: web
    # errand: group errand, label errand-x64-quark-backend. GitHub-hosted until the Azure vCPU quota is raised (AGENTS.md, CI images).
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
      # errand: remove on errand-x64-quark-backend; ci-backend carries Go.
      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Download the web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: internal/server/public
      # go:embed reads this directory at compile time. The upload stores the
      # directory contents, so index.html has to land here and not under a
      # second public/ directory.
      - name: Require the embedded web app
        run: test -f internal/server/public/index.html
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ~> v2
          args: release --clean
          workdir: ${{ env.WORKING_DIR }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ env.WORKING_DIR }}/dist/*

  armbian-build:
    needs: release
    if: success() && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/armbian-build.yml
    with:
      build_tag: ${{ github.ref_name }}
    secrets: inherit

  release-docker:
    needs: release
    if: success() && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-docker.yml
    with:
      push: true
    secrets: inherit

  release-ios:
    needs: release
    if: success() && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    uses: ./.github/workflows/release-ios.yml
    with:
      upload: true
    secrets: inherit

  release-android:
    needs: release
    if: success() && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    uses: ./.github/workflows/release-android.yml
    with:
      track: internal
      upload: true
    secrets: inherit

  release-linux:
    needs: release
    if: success() && startsWith(github.ref, 'refs/tags/v')
    permissions:
      # Attaches the AppImage to the release the `release` job created.
      contents: write
    uses: ./.github/workflows/release-linux.yml
    with:
      upload: true
