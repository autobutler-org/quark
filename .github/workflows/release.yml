name: Release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
defaults:
  run:
    shell: bash

env:
  AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
  WORKING_DIR: ${{ github.workspace }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check tag format
        run: |
          if [[ ! "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag must be in the format vX.Y.Z"
            exit 1
          fi
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
      - name: Setup Node
        uses: ./.github/actions/setup-node
      - name: Build frontend [web]
        env:
          FLUTTER_BUILD_MODE: release
        run: |
          make build/frontend/web
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro'
          distribution: goreleaser
          # 'latest', 'nightly', or a semver
          version: ~> v2
          args: release --clean
          workdir: ${{ env.WORKING_DIR }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload assets
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: ${{ env.WORKING_DIR }}/dist/*

  armbian-build:
    needs: release
    if: success() && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/armbian-build.yml
    with:
      build_tag: ${{ github.ref_name }}
    secrets: inherit

  release-docker:
    needs: release
    if: success() && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-docker.yml
    with:
      push: true
    secrets: inherit

  release-ios:
    needs: release
    if: success() && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    uses: ./.github/workflows/release-ios.yml
    with:
      upload: true
    secrets: inherit

  release-android:
    needs: release
    if: success() && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    uses: ./.github/workflows/release-android.yml
    with:
      track: internal
      upload: true
    secrets: inherit
