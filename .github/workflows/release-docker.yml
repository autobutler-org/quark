name: Docker Release

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released Quark version to package, without the leading v. Leave empty to use the current tag."
        required: false
        type: string
      push:
        description: "Push to GHCR. Uncheck to build and verify only."
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      version:
        required: false
        type: string
      push:
        required: false
        type: boolean
        default: true

defaults:
  run:
    shell: bash

jobs:
  release-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The image downloads published release assets rather than building from source, so
      # it needs the version the way the asset filenames spell it: no leading v.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME}}"
          version="${version#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: '${version}' is not a released version (expected X.Y.Z)."
            echo "  Run this workflow from a vX.Y.Z tag, or pass the version input."
            echo "  Released versions: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      # arm64 is emulated here. The image only unpacks a prebuilt binary, so the emulation
      # cost is a few seconds of tar, not a cross-compile.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # `latest` moves only when the version was derived from the tag being released. A
      # manual dispatch for an older version publishes its own tag and nothing else --
      # otherwise re-packaging an old release would walk `latest` backwards.
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ${{ inputs.version == '' && format('ghcr.io/{0}:latest', github.repository) || '' }}
