name: Performance Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  USERNAME: perf
  PASSWORD: perf-password

jobs:
  # A pull request that touches no backend or harness path cannot move these
  # numbers, and on a shared runner the gate still fails now and then on noise
  # alone (#2743). Such pull requests skip the jobs; the nightly run and
  # workflow_dispatch run everything. See the same job in build.yml for why
  # jobs skip with `if:` rather than `on: paths:`.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      performance: ${{ steps.filter.outputs.performance }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/path-filters.yml

  performance-loadtest:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.performance == 'true'
    # errand: group errand, label errand-x64-quark-backend. GitHub-hosted until the Azure vCPU quota is raised (AGENTS.md, CI images).
    runs-on: ubuntu-latest
    # Room for run_gated.sh to rerun a scenario once.
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # errand: remove on errand-x64-quark-backend; ci-backend carries Go.
      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # errand: remove on errand-x64-quark-backend; ci-backend carries sqlc.
      - name: Setup sqlc
        uses: ./.github/actions/setup-sqlc

      # errand: remove on errand-x64-quark-backend; ci-backend carries swag.
      - name: Setup swag
        uses: ./.github/actions/setup-swag

      # errand: remove on errand-x64-quark-backend; ci-backend carries wrk.
      - name: Setup wrk
        uses: ./.github/actions/setup-wrk

      - name: Run load test profile
        run: |
          make test/perf/load

      - name: Upload load test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loadtest-results
          path: test-results/performance/load/
          if-no-files-found: warn

  performance-stress:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.performance == 'true'
    # errand: group errand, label errand-x64-quark-backend. GitHub-hosted until the Azure vCPU quota is raised (AGENTS.md, CI images).
    runs-on: ubuntu-latest
    # Room for run_gated.sh to rerun a scenario once.
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # errand: remove on errand-x64-quark-backend; ci-backend carries Go.
      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # errand: remove on errand-x64-quark-backend; ci-backend carries sqlc.
      - name: Setup sqlc
        uses: ./.github/actions/setup-sqlc

      # errand: remove on errand-x64-quark-backend; ci-backend carries swag.
      - name: Setup swag
        uses: ./.github/actions/setup-swag

      # errand: remove on errand-x64-quark-backend; ci-backend carries wrk.
      - name: Setup wrk
        uses: ./.github/actions/setup-wrk

      - name: Test the performance gate
        run: |
          make test/perf/gate

      - name: Run stress profile
        run: |
          make test/perf/stress

      - name: Upload stress test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-results
          path: test-results/performance/stress/
          if-no-files-found: warn

  performance-summary:
    runs-on: ubuntu-latest
    needs:
      - changes
      - performance-loadtest
      - performance-stress
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.performance == 'true')
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download load test results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: loadtest-results
          path: test-results/performance/load

      - name: Download stress test results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stress-results
          path: test-results/performance/stress

      - name: Render performance summary
        run: |
          make test/perf/summary >> ${GITHUB_STEP_SUMMARY}
