name: Test
on:
  # Also on push to main so the badges have a run attributed to the branch. Without it
  # every run belongs to a pull request's head ref and a ?branch=main badge reads
  # "no status".
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      # Go's test cache keys on the mtime of files a test opens (docs/swagger/swagger.json,
      # say), and checkout stamps every file with the current time. Derive each tracked
      # file's mtime from its blob hash instead: same content, same mtime, every run.
      - name: Set file times from content
        run: |
          git ls-files -s -z | perl -0ne '($h, $p) = /^\S+ (\S+) \S+\t(.*)\0$/s; $t = hex(substr($h, 0, 7)); utime $t, $t, $p'
      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # setup-go keys its cache on go.sum alone and skips saving on a hit, so the
          # test cache would stay frozen at the last dependency bump.
          cache: false
      # A per-run key saves what each run tested; restore-keys picks up the newest.
      - name: Restore Go caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-
      - name: Setup sqlc
        uses: ./.github/actions/setup-sqlc
      - name: Setup swag
        uses: ./.github/actions/setup-swag
      - name: Run unit tests
        env:
          PRINT_COVERAGE: true
        run: |
          make test/unit/backend
      - name: Run integration tests
        run: |
          make test/integration/backend
  api-chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Setup sqlc
        uses: ./.github/actions/setup-sqlc
      - name: Setup swag
        uses: ./.github/actions/setup-swag
      - name: Run API stress suite
        run: |
          make test/chaos/local
      - name: Upload stress suite artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-chaos-results
          path: test-results/chaos/
          if-no-files-found: warn
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
      # test/unit/frontend depends on generate/frontend, whose quark-icons step runs
      # `npx fantasticon`.
      - name: Setup Node
        uses: ./.github/actions/setup-node
      - name: Tidy
        run: |
          make tidy/flutter
      - name: Run unit tests
        run: |
          make test/unit/frontend
