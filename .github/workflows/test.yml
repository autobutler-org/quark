name: Test
on:
  # Also on push to main so the badges have a run attributed to the branch. Without it
  # every run belongs to a pull request's head ref and a ?branch=main badge reads
  # "no status". These runs also save the caches pull requests restore: a pull request
  # can read a cache only from its own branch or from main, and a merge-queue run saves
  # its caches under a temporary ref nothing else can read.
  push:
    branches: [main]
  pull_request:
  # The merge queue runs on the pull request combined with main and whatever is queued
  # ahead of it, so a pull request does not have to be up to date to merge. The `changes`
  # job below decides which jobs that run needs.
  merge_group:
  workflow_dispatch:
# Superseded runs of the same pull request are canceled. Pushes to main share one group
# and are not canceled, so they run one at a time and a newer push replaces any older
# one still waiting. Merge-queue and manual runs each get a group of their own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  # Works out which areas a pull request or a merge-queue entry touches, from
  # .github/path-filters.yml. See the same job in build.yml for what each is compared
  # against and why jobs skip with `if:` rather than `on: paths:`.
  changes:
    runs-on:
      group: errand
      labels: x64
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      postgres: ${{ steps.filter.outputs.postgres }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        # A filter that fails leaves the outputs empty, and every job runs. Without this
        # the jobs would skip behind a failed `changes`, and a skipped required check
        # counts as passed.
        continue-on-error: true
        uses: dorny/paths-filter@v4
        with:
          filters: .github/path-filters.yml
  test-backend:
    needs: changes
    if: needs.changes.outputs.backend != 'false'
    runs-on:
      group: errand
      labels: x64-quark-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Run unit tests
        env:
          PRINT_COVERAGE: true
        run: |
          make test/unit/backend
      - name: Run integration tests
        run: |
          make test/integration/backend
  # What is checked on a real PostgreSQL (the Makefile lists it beside test/db/postgres): the
  # query and schema layer, connecting and migrating, a first run of the server driven over
  # HTTP against the same journey on SQLite, and what is refused by name. Only this; running
  # the whole backend suite per backend is #2960.
  test-postgres:
    needs: changes
    if: needs.changes.outputs.postgres != 'false'
    runs-on:
      group: errand
      labels: x64-quark-backend
    timeout-minutes: 10
    services:
      # The image major, user, password, database and port compose.yaml gives a developer,
      # so the URL the Makefile builds reaches this one too. Keep the two in step.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: quark
          POSTGRES_PASSWORD: quark
          POSTGRES_DB: quark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quark -d quark"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Download Go modules
        run: |
          # The module proxy drops connections often enough that one download
          # fails a job whose tree is fine. The PostgreSQL job on #3850 died
          # here, reading golang.org/x/text, and never ran a test; the same
          # modules had already downloaded on the other Go jobs.
          attempt=1
          until go mod download; do
            if [ "$attempt" -ge 3 ]; then
              exit 1
            fi
            echo "go mod download failed (attempt ${attempt}); retrying"
            attempt=$((attempt + 1))
            sleep $((attempt * 5))
          done
      - name: Check the database layer and a first run of the server on PostgreSQL
        run: |
          make test/db/postgres
  api-chaos:
    needs: changes
    if: needs.changes.outputs.backend != 'false'
    runs-on:
      group: errand
      labels: x64-quark-backend
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Run API stress suite
        run: |
          make test/chaos/local
      - name: Upload stress suite artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-chaos-results
          path: test-results/chaos/
          if-no-files-found: warn
  power-cut:
    needs: changes
    if: needs.changes.outputs.backend != 'false'
    runs-on:
      group: errand
      labels: x64-quark-backend
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Cut the power under uploads
        run: |
          # A pull request built from main still pins public.ecr.aws in the
          # power-cut Dockerfile. That registry answers 429, and the Makefile
          # on that tree builds the image with no mirror fallback. ci-base.bash
          # points FROM at the next mirror that answers. A Dockerfile that
          # already takes BASE_IMAGE is left alone.
          ./test/chaos/powercut/ci-base_test.bash
          ./test/chaos/powercut/ci-base.bash
          make test/chaos/powercut
      - name: Upload power-cut results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: power-cut-results
          path: test-results/powercut/
          if-no-files-found: warn
  test-frontend-suite:
    needs: changes
    if: needs.changes.outputs.frontend != 'false'
    runs-on:
      group: errand
      labels: x64-quark-frontend
    # A leg takes about six minutes; a stuck `flutter test` would otherwise
    # hold the runner for the six-hour default (#2768).
    timeout-minutes: 20
    # The runner has the RAM a laptop lacks; see FRONTEND_SUITE_JOBS in the Makefile.
    env:
      FRONTEND_SUITE_JOBS: 6
      FLUTTER_TEST_CONCURRENCY: ""
    name: test-frontend (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app 1/3
            suite: test/unit/frontend/app TOTAL_SHARDS=3 SHARD_INDEX=0
          - name: app 2/3
            suite: test/unit/frontend/app TOTAL_SHARDS=3 SHARD_INDEX=1
          - name: app 3/3
            suite: test/unit/frontend/app TOTAL_SHARDS=3 SHARD_INDEX=2
          - name: packages
            suite: test/unit/frontend/packages
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      # generate/frontend's quark-icons step runs `npx fantasticon`.
      - name: Setup Node
        uses: ./.github/actions/setup-node
      - name: Tidy
        run: |
          make tidy/flutter
      - name: Generate
        run: |
          make generate/frontend
      # A leg dropped from the matrix above would leave its slice of the suite unrun
      # with every other leg green (#3075).
      - name: Check the app shards cover the suite
        run: |
          make check/frontend/test-shards
      - name: Run unit tests
        run: |
          make ${{ matrix.suite }}
  # The ruleset requires a check named test-frontend, and a matrix leg is named
  # after its suite, so this job carries the name and fails when any leg did.
  # It stays out of a canceled run: a stack push starts two runs of one commit, the
  # second cancels the first, and a canceled suite is not a failed one (#2870).
  test-frontend:
    needs: test-frontend-suite
    if: ${{ !cancelled() }}
    runs-on:
      group: errand
      labels: x64
    steps:
      - name: Check every suite passed
        run: |
          [[ "${{ needs.test-frontend-suite.result }}" =~ ^(success|skipped)$ ]]
