name: Test
on:
  # Also on push to main so the badges have a run attributed to the branch. Without it
  # every run belongs to a pull request's head ref and a ?branch=main badge reads
  # "no status".
  push:
    branches: [main]
  pull_request:
  # The merge queue runs every job on the pull request combined with main and whatever
  # is queued ahead of it, so a pull request does not have to be up to date to merge.
  merge_group:
  workflow_dispatch:
# Cancels only superseded runs of the same pull request. Push, merge-queue and manual
# runs each get a group of their own, so none of them is ever canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  # Works out which areas a pull request touches, from .github/path-filters.yml. See the
  # same job in build.yml for why jobs skip with `if:` rather than `on: paths:`.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: .github/path-filters.yml
  test-backend:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Setup sqlc
        uses: ./.github/actions/setup-sqlc
      - name: Setup swag
        uses: ./.github/actions/setup-swag
      - name: Run unit tests
        env:
          PRINT_COVERAGE: true
        run: |
          make test/unit/backend
      - name: Run integration tests
        run: |
          make test/integration/backend
  api-chaos:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Setup sqlc
        uses: ./.github/actions/setup-sqlc
      - name: Setup swag
        uses: ./.github/actions/setup-swag
      - name: Run API stress suite
        run: |
          make test/chaos/local
      - name: Upload stress suite artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-chaos-results
          path: test-results/chaos/
          if-no-files-found: warn
  power-cut:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cut the power under uploads and the vault
        run: |
          make test/chaos/powercut
      - name: Upload power-cut results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: power-cut-results
          path: test-results/powercut/
          if-no-files-found: warn
  test-frontend-suite:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    name: test-frontend (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app 1/3
            suite: test/unit/frontend/app TOTAL_SHARDS=3 SHARD_INDEX=0
          - name: app 2/3
            suite: test/unit/frontend/app TOTAL_SHARDS=3 SHARD_INDEX=1
          - name: app 3/3
            suite: test/unit/frontend/app TOTAL_SHARDS=3 SHARD_INDEX=2
          - name: packages
            suite: test/unit/frontend/packages
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
      # generate/frontend's quark-icons step runs `npx fantasticon`.
      - name: Setup Node
        uses: ./.github/actions/setup-node
      - name: Tidy
        run: |
          make tidy/flutter
      - name: Generate
        run: |
          make generate/frontend
      - name: Run unit tests
        run: |
          make ${{ matrix.suite }}
  # The ruleset requires a check named test-frontend, and a matrix leg is named
  # after its suite, so this job carries the name and fails when any leg did.
  test-frontend:
    needs: test-frontend-suite
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every suite passed
        run: |
          [[ "${{ needs.test-frontend-suite.result }}" =~ ^(success|skipped)$ ]]
