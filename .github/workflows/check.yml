name: Check code quality
on:
  pull_request:
  # The merge queue runs every job on the pull request combined with main and whatever
  # is queued ahead of it, so a pull request does not have to be up to date to merge.
  merge_group:
  workflow_dispatch:
# Cancels only superseded runs of the same pull request. Push, merge-queue and manual
# runs each get a group of their own, so none of them is ever canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  check-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Setup sqlc
        uses: ./.github/actions/setup-sqlc
      - name: Setup swag
        uses: ./.github/actions/setup-swag
      - name: Setup gotools
        uses: ./.github/actions/setup-gotools
      - name: Generate code
        run: |
          make generate/backend
      - name: Check formatting
        run: |
          make check/format/go
      # Runs golangci-lint (govet, errcheck, ineffassign, staticcheck, unused, revive)
      # and scripts/check-go-structure.bash, which check/lint/go depends on.
      - name: Lint go
        run: |
          make check/lint/go
      - name: Lint sqlc
        run: |
          make check/lint/sqlc
      - name: Tidy
        run: |
          make tidy/go
      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code; then
            echo "There are uncommitted changes after linting and generating. Please fix them before committing.";
            exit 1;
          fi
  check-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
      - name: Tidy
        run: |
          make tidy/flutter
      - name: Generate code
        run: |
          make generate/frontend
      - name: Check formatting
        run: |
          make check/format/flutter
      - name: Lint
        run: |
          make check/lint/flutter
      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code; then
            echo "Error: Uncommitted changes found. Please commit the generated code."
            exit 1
          fi
  check-misc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: ./.github/actions/setup-node
      - name: Spellcheck
        run: |
          make check/spelling

  check-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The check compares against the base branch, which a shallow
          # checkout of the merge commit does not carry.
          fetch-depth: 0
      # Fails when a migration is numbered at or below the base branch's
      # highest, which golang-migrate would silently skip on upgraded devices.
      - name: Check migration numbering
        run: |
          make check/migrations MIGRATION_BASE_REF=origin/${{ github.base_ref || 'main' }}

  security-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Check for vulnerabilities
        run: make check/vuln/backend
