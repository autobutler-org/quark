name: Build
on:
  # Also on push to main so the badges have a run attributed to the branch. Without it
  # every run belongs to a pull request's head ref and a ?branch=main badge reads
  # "no status".
  push:
    branches: [main]
  pull_request:
  # The merge queue runs every job on the pull request combined with main and whatever
  # is queued ahead of it, so a pull request does not have to be up to date to merge.
  merge_group:
  workflow_dispatch:
# Cancels only superseded runs of the same pull request. Push, merge-queue and manual
# runs each get a group of their own, so none of them is ever canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  # Works out which areas a pull request touches, from .github/path-filters.yml. Each
  # job below skips itself with a job-level `if:` rather than the workflow using
  # `on: paths:`: a job skipped by `if:` reports success, but a workflow skipped by
  # paths never reports its checks, and a required one like build-ios waits forever.
  # Pushes to main, the merge queue and manual runs build everything, so the badges
  # stay accurate and nothing merges on a filtered run alone.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: .github/path-filters.yml
  build-backend:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Setup sqlc
        uses: ./.github/actions/setup-sqlc
      - name: Setup swag
        uses: ./.github/actions/setup-swag
      - name: Build
        run: |
          make build/backend
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: build/quark
          if-no-files-found: error
      - name: Check backend cross-compile [darwin/arm64]
        env:
          GOOS: darwin
          GOARCH: arm64
        run: |
          make build/backend
      - name: Check backend cross-compile [linux/arm64]
        env:
          GOOS: linux
          GOARCH: arm64
        run: |
          make build/backend
  build-web:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
      - name: Setup Node
        uses: ./.github/actions/setup-node
      - name: Tidy
        run: |
          make tidy/flutter
      - name: Build [web]
        run: |
          make build/frontend/web
  build-android:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # build/frontend/android takes the app version from the most recent tag, and
          # the default checkout is shallow with no tags. Without these the version
          # silently falls back to Flutter's 1.0.0 default.
          fetch-tags: true
          fetch-depth: 0
      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
      - name: Setup Node
        uses: ./.github/actions/setup-node
      - name: Restore Gradle caches
        id: gradle
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Tidy
        run: |
          make tidy/flutter
      - name: Build [android]
        run: |
          make build/frontend/android
      # Saved on main only, like the Flutter SDK in .github/actions/setup-flutter: this
      # cache is 3 GB, and a copy saved on any other ref is one only that ref can restore.
      - name: Save Gradle caches
        if: github.ref == 'refs/heads/main' && steps.gradle.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle.outputs.cache-primary-key }}
  build-ios:
    # macOS runners bill at a multiple of Linux minutes, so this job is deliberately
    # narrow: build the App Store IPA and let check/frontend/ios/ipa verify it is a real
    # release build. No upload -- nothing here consumes an App Store build number.
    runs-on: macos-26
    timeout-minutes: 45
    # Fork pull requests are skipped outright rather than built unsigned: a macOS runner
    # is the most expensive thing in this repository to start, and a fork's head is code
    # nobody here has reviewed yet. Runs that do start but have no signing material --
    # dependabot's -- fall back to an unsigned build in the steps below.
    needs: changes
    if: >-
      github.event_name != 'pull_request'
      || (needs.changes.outputs.ios == 'true'
        && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The app version comes from the most recent tag, and the default checkout is
          # shallow with no tags, so git describe would find nothing.
          fetch-tags: true
          fetch-depth: 0
      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
      - name: Setup GNU make
        uses: ./.github/actions/setup-gnu-make
      # Dependabot pull requests run with the secrets withheld, so the signing material
      # is empty and a signed build is impossible however correct the branch is. The
      # job-level `if` above cannot see that: dependabot's branches live in this
      # repository, so head.repo matches. Decide here instead, and build unsigned when
      # there is nothing to sign with -- a bump that breaks the iOS build still fails,
      # and build-ios stops reporting a red X nobody can clear.
      - name: Check for signing secrets
        id: signing
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [[ -n "${IOS_DIST_CERT_P12_BASE64}" ]] \
            && [[ -n "${IOS_DIST_CERT_PASSWORD}" ]] \
            && [[ -n "${IOS_PROVISIONING_PROFILE_BASE64}" ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::No iOS signing secrets in this run; building unsigned."
          fi
      - name: Prepare code signing
        if: steps.signing.outputs.available == 'true'
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: ./scripts/ios-ci-signing.bash
      - name: Build [ios]
        if: steps.signing.outputs.available == 'true'
        # Fixed build number: this job verifies the build and never uploads, so it has no
        # App Store Connect credentials to query the real next number with.
        run: |
          make build/frontend/ios/ipa \
            IOS_EXPORT_OPTIONS=ios/ExportOptions.ci.plist \
            IOS_BUILD_NUMBER=1
      - name: Build [ios] unsigned
        if: steps.signing.outputs.available == 'false'
        # Release mode, not the target's debug default, so this compiles the same
        # configuration the signed path archives. There is no IPA without signing, so
        # this stops at the .app and uploads nothing.
        run: |
          make build/frontend/ios FLUTTER_BUILD_MODE=release
      - name: Upload artifact
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa-ci
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Clean up signing material
        if: always()
        run: |
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles
          rm -rf ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          rm -f ios/ExportOptions.ci.plist
          security delete-keychain ~/Library/Keychains/quark-signing.keychain-db || true
          git checkout -- ios/Flutter/Release.xcconfig || true
