name: iOS Release

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "iOS build number. Leave empty to use the next unused number from App Store Connect."
        required: false
        type: string
      upload:
        description: "Upload to App Store Connect. Uncheck to build and verify only."
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      build_number:
        required: false
        type: string
      upload:
        required: false
        type: boolean
        default: true
    secrets:
      IOS_DIST_CERT_P12_BASE64:
        required: true
      IOS_DIST_CERT_PASSWORD:
        required: true
      IOS_PROVISIONING_PROFILE_BASE64:
        required: true
      APP_STORE_CONNECT_KEY_ID:
        required: true
      APP_STORE_CONNECT_ISSUER_ID:
        required: true
      APP_STORE_CONNECT_PRIVATE_KEY:
        required: true

defaults:
  run:
    shell: bash

jobs:
  release-ios:
    # Signing, archiving and altool are all macOS-only.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Setup GNU make
        uses: ./.github/actions/setup-gnu-make

      # The macOS runner does not ship Go. hook/build.dart compiles the embedded
      # tailnet while Flutter archives, and it fails closed when go is not on PATH.
      # Same version the backend jobs install, from go.mod.
      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Prepare code signing
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: ./scripts/ios-ci-signing.bash

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          if [[ -z "${APP_STORE_CONNECT_KEY_ID}" || -z "${APP_STORE_CONNECT_PRIVATE_KEY}" ]]; then
            echo "Error: APP_STORE_CONNECT_KEY_ID and APP_STORE_CONNECT_PRIVATE_KEY must be set."
            echo "  See docs/ios-release.md for how to create the API key."
            exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "${APP_STORE_CONNECT_PRIVATE_KEY}" \
            > ~/.appstoreconnect/private_keys/"AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 ~/.appstoreconnect/private_keys/*.p8

      # No build number is passed by default: the Makefile asks App Store Connect for the
      # next unused one. github.run_number cannot do this safely -- it is a per-workflow
      # counter, so a tag release and a standalone dispatch draw from different
      # sequences, and it is stable across re-runs, so retrying a failed upload would
      # reuse a number App Store Connect has already consumed.
      - name: Build signed IPA
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          args=(IOS_EXPORT_OPTIONS=ios/ExportOptions.ci.plist)
          # Only override when explicitly asked. An empty IOS_BUILD_NUMBER would still
          # count as "set" to make and suppress the query.
          if [[ -n "${INPUT_BUILD_NUMBER}" ]]; then
            args+=("IOS_BUILD_NUMBER=${INPUT_BUILD_NUMBER}")
          fi
          make build/frontend/ios/ipa "${args[@]}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish to App Store Connect
        if: ${{ inputs.upload }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: make publish/frontend/ios

      - name: Clean up signing material
        if: always()
        run: |
          rm -rf ~/.appstoreconnect/private_keys
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles
          rm -rf ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          rm -f ios/ExportOptions.ci.plist
          security delete-keychain ~/Library/Keychains/quark-signing.keychain-db || true
          git checkout -- ios/Flutter/Release.xcconfig || true
