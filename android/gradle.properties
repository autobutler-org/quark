org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Both are deprecated in AGP 9 but still required, and Flutter's migrator writes them on
# every build if they are missing. builtInKotlin: several plugins (desktop_drop,
# flutter_file_dialog, photo_manager) still apply the Kotlin Gradle plugin, which fails
# under built-in Kotlin. newDsl: Flutter's Gradle plugin still uses the legacy
# applicationVariants API.
android.builtInKotlin=false
android.newDsl=false
